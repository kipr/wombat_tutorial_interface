baseURL = 'https://rclement-afk.github.io/Wombat-Tutorial-Interface/'
locale = 'en-us'
title = 'KIPR · Botball Explorer'

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap']

[markup.goldmark.renderer]
  # Worksheets interleave prose with hand-written markup, so raw HTML has to
  # pass through rather than being escaped.
  unsafe = true

[markup.goldmark.extensions.typographer]
  # Source text already contains the correct curly quotes, dashes and ellipses.
  # Leave them exactly as written.
  disable = true

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[markup.goldmark.parser.attribute]
  # Lets a paragraph or list carry a class, e.g. a trailing {.muted} line,
  # without dropping into raw HTML.
  block = true

[markup.highlight]
  # Chroma emits semantic token classes. Keeping the palette in our own CSS
  # gives the worksheets one consistent screen and print theme for every
  # language instead of baking colours into each generated code block.
  codeFences = true
  guessSyntax = false
  lineNos = false
  noClasses = false
  wrapperClass = 'code'

# Images still live beside the current site while the migration is in progress.
[[module.mounts]]
  source = 'content'
  target = 'content'
[[module.mounts]]
  source = 'static'
  target = 'static'
[[module.mounts]]
  source = 'assets'
  target = 'assets'
[[module.mounts]]
  source = 'layouts'
  target = 'layouts'
[[module.mounts]]
  source = 'data'
  target = 'data'
[[module.mounts]]
  source = 'docs/img'
  target = 'static/img'
[[module.mounts]]
  source = 'docs/kipr-logo.png'
  target = 'static/kipr-logo.png'
[[module.mounts]]
  source = 'docs/botguy.png'
  target = 'static/botguy.png'
[[module.mounts]]
  source = 'docs/Explorer_2026_CheatSheet.pdf'
  target = 'static/Explorer_2026_CheatSheet.pdf'
[[module.mounts]]
  source = 'docs/score.html'
  target = 'static/score.html'

