{{- $key := index .field "key" -}}
{{- $label := index .field "label" -}}
{{- if not $key }}{{ errorf "%s: text input needs a key" .position }}{{ end -}}
{{- if not $label }}{{ errorf "%s: text input %q needs a label" .position $key }}{{ end -}}
{{- $id := replace $key "_" "-" -}}
<label for="{{ $id }}"{{ if .labelHidden }} class="visually-hidden"{{ end }}>{{ $label }}</label><input type="text" id="{{ $id }}" data-key="{{ $key }}"{{ with index .field "placeholder" }} placeholder="{{ . }}"{{ end }}{{ if isset .field "value" }} value="{{ index .field "value" }}"{{ end }}{{ if .autocompleteOff }} autocomplete="off"{{ end }}>
