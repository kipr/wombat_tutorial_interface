<!-- ===== Sticky top bar + PIN / submit row ===== -->
<div class="topbar no-print">
  <div class="topbar-inner">
    <a class="brand" href="{{ partial "relative-url.html" (dict "source" . "path" "index.html") }}">KIPR · Botball <span>Explorer</span></a>
      <nav class="mainnav" aria-label="Main">{{ range hugo.Data.nav }}{{ partial "navigation-link.html" (dict "source" $ "item" . "activeClass" "here") }}{{ end }}</nav>
    {{ partial "theme-toggle.html" . }}
  </div>
{{- if .Params.mission_id }}
  <div class="pinbar">
    <div class="pin-field">
      <label for="pin">Your PIN</label>
      <input id="pin" type="text" inputmode="numeric" autocomplete="off"
             maxlength="8" placeholder="••••" aria-label="Your student PIN" />
    </div>
    <button class="submit-btn" id="submitTop">Submit &amp; Download</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>
{{- end }}
</div>
