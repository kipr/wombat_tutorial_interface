{{- /* Only emitted when the rendered page actually used the matching widget. */ -}}
{{- if .Store.Get "usedTerms" }}
<div class="def-overlay" id="defOverlay" role="dialog" aria-modal="true" aria-labelledby="defTerm" hidden>
  <div class="def-box">
    <div class="def-head">
      <span class="def-head-term" id="defTerm"></span>
      <button class="def-close" id="defClose" aria-label="Close definition">&#10005;</button>
    </div>
    <div class="def-body" id="defBody"></div>
  </div>
</div>
{{- end }}
{{- if .Store.Get "usedFigures" }}
<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-labelledby="zcap">
  <button class="zclose" id="zclose" aria-label="Close picture">&#10005;</button>
  <img id="zimg" src="" alt="">
  <p class="zcap" id="zcap"></p>
</div>
{{- end }}
