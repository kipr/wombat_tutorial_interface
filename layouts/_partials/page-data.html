{{- /* Ship only the resolved glossary and mission entries referenced here. */ -}}
{{- $terms := .Store.Get "usedTerms" -}}
{{- $missions := .Store.Get "usedMissions" -}}
{{- if or $terms $missions }}
<script>
{{- if $terms }}
  {{- $out := dict -}}
  {{- range $terms }}
    {{- $reference := partial "parse-reference.html" (dict "raw" . "position" $.File.Path) -}}
    {{- $resolved := partial "glossary-entry.html" (dict "reference" $reference "track" ($.Params.track | default "c") "position" $.File.Path) -}}
    {{- $out = merge $out (dict $resolved.lookup (dict "title" $resolved.title "body" $resolved.body)) -}}
  {{- end }}
window.KIPR_GLOSSARY = {{ $out | jsonify (dict "indent" "  ") | safeJS }};
{{- end }}
{{- if $missions }}
  {{- $out := dict -}}
  {{- range $missions }}
    {{- $reference := partial "parse-reference.html" (dict "raw" (printf "@%s" .) "position" $.File.Path) -}}
    {{- $resolved := partial "resolve-reference.html" (dict "reference" $reference "position" $.File.Path) -}}
    {{- $out = merge $out (dict $resolved.number $resolved.entry) -}}
  {{- end }}
window.KIPR_MISSIONS = {{ $out | jsonify (dict "indent" "  ") | safeJS }};
{{- end }}
</script>
{{- end }}
