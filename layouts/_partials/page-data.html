{{- /* Ship only the resolved glossary entries referenced on this page. */ -}}
{{- $terms := .Store.Get "usedTerms" -}}
{{- if $terms }}
<script>
  {{- $out := dict -}}
  {{- range $terms }}
    {{- $reference := partial "parse-reference.html" (dict "raw" . "position" $.File.Path) -}}
    {{- $resolved := partial "glossary-entry.html" (dict "reference" $reference "track" ($.Params.track | default "c") "position" $.File.Path) -}}
    {{- $out = merge $out (dict $resolved.lookup (dict "title" $resolved.title "body" $resolved.body)) -}}
  {{- end }}
window.KIPR_GLOSSARY = {{ $out | jsonify (dict "indent" "  ") | safeJS }};
</script>
{{- end }}
