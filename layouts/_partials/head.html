{{- $page := . -}}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ .Title }}</title>
<script src="{{ partial "relative-url.html" (dict "source" . "path" "js/theme.js") }}"></script>
{{- range .Params.styles | default (slice "site-base" "worksheet" "syntax" "print") }}
<link rel="stylesheet" href="{{ partial "asset.html" (dict "page" $page "path" (printf "css/%s.css" .)) }}" />
{{- end }}
