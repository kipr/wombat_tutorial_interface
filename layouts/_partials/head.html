{{- $page := . -}}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ .Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
{{- range .Params.styles | default (slice "site-base" "worksheet" "syntax" "print") }}
<link rel="stylesheet" href="{{ partial "asset.html" (dict "page" $page "path" (printf "css/%s.css" .)) }}" />
{{- end }}
