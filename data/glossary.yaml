# Maintained canonical data for every definition popup and the glossary page.
# Competition definitions are curated from the official rules and marked source: rules.

"ABSTRACTION":
  title: "Abstraction"
  body: "Hiding the details behind a name so you can use something without thinking about how it works. You call drive_forward() without recalling every line inside it."
"ACCESSIBILITY":
  title: "Accessibility"
  body: "Designing so that as many people as possible can actually use the thing - including people who cannot see it, hear it, reach it, or hold it. A design that only works for some people is not finished."
"ACCOUNTABLE":
  title: "Accountable"
  body: "Being the person a job belongs to, so the team can fairly ask how it is going. Accountability needs everybody to know who had what - and it only works when the asking is kind rather than accusing."
"ACTUATOR":
  title: "Actuator"
  body: "A part that produces movement. Motors and servos are actuators - they are the robot's equivalent of a muscle."
"ALGORITHM":
  title: "Algorithm"
  body: "A list of steps that solves a problem. A recipe is an algorithm. So is the set of instructions you write for a robot."
"ANALOG":
  title: "Analog"
  body: "An analog sensor reports a value across a wide range rather than just 0 or 1. A reflectance sensor answers \"how dark is this?\" with a number, so you have to decide for yourself where dark begins."
"ARGUMENT":
  title: "Argument"
  body: "A piece of information you give a command, written inside its parentheses. motor() takes two arguments - the port and the power - separated by a comma."
"ARRAY":
  title: "Array"
  body: "A single name that holds a whole row of values instead of just one. You reach each value by its position number, so one name and a number can stand in for a dozen separate variables."
"ARTIFICIAL INTELLIGENCE":
  title: "Artificial Intelligence"
  body: "Software that uses information to work out what to do next, rather than following a fixed list of steps. Your robot reading a sensor and choosing an action is the same shape, just small enough to see all of."
"ATTRIBUTION":
  title: "Attribution"
  body: "Saying clearly where something came from when it is not yours. In code it means a comment naming whoever wrote the part you borrowed."
"AUTONOMOUS":
  title: "Autonomous"
  body: "The machine moves around on its own. No person is controlling it while it runs. You start it and step back."
"BLOCK":
  title: "Block"
  body: "Everything between an opening brace and its matching closing brace. A block groups statements together so the controller knows which ones belong to which function."
  python: "Everything at a given level of indentation. A block groups statements together so the controller knows which ones belong to which function."
"BLUETOOTH":
  title: "Bluetooth"
  body: "A short-range radio that lets two devices talk to each other without a cable. The EV3 Classroom app uses it to send your program across to the brick."
"BOOLEAN":
  title: "Boolean"
  body: "A value that can only be true or false - nothing in between. Every condition you write comes out as a boolean, which is how the robot decides which way to go."
"BOUNDARY":
  title: "Boundary"
  body: "The line that marks the edge of a zone or area. Whether an object is inside, outside, or touching the boundary is often the difference between scoring and not scoring."
"BRICK":
  title: "Brick"
  body: "The robot's brain - a small computer with a battery, a screen, buttons, four lettered motor ports on top, four numbered sensor ports on the bottom, and a radio inside. Programs run on the brick, not on your tablet."
"BRICK_MEMORY":
  title: "On the Brick"
  body: "When you download a program, the brick saves its own copy, filed under your project's name. The brick holds many programs at once and can run any of them from its own buttons, with no tablet connected."
"BYSTANDER":
  title: "Bystander"
  body: "Somebody who sees unkindness happening but is not the one doing it or the one it is aimed at. Bystanders are usually the largest group, which is why what they do matters so much."
"CALIBRATION":
  title: "Calibration"
  body: "Measuring your own robot to find the numbers that describe it - ticks per inch, a light threshold, a turn count. Calibration is why one team's numbers do not work on another team's robot."
"CASTER":
  title: "Caster"
  body: "A small wheel that swivels freely instead of being driven. Pulled along behind the driven wheels it tracks straight; pushed from in front it wanders and has to swing round every time the robot changes direction."
"CHECKLIST":
  title: "Checklist"
  body: "A written list of everything that should be present or done, used to check the real thing against it. Engineers, pilots, and surgeons all use them, because remembering is unreliable and reading a list is not."
"CLAMP":
  title: "Clamp"
  body: "Forcing a value to stay inside a safe range. If a servo may only go from 200 to 1800, clamping turns any larger number into 1800 before it reaches the hardware."
"COMMENT":
  title: "Comment"
  body: "A note for humans that the computer ignores completely. Single-line comments start with two slashes. Block comments start with slash-star and end with star-slash."
  python: "A note for humans that the computer ignores completely. A single-line comment start with a \"#\". Block comments start and end with three quotation marks."
"COMMIT":
  title: "Commit"
  body: "A saved snapshot of your work in version control, with a note saying what you changed. A good commit message tells a future reader why, not just what."
"COMPILE":
  title: "Compile"
  body: "To translate the code you wrote into machine instructions the robot's processor can actually carry out. If compiling fails, the program cannot run."
"COMPILER":
  title: "Compiler"
  body: "The program that turns the code you wrote into instructions the robot's processor can carry out. When it finds something it cannot translate, it stops and tells you where."
"COMPLETELY":
  title: "COMPLETELY"
  body: "An object is COMPLETELY outside an enclosure or boundary when no portion of the object is touching or overlapping that enclosure or boundary."
  source: "rules"
"COMPUTATION":
  title: "Computation"
  body: "The part of a robot that decides what to do. On your robot that is the Wombat running the program you wrote."
"CONDITION":
  title: "Condition"
  body: "The question inside the parentheses of an if or a while. It compares two values and comes out either true or false. There is no in between - every condition is one or the other."
  python: "An expression that Python checks to decide whether an if block runs or a while loop repeats. Python treats the expression as true or false; it does not need parentheses and does not have to compare two values."
"CONSTRAINT":
  title: "Constraint"
  body: "A limit your design has to stay inside - how big, how small, how much you have to spend, what parts you are allowed. A requirement says what it must do; a constraint says what it may not exceed."
"CONTROLLER":
  title: "Controller"
  body: "The small computer that runs your robot. Yours is a KIPR Wombat. It holds your programs, powers the motors, and reads the sensors."
"CONTROLLED OBJECT":
  title: "Controlled Object"
  body: "A Controlled Object is any game object being carried, lifted, supported, restrained, held, pushed, pulled, trapped, or otherwise actively manipulated by a robot. Brief incidental contact does not constitute control."
  source: "rules"
"CYBERBULLYING":
  title: "Cyberbullying"
  body: "Using messages, posts, photos, or group chats to hurt, frighten, or humiliate somebody. It is different from a disagreement - it usually keeps going, and it usually has an audience."
"DATA SET":
  title: "Data Set"
  body: "A group of related values collected for one purpose and considered together. A table of sensor readings, several calibration results, or an array of run times is a data set you can analyze for patterns and use to make decisions."
"DEBUGGING":
  title: "Debugging"
  body: "Finding out why a program does not do what you meant, and fixing it. The skill is not writing perfect code; it is narrowing down where the trouble actually is."
"DECISION":
  title: "Decision"
  body: "A point where a plan splits two ways depending on the answer to a question. On a flowchart it is drawn as a diamond, with one arrow in and two labelled arrows out."
"DECOMPOSITION":
  title: "Decomposition"
  body: "Breaking a big problem into smaller problems you can solve one at a time. Almost every hard robot task becomes easy once it is decomposed far enough."
"DESIGN PROCESS":
  title: "Design Process"
  body: "The ordered set of steps engineers use to turn a problem into something that works. It is a loop, not a line - testing sends you back to change your design and try again."
"DIGITAL":
  title: "Digital"
  body: "A digital sensor has only two possible readings: 0 or 1. It works like a light switch - pressed or not pressed, with nothing in between. In programming, 1 means true, yes, on; 0 means false, no, off."
"DIGITAL CITIZENSHIP":
  title: "Digital Citizenship"
  body: "Behaving well in a place where you cannot see anybody's face. It covers how you treat other people online, how you protect your own information, and what you do when you see somebody being hurt."
"EFFECTOR":
  title: "Effector"
  body: "The part of a robot that changes the state of the robot itself or the state of the world. Motors, arms, and legs are effectors, and so are buzzers, lights, and speakers. Its shape decides what jobs it is good at. A bulldozer blade pushes well and grabs nothing; a claw grabs well and pushes badly."
"ENCLOSURE":
  title: "Enclosure"
  body: "A PVC frame on the game field that objects can be placed inside. Missions that ask for something to be IN an enclosure are asking you to get it past those walls."
"ENCODER":
  title: "Encoder"
  body: "The counter built into a motor that reports how far its shaft has turned. On the Wombat, it is measured in ticks, and it is how a robot measures its own movement instead of guessing."
"ENCRYPTION":
  title: "Encryption"
  body: "Scrambling a message so that only the intended reader can unscramble it. Anyone who intercepts it along the way sees nonsense."
"END USER":
  title: "End User"
  body: "Whoever the thing is actually being built for. Not you, and not the person marking it. They know things you do not, which is why you ask them before you build rather than after."
"FEEDBACK":
  title: "Feedback"
  body: "Somebody telling you what they actually saw, so you can make the thing better. It is not a mark and it is not criticism - people give it because they want the work to succeed."
"FIREWALL":
  title: "Firewall"
  body: "Software that decides what is allowed in and out of a network, like a gate with a guard on it. Schools use them to keep harmful things off their computers."
  source: "rules"
"FLOWCHART":
  title: "Flowchart"
  body: "A drawing of a plan, using shapes joined by arrows. Engineers everywhere use the same shapes, so a flowchart can be read by someone who does not speak your language."
"FOR LOOP":
  title: "For Loop"
  body: "A loop that repeats a known number of times. Its three parts - where to start, when to stop, and how much to change each time - all sit together inside one set of parentheses, separated by semicolons."
  python: "A loop that repeats once for each item in a sequence - often a range of numbers or a list. Python writes the sequence after the word in; there are no semicolons and no separate start/stop/step slots in parentheses."
"FULLY WITHIN":
  title: "FULLY WITHIN"
  body: "An object or robot is FULLY WITHIN an area when every part lies inside the interior vertical projection of that area's boundaries."
  source: "rules"
"FUNCTION":
  title: "Function"
  body: "A named set of instructions. Calling a function means telling the controller to carry out everything inside it. A clean_house() function might mean vacuum, dust, and mop - you call it once and all of it happens."
"HARDWARE":
  title: "Hardware"
  body: "The physical body of a machine - the parts you could drop on your foot. Hardware can do things but cannot decide anything."
"HAT BLOCK":
  title: "Hat Block"
  body: "A block with a curved top that nothing can snap above. It marks where a program starts. When you press Run, the robot begins at the hat and works its way down."
"HEADER FILE":
  title: "Header File"
  body: "A file ending in .h that holds functions you want other programs to be able to use. You bring it into a program with an #include line at the top."
"HUB":
  title: "Hub"
  body: "The robot's brain - a small computer with a battery, a 5x5 light grid, six lettered ports, and a radio inside. Programs run on the hub, not on your tablet."
"IDE":
  title: "IDE"
  body: "Short for Integrated Development Environment. It is the place where you write your code, check it for mistakes, and send it to the robot. Yours is called the KISS IDE."
"IN":
  title: "IN"
  body: "An object is IN a container, enclosure, basket, or zone when any portion extends into its interior space, unless a mission says otherwise."
  source: "rules"
"IN THE ZONE":
  title: "IN THE ZONE"
  body: "A robot is IN A ZONE when touching the specified zone and not touching any black line boundary or adjacent zone."
  source: "rules"
"INDEX":
  title: "Index"
  body: "The position number that picks one item out of an array or list. Indexes usually start at 0, so the first item is index 0, not index 1."
  python: "The position number that picks one item out of a list. Indexes usually start at 0, so the first item is index 0, not index 1."
"INERTIA":
  title: "Inertia"
  body: "A moving object keeps moving until something stops it. When your loop shuts the motors off, the robot is still rolling, so it coasts past the tick count you asked for. More speed means more coasting."
"IF STATEMENT":
  title: "If Statement"
  body: "A decision structure that checks a condition and runs its block only when that condition is true. An optional else block gives the program something different to do when the condition is false. The if statement is the whole structure; the condition is the true-or-false question it checks."
"INPUT":
  title: "Input"
  body: "Information coming into a system from outside - a sensor reading, a button press, a light coming on. Without input a machine has no idea what is going on around it."
"INTEGER":
  title: "Integer"
  body: "A whole number - no fraction, no decimal point. Servo positions, motor ports, and power levels are all integers, which is why they are declared with int."
"INTELLECTUAL PROPERTY":
  title: "Intellectual Property"
  body: "Something a person made with their mind rather than their hands - code, writing, music, a design. It still belongs to whoever made it, even though you can copy it in a second."
"IP ADDRESS":
  title: "IP Address"
  body: "A number that identifies one machine on a network - like a building address. Your browser uses it to find your Wombat."
"KEY":
  title: "Key"
  body: "The rule that turns a scrambled message back into a readable one. Whoever holds the key can read the message; whoever does not, cannot. Keeping the key safe matters more than keeping the method secret."
"LEGAL STARTING POSITION":
  title: "Legal Starting Position"
  body: "A robot is in a LEGAL STARTING POSITION when fully within the vertical projection of any starting box and otherwise compliant with all starting requirements."
  source: "rules"
"LIBRARY":
  title: "Library"
  body: "A collection of functions kept in a separate file that any program can include. Including the KIPR library gives your program every command it needs to run motors, servos, and sensors. Your own library gives you the commands you invented."
"LIST":
  title: "List"
  body: "Python's way of holding a set of values under one name. You reach each value by its index, so one name and a number can stand in for many separate variables."
"MILESTONE":
  title: "Milestone"
  body: "A point in a plan where something has to be finished before the next thing can start. Milestones are how you find out you are behind while there is still time to do something about it."
"MODEL":
  title: "Model"
  body: "A simplified representation of something real that helps a system describe it, predict what will happen, or decide what to do. A ticks-per-inch relationship is a mathematical movement model; stored x, y, and heading values are a pose model of where a robot believes it is."
"MODULARITY":
  title: "Modularity"
  body: "Building a program out of separate pieces that each do one job. Modular code is easier to test, easier to fix, and easier to reuse somewhere else."
"MODULE":
  title: "Module"
  body: "A separate Python file holding functions you want to use elsewhere. You bring it into a program with an import line, the same way C brings in a header file."
"MODULO":
  title: "Modulo"
  body: "The remainder left over after dividing. 7 modulo 3 is 1, because 3 goes into 7 twice with 1 left. It is how a program makes something repeat in a cycle."
"NESTED":
  title: "Nested"
  body: "One structure placed inside another - an if inside an if, or an if inside a while. The inner one is only reached when the outer one lets the robot get that far."
"OFF":
  title: "OFF"
  body: "An object is OFF a line, tape, boundary, or zone edge when no portion is touching it."
  source: "rules"
"ON TOP OF":
  title: "On Top Of"
  body: "An object is ON TOP OF another when in direct contact with the uppermost surface of the target. If there is no horizontal upper surface, the surface closest to horizontal is used. Additional support from a robot, field element, or structure is permitted unless a mission says otherwise."
  source: "rules"
"ONE-WHEEL TURN":
  title: "One-Wheel Turn"
  body: "One wheel drives while the other stays stopped. The robot swings around the stopped wheel. Giving the moving wheel more power makes the swing faster, not tighter."
"OUTPUT":
  title: "Output"
  body: "Something a system does to the world - a motor turning, a claw closing, a message on a screen. Output is the only part of a program anyone can actually see."
"OVERSHOOT":
  title: "Overshoot"
  body: "How far past your target the robot keeps going after the motors switch off. It happens because a moving robot cannot stop instantly. The faster you drive, the bigger the overshoot."
"PACKET":
  title: "Packet"
  body: "A small piece of a larger message, sent on its own. Big things do not travel well, so computers chop information into packets, send them separately, and rebuild the whole thing at the far end."
"PALLET":
  title: "Pallet"
  body: "A flat platform on the game field that a load sits on. Several missions ask you to move a pallet and whatever is stacked on it, together."
"PARAMETER":
  title: "Parameter"
  body: "A named slot in a function that receives a value when the function is called. The parameter is the slot; the argument is the value that gets put into it."
"PASSWORD":
  title: "Password"
  body: "The lock on everything else you own online. A strong one is long, mixes different kinds of character, and contains nothing anybody could look up about you."
"PERSONAL INFORMATION":
  title: "Personal Information"
  body: "Anything that could be used to work out who you are, where you are, or how to reach you. Single pieces often look harmless - it is putting several together that identifies somebody."
"PHISHING":
  title: "Phishing"
  body: "A message that pretends to be from someone you trust so that you hand over private information without thinking. It usually creates panic or excitement so you act before you check."
"PORT":
  title: "Port"
  body: "A socket on the Wombat where you plug something in. Motor ports are numbered 0, 1, 2, and 3. The number in your code tells the controller which socket to send power to."
  python: "A socket on the Wombat where you plug something in. Digital sensor ports are 0-9. The number in your code tells the controller which socket to read."
"PORT NUMBER":
  title: "Port Number"
  body: "A number that tells the browser which service to reach on that machine - like which door to knock on. The Wombat's programming tools always use 8888."
"PROPRIOCEPTIVE":
  title: "Proprioceptive"
  body: "Sensing your own body rather than the world outside it. Motor encoders are proprioceptive - they tell the robot how far its own wheels have turned."
"PROTOCOL":
  title: "Protocol"
  body: "The set of rules both ends agree on before any message is sent - how packets are numbered, what happens if one goes missing, how you know the message is finished. Without a shared protocol, arriving packets are just a pile."
"PROTOTYPE":
  title: "Prototype"
  body: "A single line near the top of your program announcing that a function name exists, before the compiler ever reaches the code that does the work. Like listing a word in a vocabulary list before defining it."
  senses:
    design:
      title: "Prototype"
      body: "A first version built to be tested rather than kept. It is supposed to reveal problems, so a prototype that fails has done its job."
"PRINT":
  title: "print"
  body: 'A Python function that displays text or values and ends with a new line. \n starts another new line inside the text. An f-string starts with f and uses curly-brace placeholders, such as {score}, to insert values into a message.'
"PRINTF":
  title: "printf"
  body: 'A C function that prints formatted text. \n starts a new line, and placeholders such as %d mark where supplied values appear. Values fill the placeholders from left to right.'
"PSEUDOCODE":
  title: "Pseudocode"
  body: "Literally \"false code.\" Your plan written in plain language as comments, before you write any real code. It keeps you from getting lost in the middle of a program."
"RADIUS TURN":
  title: "Radius Turn"
  body: "Both wheels turn the same direction but at different speeds, so the robot sweeps a curved arc. How sharp the arc is depends on how different the two power numbers are. Also called an arc turn."
"RECOMMENDATION_ENGINE":
  title: "Recommendation Engine"
  body: "A computer program that takes information about you and uses it to suggest things you might like. The suggestions are only as good as the instructions the engine was given."
"REFLECTANCE":
  title: "Reflectance"
  body: "A sensor that shines a small light downward and measures how much bounces back. Light surfaces bounce back a lot and give a low reading; dark surfaces absorb the light and give a high one."
"REMOTE CONTROL":
  title: "Remote Control"
  body: "A person drives every movement in real time. The machine makes no decisions of its own."
"REPOSITORY":
  title: "Repository"
  body: "The stored home of a project under version control - all its files plus the full history of every change ever made to them."
"REQUIREMENT":
  title: "Requirement"
  body: "Something your design must do to count as working, written so it can actually be tested. \"Strong\" is not a requirement. \"Holds a full can for thirty seconds without leaning\" is."
"RETURN VALUE":
  title: "Return Value"
  body: "The answer a function hands back to whatever called it. A function that returns a value can be used inside a calculation; a void function cannot."
"SEMI-AUTONOMOUS":
  title: "Semi-Autonomous"
  body: "A mix - the machine handles some things itself while a person directs the rest."
"SEMICOLON":
  title: "Semicolon"
  body: "The punctuation mark that ends a statement in C. It does the same job as the full stop at the end of a sentence - it says this instruction is finished, move on to the next one."
"SENSOR":
  title: "Sensor"
  body: "A device that turns something physical - a touch, a brightness, a distance - into a number your program can read. Sensors allow a robot to gather information about the world instead of just assuming."
"SENSOR FUSION":
  title: "Sensor Fusion"
  body: "Combining readings from more than one sensor to work out something neither could tell you alone. Two sensors disagreeing is itself information."
"SERVO":
  title: "Servo"
  body: "A motor that rotates to a position you choose, rather than simply spinning. It has a range of about 180 degrees, divided into 2048 numbered positions, and holds at whatever position you send it to."
"SERVO HORN":
  title: "Servo Horn"
  body: "The arm that clips onto the spline and carries whatever the servo has to move. Where the horn points when you push it on decides where the servo's range of movement begins."
"SIMULTANEOUSLY":
  title: "SIMULTANEOUSLY"
  body: "Two or more conditions are SIMULTANEOUS if all are true at the same moment. No minimum duration is required unless a mission specifies one."
  source: "rules"
"SLOT":
  title: "Program Slot"
  body: "A numbered parking space on the hub where a program is stored. The hub holds many programs at once and can run any of them from its own buttons, with no tablet connected."
  senses:
    mechanical:
      title: "Slot"
      body: "A long narrow opening a pin can travel along. Because the pin can slide as well as push, a slot lets two parts stay connected while the distance between them changes."
"SOFTWARE":
  title: "Software"
  body: "The instructions a machine follows. Software can decide things but cannot move anything on its own."
"SPLINE":
  title: "Spline"
  body: "The toothed shaft on top of a servo - the part that actually turns. The teeth let a horn grip it in a fixed position instead of slipping."
"STACK":
  title: "Stack"
  body: "Blocks snapped together in a column. The robot runs a stack from the top down, one block at a time - each block is one instruction."
"STATE":
  title: "State"
  body: "What a system is currently doing or holding - where the robot is, what it is carrying, how many cubes it has stacked. State is the information a program keeps track of as it runs."
"STATEMENT":
  title: "Statement"
  body: "One instruction for the robot to carry out. Statements run in the order they are written, top to bottom, and each one ends with a semicolon."
  python: "A complete instruction that Python can execute. Simple statements are usually written one per line, while statements such as if and loops introduce an indented block of code."
"STEERING":
  title: "Steering"
  body: "The number on a move block that bends the robot's path. 0 is straight. Positive numbers curve the path to the right, negative numbers curve it to the left - and the bigger the number, the sharper the curve."
"STRING":
  title: "String"
  body: "Text stored as data - letters, digits, and spaces treated as characters rather than as a number you can do arithmetic with."
"TANGIBLE":
  title: "Tangible"
  body: "Something you could point at and agree on. A tangible goal is one where everybody would give the same answer to \"did it happen?\" - unlike \"get better at robotics\", which two people could argue about forever."
"THRESHOLD":
  title: "Threshold"
  body: "The number you choose as your dividing line. Readings below it count as one thing, readings above it count as another. A common starting point is halfway between your white and black readings, then you adjust from there."
"TICK":
  title: "Tick"
  body: "One small step of the motor shaft. There are about 1820 ticks in one full revolution of the shaft. Ticks count the motor turning, not the distance travelled - how far that is depends on your wheels."
"TOUCHING":
  title: "Touching"
  body: "Two objects are TOUCHING only when in direct physical contact. Contact through a robot, attachment, field element, or another game object does not count."
  source: "rules"
"TRADE-OFF":
  title: "Trade-off"
  body: "What you give up in order to get something else. New technology rarely just adds - it swaps one set of problems for another, and judging it means looking at both sides."
"VARIABLE":
  title: "Variable"
  body: "A name that holds a value. You set it once, then use the name everywhere instead of the number. Change the value in one place and every use of that name changes with it."
"VELOCITY":
  title: "Velocity"
  body: "How fast something moves, measured in real units - ticks per second rather than a percentage of full power. Velocity holds steady as the battery drains; power does not."
"VERSION CONTROL":
  title: "Version Control"
  body: "A system that keeps every version of your files as you change them, so you can see what changed, go back to an older version, and work alongside other people without overwriting them."
"VOID":
  title: "Void"
  body: "A function marked void does a job but hands nothing back. ao() is void - it stops the motors but gives you no answer. Functions like digital() and gmpc() are not void, because they hand you a number."
"WHILE LOOP":
  title: "While Loop"
  body: "A loop that checks a condition before each pass and repeats a block while that condition is true. When the condition reads a sensor, the robot can keep acting and checking the world until the sensor tells it to stop or change what it is doing."
"ZERO RADIUS TURN":
  title: "Zero Radius Turn"
  body: "The two wheels turn in opposite directions, so the robot spins in place without traveling forward or backward. Also called a pivot turn or spin turn. This is the turn you use when you need an exact angle."

# Mechanical Design curriculum: canonical definitions imported from the challenge sheets.
"ENGINEERING":
  title: "Engineering"
  body: "The branch of STEM concerned with designing, building, and using engines, machines, and structures. Science asks what is true. Engineering asks what can be made."
"ENGINEERING DESIGN PROCESS":
  title: "Engineering Design Process"
  body: "A repeatable way of working through a design problem: define the problem, determine the needs, determine the constraints, break it into steps, then check whether the result meets the needs. If it does not, go back and refine."
"NEED":
  title: "Need"
  body: "What a design has to accomplish, written plainly enough that you can tell whether it happened. \"Lift four poms into a container\" is a need. \"Be good at lifting\" is not."
"ADDED VALUE":
  title: "Added Value"
  body: "Something beyond the minimum requirement that makes a design genuinely better. Meeting the need gets you a working machine. Added value gets you a good one."
"ITERATION":
  title: "Iteration"
  body: "Building a version, testing it, learning something, and building a better version. Engineers expect the first version to be wrong. That is what it is for."
"SUCCESS RATE":
  title: "Success Rate"
  body: "How often a machine actually works, measured by running it a set number of times and counting the successes. Nine successes out of ten runs is a 90% success rate. It is a count, not an impression."
"MESH":
  title: "Mesh"
  body: "The place where the teeth of two gears interlock. Once two gears mesh, neither can turn without turning the other."
"GEAR RATIO":
  title: "Gear Ratio"
  body: "The comparison of tooth counts between two meshed gears, written driven:drive. A 16-tooth gear driven by an 8-tooth gear is 16:8, or 2:1 — the drive gear turns twice for every one turn of the driven gear."
"TORQUE":
  title: "Torque"
  body: "Just as a linear force is a push or a pull, a torque can be thought of as a twist to an object. Gearing down trades rotation speed for a stronger twist."
"IDLER GEAR":
  title: "Idler Gear"
  body: "A gear placed between two others. It reverses the direction of rotation twice, so the two outer gears end up turning the same way. It changes direction without changing speed."
"COMPOUND GEARING":
  title: "Compound Gearing"
  body: "Two or more gear stages chained by putting two gears on a shared axle so they turn at the same rate. The stage ratios multiply: two 3.75:1 stages make a 14.06:1 train."
"DRIVE GEAR":
  title: "Drive Gear"
  body: "The gear in a pair that is turned by the motor or by the previous stage. It is where the motion comes in."
"DRIVEN GEAR":
  title: "Driven Gear"
  body: "The gear in a pair that gets turned by the drive gear. It is where the motion goes out — slower and stronger, or faster and weaker, depending on the ratio."
"PINCER":
  title: "Pincer"
  body: "A grabber in which both sides of the claw move toward each other. In a simpler claw, one side is fixed and only the other moves — which shoves the object sideways as it closes."
"DEPLOYMENT":
  title: "Deployment"
  body: "The moment a machine changes from its folded starting shape into its working shape. A robot that unfolds an arm after the match begins is deploying it."
"REACH":
  title: "Reach"
  body: "The farthest point a machine can get to — how high, or how far out. Reach is measured when the machine is fully extended, not when it is folded up."
"CENTER OF GRAVITY":
  title: "Center of Gravity"
  body: "The single point where all of an object’s weight can be treated as acting. If that point stays above the base, the object stands. If it passes beyond the edge of the base, the object tips."
"STABILITY":
  title: "Stability"
  body: "How well a machine resists tipping, shifting, or wobbling while it works. A stable machine does not need a hand on it."
"MOMENT ARM":
  title: "Moment Arm"
  body: "The distance from a pivot to where a load sits. The longer the moment arm, the harder a motor has to work to hold the same weight."
"BACKLASH":
  title: "Backlash"
  body: "The small amount of free play between meshed gear teeth. It lets a part wiggle slightly before the gear catches, which is why a mechanism may not stop in exactly the same spot every time."
"RANGE OF MOTION":
  title: "Range of Motion"
  body: "How far a part can travel from one end of its movement to the other, usually measured in degrees for something that rotates."
"DEGREES OF FREEDOM":
  title: "Degrees of Freedom"
  body: "The number of independent ways a mechanism can move. Count the joints that can be driven separately — if two parts are geared together so one cannot move without the other, they count as one, not two."
"OUNCE INCH":
  title: "Ounce-Inch"
  body: "The unit of torque used in this challenge, written oz-in. One ounce of weight sitting one inch from the pivot is one ounce-inch. Ten ounces at twelve inches is 120 oz-in."
"COUNTERWEIGHT":
  title: "Counterweight"
  body: "Weight placed on the opposite side of a pivot from the load. Its torque works in the other direction, so it subtracts from the total the motor has to fight."
"GEAR REDUCTION":
  title: "Gear Reduction"
  body: "Gearing arranged so the output turns slower than the input, which multiplies torque. A 3.75:1 reduction means the motor feels 3.75 times less torque — and must turn 3.75 times as far."
"CRANK":
  title: "Crank"
  body: "A wheel or arm with a pin set off to one side of its center. As the wheel turns, the pin travels in a circle, and anything linked to that pin gets driven back and forth."
"ROTARY MOTION":
  title: "Rotary Motion"
  body: "Motion that turns around a center point. A spinning axle, a wheel, a motor shaft. This is the only kind of motion a motor makes on its own."
"LINEAR MOTION":
  title: "Linear Motion"
  body: "Motion in a straight line. Sliding, pushing, lifting straight up. Most jobs a robot has to do need this kind of motion, not turning."
"STROKE":
  title: "Stroke"
  body: "How far a pushing part travels from the back of its motion to the front. In a crank, the stroke is exactly twice the distance from the wheel’s center to its pin."
"CONNECTING ROD":
  title: "Connecting Rod"
  body: "The link between the pin on a turning wheel and the part that slides. It is what carries the motion from the circle to the straight line."
"DEAD POINT":
  title: "Dead Point"
  body: "A position where the connecting rod and the crank arm line up straight. At that instant the mechanism has almost no ability to push, and a crank started there may jam instead of turning. Every crank has two, half a turn apart."
"CAM":
  title: "Cam"
  body: "A wheel that is not perfectly round. As it turns, the bulges in its edge push whatever is resting against it. The shape of the edge decides exactly when that push happens."
"FOLLOWER":
  title: "Follower"
  body: "The part that rides against the edge of a cam and gets pushed by it. It can be a rod, a wheel, or the end of an arm."
"CAM PROFILE":
  title: "Cam Profile"
  body: "The shape of a cam’s outer edge. A perfectly round profile does nothing. A profile with a raised section lifts the follower while that section passes underneath."
"INTERMITTENT MOTION":
  title: "Intermittent Motion"
  body: "Movement that happens now and then rather than continuously. A motor spinning steadily can produce intermittent motion at the other end of a cam."
"RETURN FORCE":
  title: "Return Force"
  body: "Whatever brings a follower back down after the cam has pushed it up. A cam can only push, never pull, so gravity, a spring, or a rubber band has to do the returning."
"FOUR-BAR LINKAGE":
  title: "Four-Bar Linkage"
  body: "A mechanism made of four links joined by four pivots. Three of the links move; the fourth is the fixed distance between the two anchored pivots. The lengths of the four links determine everything the mechanism can do."
"LINK":
  title: "Link"
  body: "One rigid bar in a mechanism. Links are joined at pivots, and each one keeps its length no matter how the mechanism moves."
"GROUND LINK":
  title: "Ground Link"
  body: "The link that does not move — the fixed distance between the two pivots anchored to the base. It is usually built into the frame rather than being a separate bar, which is why it is easy to miss when counting."
"COUPLER":
  title: "Coupler"
  body: "The link joining the crank to the rocker. It is the only link not attached to anything fixed, so points on it trace the most interesting paths in the mechanism."
"ROCKER":
  title: "Rocker"
  body: "The output link of a four-bar. It swings back and forth through part of a circle rather than turning all the way around."
"PARALLELOGRAM LINKAGE":
  title: "Parallelogram Linkage"
  body: "A four-bar where the crank and rocker are equal in length and the coupler and ground link are equal in length. The coupler then stays parallel to the ground link throughout the whole motion — useful for keeping a gripper or platform level."
"WORM":
  title: "Worm"
  body: "The screw half of a worm gear set. It looks like a threaded rod, and it is the part your motor turns. One full turn of the worm advances the wheel by exactly one tooth."
"WORM WHEEL":
  title: "Worm Wheel"
  body: "The toothed wheel driven by a worm. Its tooth count is the gear ratio of the pair — a 24-tooth wheel gives 24:1. People sometimes call the whole set a “worm gear,” so say worm wheel when you mean this part specifically."
"RIGHT-ANGLE DRIVE":
  title: "Right-Angle Drive"
  body: "A gear arrangement where the output shaft points 90° away from the input shaft. A worm gear is always a right-angle drive, which lets a motor lying flat turn something that spins about a vertical axis."
"SELF-LOCKING":
  title: "Self-Locking"
  body: "A drive that works in one direction only: the input can turn the output, but the output cannot turn the input. A worm gear holds its position with the power off, because the wheel simply cannot push the screw around."
"RACK":
  title: "Rack"
  body: "A straight bar with gear teeth along one edge. Think of it as a gear that has been unrolled flat — the teeth work exactly the same way, they are just arranged in a line instead of a circle."
"PINION":
  title: "Pinion"
  body: "The round gear that meshes with a rack. Turning the pinion walks its teeth along the rack and slides the rack sideways. One full turn moves the rack by the pinion’s own tooth count."
"TRANSLATION":
  title: "Translation"
  body: "Motion where every point on a part moves the same distance in the same direction, with no rotation at all. A part that only translates points the same way at the end of its travel as it did at the start."
"COULISSE":
  title: "Coulisse"
  body: "A mechanism built around a pin that rides inside a slot. The word is French for a groove or a slide. It is also called a slotted lever, because the slot is usually cut into a pivoted arm."
"CRANK PIN":
  title: "Crank Pin"
  body: "A pin fixed near the edge of a turning wheel, so that it travels in a circle. It is the part that carries the motion out of the wheel and into whatever the wheel is driving."
"OSCILLATION":
  title: "Oscillation"
  body: "Motion that repeats back and forth between two limits, like a pendulum or a swinging arm. It is different from rotation, which keeps going the same direction forever."
"QUICK RETURN":
  title: "Quick Return"
  body: "A cycle in which one stroke takes noticeably less time than the other, even though the driving wheel turns at a steady rate. It is useful when only one direction of the motion does real work."
"BEVEL GEAR":
  title: "Bevel Gear"
  body: "A gear whose teeth are cut on a slanted, cone-shaped face rather than a straight rim. Two of them meshed together carry a drive around a 90° corner while keeping the speed set by their tooth counts."
"INTERSECTING AXES":
  title: "Intersecting Axes"
  body: "Two shafts whose center lines cross at a single point. Bevel gears have intersecting axes. A worm and its wheel are also perpendicular, but their axes never meet — the worm sits off to one side."
"EFFICIENCY":
  title: "Efficiency"
  body: "How much of the energy going into a mechanism comes out the other end as useful work. Bevel gear teeth roll against each other and lose very little. A worm’s thread slides against the teeth, and much more is lost as heat."
"BACK-DRIVABLE":
  title: "Back-Drivable"
  body: "A drive whose output can turn its input. Bevel gears are back-drivable, so a vehicle can coast and can be pushed by hand. A worm gear is not, which is exactly what you want on a gripper and exactly what you do not want on a wheel."
"CHASSIS":
  title: "Chassis"
  body: "The frame of a vehicle — the structure everything else is mounted to. If the chassis flexes, gears shift out of mesh and the vehicle wanders, no matter how good the mechanism is."
"GENEVA DRIVE":
  title: "Geneva Drive"
  body: "A mechanism where a pin on a turning wheel enters slots cut into a second wheel, advancing it one exact step per turn and leaving it locked in between. Also called the Maltese cross mechanism, because of the shape of the slotted wheel."
"DWELL":
  title: "Dwell"
  body: "The part of a cycle where the output does not move at all. In a Geneva drive most of every cycle is dwell — the output holds still far longer than it moves."
"INDEXING":
  title: "Indexing"
  body: "Moving something forward by one exact, repeatable step. An indexing mechanism does not stop wherever you switch it off; it stops at the positions built into its parts."
"DRIVE PIN":
  title: "Drive Pin"
  body: "The pin near the rim of the driving wheel. It swings into a slot, pushes the slotted wheel around by one step, and swings back out again."
"LOCKING":
  title: "Locking"
  body: "Physically preventing a part from moving by means of shape rather than friction or motor effort. In a Geneva drive a raised disc on the driver blocks the slotted wheel between steps, so nothing can nudge it out of position."
"DISPLACEMENT":
  title: "Displacement"
  body: "How far something ends up from where it started — measured from the beginning of a stroke to the end of it. Not the length of any part, and not how far the motor turned."
"SERIES":
  title: "Series"
  body: "Two or more mechanisms arranged so the output of one becomes the input of the next. The motor drives the first, the first drives the second, and the last one does the actual job."
"INTERFACE":
  title: "Interface"
  body: "The place where one mechanism connects to another. Interfaces are where most machines fail, because each one is a join that can loosen, bind, or come apart."
"PLANAR MOTION":
  title: "Planar Motion"
  body: "Movement that stays within a single flat surface. An object moving this way can slide two directions and rotate, and nothing else — three motions in total."
"PARALLEL MECHANISM":
  title: "Parallel Mechanism"
  body: "A machine where several drives all connect to the same output platform at once. The load is shared between them, which makes it stiff and accurate, but it cannot reach as far as a chain of the same size."
"SERIAL MECHANISM":
  title: "Serial Mechanism"
  body: "A machine where joints are stacked one after another, each carrying everything past it. It reaches a long way, but it flexes at the far end and its errors add up along the chain."
"WORKSPACE":
  title: "Workspace"
  body: "The whole region a machine’s output can actually reach. A parallel mechanism trades a smaller workspace for stiffness and accuracy inside it."
"SCISSOR LIFT":
  title: "Scissor Lift"
  body: "A lift built from pairs of links crossed in an X and pinned at their centres. Pushing the bottom ends together raises the stack; letting them spread folds it flat. The platform stays level because both sides of every X are the same length."
"MECHANICAL ADVANTAGE":
  title: "Mechanical Advantage"
  body: "How many times more force comes out of a machine than went into it. A mechanical advantage of 10 means a 1-pound push produces a 10-pound lift — over one tenth of the distance."
"WORK":
  title: "Work"
  body: "Force multiplied by distance. A machine cannot give out more work than is put in, which is why every gain in force is paid for with distance and every gain in speed is paid for with force."
"LOAD":
  title: "Load"
  body: "The weight or force a mechanism has to move or hold. Sizing a mechanism starts with knowing the load, because everything else follows from it."
"SLIDING END":
  title: "Sliding End"
  body: "The end of a link that is free to travel rather than being pinned in place. A scissor lift needs one fixed end and one sliding end at each level, or it cannot change height at all."
"DRIVING LINK":
  title: "Driving Link"
  body: "The link a motor turns — the input to the whole mechanism. In this crane it is the short link running down to the base pivot, shown blue in the video. Every other part follows from where it is pointing."
"UNIVERSAL JOINT":
  title: "Universal Joint"
  body: "A coupling made of two forked ends joined by a cross-shaped pin. It carries rotation from one shaft to another through a bend, at almost any angle, without either shaft having to line up with the other."
"YOKE":
  title: "Yoke"
  body: "One of the forked ends of a universal joint. Each yoke pivots on one arm of the cross in the middle, and because the two arms are at right angles, the pair can bend in any direction."
"SHAFT ANGLE":
  title: "Shaft Angle"
  body: "The angle between an input shaft and the shaft it drives. Gears are manufactured for one particular shaft angle — spur gears for zero, bevel gears for ninety — so anything in between needs a joint instead."
"CONSTANT VELOCITY":
  title: "Constant Velocity"
  body: "A drive whose output stays exactly in step with its input at every instant. A single universal joint is not constant velocity: its output runs ahead and then falls behind, twice per revolution."
"DOUBLE JOINT":
  title: "Double Joint"
  body: "Two universal joints with equal and opposite bends, connected by a short shaft between them. The second joint undoes the unevenness the first one introduced, so the output comes out very nearly in step with the input."
"LINEAR TEETH":
  title: "Linear Teeth"
  body: "Gear teeth arranged in a straight line along a bar rather than around a wheel — a rack. Driven by a gear, a rack can travel out of its housing and make the whole mechanism longer than it started."
"EXTENSION":
  title: "Extension"
  body: "How far a mechanism grows beyond its retracted size. It is measured from where the machine ends when folded to where it ends when fully out."
"STAGE":
  title: "Stage"
  body: "One sliding section of an extending mechanism. Each stage is carried by the one before it, so a stage starts its own travel from wherever the previous one finished — which is why their reaches add together."
"OVERHANG":
  title: "Overhang"
  body: "The part of a machine that sticks out past its base with nothing underneath it. The further the overhang, the harder the base has to work to stay down."
"FOOTPRINT":
  title: "Footprint"
  body: "The area a machine actually stands on — the outline of its base seen from above. Anything reaching outside the footprint is overhang."
"UNIDIRECTIONAL DRIVE":
  title: "Unidirectional Drive"
  body: "A drive whose motor turns one way and never reverses. The mechanism, not the motor, is what makes the output change direction — which means nothing has to decide when to reverse."
"RECIPROCATION":
  title: "Reciprocation"
  body: "Back-and-forth motion between two limits. A crank turns continuous rotation into reciprocation, which is how a one-way motor drives something that has to go up and then down."
"COUPLER CURVE":
  title: "Coupler Curve"
  body: "The path traced by a point on the coupler of a linkage as the mechanism runs. It is usually neither a circle nor a straight line, and changing the link lengths changes its shape."
"STRAIGHT-LINE LINKAGE":
  title: "Straight-Line Linkage"
  body: "A four-bar with deliberately unequal links, arranged so that a chosen point on the coupler travels along a path that is very nearly a straight line. The cost is that the coupler rotates as it goes, so anything mounted on it tilts."
"LINEAR SLIDE":
  title: "Linear Slide"
  body: "A platform built to travel back and forth along one straight path and to do nothing else. The drive supplies the motion; the guides take away everything the drive did not ask for."
"GUIDE":
  title: "Guide"
  body: "A rail, track, or pair of surfaces that force a moving part to follow one path. Guides work best when they are long and set well apart — two short guides close together let a platform twist between them."
"SKEW":
  title: "Skew"
  body: "A moving part sitting crooked in its guides instead of square to them. A little is unavoidable; too much and the corners dig in."
"BINDING":
  title: "Binding"
  body: "When a mechanism jams because its parts are pressing against each other instead of sliding past. A slide that binds does not slow down gradually — it stops completely."
"CYCLICAL MOTION":
  title: "Cyclical Motion"
  body: "Motion that repeats the same sequence over and over without needing to be told to. A one-way motor driving a linkage produces it, which means nothing has to decide when to reverse."
"STIFFNESS":
  title: "Stiffness"
  body: "How much a structure resists bending under load. A stiff mechanism can appear to hold position without anything locking — but it gives way once the load is large enough, and it flexes a little even before then."
"DRIVE TRAIN":
  title: "Drive Train"
  body: "Everything between the motor and the thing being driven — shafts, gears, chains, and couplings. It does not have to be a single line from one to the other."
"BRANCHED DRIVE":
  title: "Branched Drive"
  body: "A drive train that splits, so one motor powers two or more outputs. Each branch can have its own gearing and therefore its own speed — but they all start and stop together, because they share the motor."
"TIP SPEED":
  title: "Tip Speed"
  body: "How fast the far end of a rotating arm is actually travelling. The shaft may turn slowly, but a point further out covers a much bigger circle in the same time, so it moves much faster."
"CONCENTRICITY":
  title: "Concentricity"
  body: "Two or more circular parts sharing exactly the same center. A mounted gear is concentric when its center sits on the axis its shaft spins around — so the rim stays the same distance from the axis all the way around."
"ECCENTRIC":
  title: "Eccentric"
  body: "Mounted off-center. An eccentric gear still spins, but not around its own middle — its rim sweeps closer and farther once per revolution, so a mesh alternately jams and gaps on a steady beat."
"AXIS OF ROTATION":
  title: "Axis of Rotation"
  body: "The invisible straight line a spinning part rotates around. For a servo or motor, it runs straight through the middle of the output shaft."
