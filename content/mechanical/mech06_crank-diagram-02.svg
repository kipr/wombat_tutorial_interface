<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="pusher-title pusher-description" role="img" viewBox="0 0 620 440"><title id="pusher-title">A stationary crank-driven pom pusher: ½″ → at least 3″</title><desc id="pusher-description">Top view. The stationary base supports a crank, connecting rod, and guided sliding shaft. The solid push blade and pom show the starting position; dashed outlines show them after a push. Measure both pom positions from the same right edge of the station: start within one-half inch and finish at least three inches away. The blade must be at least three inches wide and three-quarters of an inch tall.</desc><defs><marker id="pusher-red-arrow" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#b4382b" d="m0 0 10 5-10 5Z"/></marker><g id="pusher-pom"><path d="M0-13q4-4 7 1 6-1 6 5 5 3 0 7 4 5-1 8 0 6-6 5-4 5-8 0-6 3-8-3-6-1-3-7-5-4 0-8-1-6 5-6 3-6 8-2Z"/><path fill="none" stroke-linecap="round" d="M-7-3q6-6 11-1m-8 9Q2 1 7 5"/></g></defs><g fill="#263340" font-family="Barlow, Arial, sans-serif"><text x="24" y="28" font-size="18" font-weight="600">Turn the crank. Push the pom. Keep the base still.</text><text x="24" y="51" fill="#697580" font-size="13">TOP VIEW · Solid = start position · Dashed = after the push</text><text x="40" y="92" fill="#36434f" font-size="14" font-weight="600">STATIONARY OBJECT</text><path fill="none" stroke="#697580" stroke-width="1.25" d="M64 100v24"/><text x="237" y="92" fill="#a83a30" font-size="14" font-weight="600">MOVING COMPONENT</text><text x="237" y="111" fill="#a83a30" font-size="12">crank + rod + sliding blade</text><rect width="320" height="204" x="40" y="125" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="8"/><rect width="300" height="184" x="50" y="135" fill="none" stroke="#e0e5e8" rx="4"/><g fill="#fff" stroke="#b7c1c9" stroke-width="1.25"><circle cx="56" cy="141" r="3"/><circle cx="344" cy="141" r="3"/><circle cx="56" cy="313" r="3"/><circle 