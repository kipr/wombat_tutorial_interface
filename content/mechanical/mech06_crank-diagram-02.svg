<svg viewBox="0 0 620 300" role="img" aria-label="Top view of the required device: a stationary base holds a crank-driven arm that pushes a blade to the right, moving a pom from within one-half inch of the station to at least three inches away." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#444444"></path>
          </marker>
          <marker id="tickL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M1,0 L1,10" stroke="#444444" stroke-width="1.6"></path>
          </marker>
          <marker id="tickR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M9,0 L9,10" stroke="#444444" stroke-width="1.6"></path>
          </marker>
        </defs>

        <path d="M330,44 q10,0 10,10 v18 q0,10 10,10 q-10,0 -10,10 v18 q0,10 -10,10" fill="none" stroke="#C0392B" stroke-width="2.5"></path>
        <text x="322" y="66" text-anchor="end" font-family="'Barlow Condensed',sans-serif" font-size="19" font-weight="700" fill="#C0392B">MOVING</text>
        <text x="322" y="86" text-anchor="end" font-family="'Barlow Condensed',sans-serif" font-size="19" font-weight="700" fill="#C0392B">COMPONENT</text>

        <rect x="96" y="120" width="180" height="120" rx="3" fill="#F2F2F2" stroke="#444444" stroke-width="2"></rect>
        <text x="186" y="175" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="20" font-weight="700" fill="#444444">STATIONARY</text>
        <text x="186" y="197" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="20" font-weight="700" fill="#444444">OBJECT</text>

        <rect x="276" y="168" width="118" height="24" rx="2" fill="#FADBD8" stroke="#C0392B" stroke-width="2"></rect>

        <rect x="394" y="128" width="20" height="104" rx="2" fill="#C0392B" stroke="#922B21" stroke-width="2"></rect>
        <text x="404" y="118" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="600" fill="#922B21">PUSH BLADE</text>

        <line x1="424" y1="180" x2="536" y2="180" stroke="#444444" stroke-width="2.5" marker-end="url(#arrowR)"></line>

        <circle cx="466" cy="180" r="13" fill="#FFFFFF" stroke="#888888" stroke-width="2"></circle>
        <text x="466" y="215" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" fill="#888888">pom</text>

        <line x1="414" y1="262" x2="546" y2="262" stroke="#444444" stroke-width="1.6" marker-start="url(#tickL)" marker-end="url(#tickR)"></line>
        <text x="480" y="284" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="15" font-weight="600" fill="#444444">½″ → at least 3″</text>
      </svg>
