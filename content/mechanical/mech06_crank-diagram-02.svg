<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" role="img" aria-labelledby="pusher-title pusher-description">
  <title id="pusher-title">A stationary crank-driven pom pusher: ½″ → at least 3″</title>
  <desc id="pusher-description">Top view. The stationary base supports a crank, connecting rod, and guided sliding shaft. The solid push blade and pom show the starting position; dashed outlines show them after a push. Measure both pom positions from the same right edge of the station: start within one-half inch and finish at least three inches away. The blade must be at least three inches wide and three-quarters of an inch tall.</desc>
  <defs>
    <marker id="pusher-red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#b4382b"/>
    </marker>
    <g id="pusher-pom">
      <path d="M0 -13Q4 -17 7 -12Q13 -13 13 -7Q18 -4 13 0Q17 5 12 8Q12 14 6 13Q2 18 -2 13Q-8 16 -10 10Q-16 9 -13 3Q-18 -1 -13 -5Q-14 -11 -8 -11Q-5 -17 0 -13Z"/>
      <path d="M-7 -3Q-1 -9 4 -4M-4 5Q2 1 7 5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <g font-family="Barlow, Arial, sans-serif" fill="#263340">
    <text x="24" y="28" font-size="18" font-weight="600">Turn the crank. Push the pom. Keep the base still.</text>
    <text x="24" y="51" font-size="13" fill="#697580">TOP VIEW · Solid = start position · Dashed = after the push</text>

    <!-- Slate identifies the fixed structure; red identifies the moving parts. -->
    <text x="40" y="92" font-size="14" font-weight="600" fill="#36434f">STATIONARY OBJECT</text>
    <path d="M64 100V124" fill="none" stroke="#697580" stroke-width="1.25"/>
    <text x="237" y="92" font-size="14" font-weight="600" fill="#a83a30">MOVING COMPONENT</text>
    <text x="237" y="111" font-size="12" fill="#a83a30">crank + rod + sliding blade</text>

    <rect x="40" y="125" width="320" height="204" rx="8" fill="#f3f5f6" stroke="#697580" stroke-width="1.5"/>
    <rect x="50" y="135" width="300" height="184" rx="4" fill="none" stroke="#e0e5e8"/>
    <g fill="#fff" stroke="#b7c1c9" stroke-width="1.25">
      <circle cx="56" cy="141" r="3"/>
      <circle cx="344" cy="141" r="3"/>
      <circle cx="56" cy="313" r="3"/>
      <circle cx="344" cy="313" r="3"/>
    </g>
    <path d="M52 225H346" fill="none" stroke="#c5cdd3" stroke-width="1" stroke-dasharray="6 5"/>

    <!-- A real slider-crank: radius 50, rod length 120, travel 100.
         Retracted pin x=70, slider joint x=190; extended joint x=290.
         The long shaft remains inside the fixed guide at both extremes. -->
    <circle cx="120" cy="225" r="58" fill="#fae8e3" stroke="#a83a30" stroke-width="1.5"/>
    <circle cx="120" cy="225" r="50" fill="none" stroke="#dca99f" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M120 225H70" fill="none" stroke="#a83a30" stroke-width="10" stroke-linecap="round"/>
    <path d="M70 225H190" fill="none" stroke="#36434f" stroke-width="14" stroke-linecap="round"/>
    <path d="M70 225H190" fill="none" stroke="#e9edf0" stroke-width="10" stroke-linecap="round"/>
    <circle cx="120" cy="225" r="5" fill="#263340" stroke="#fff" stroke-width="1.5"/>
    <circle cx="70" cy="225" r="5" fill="#fff" stroke="#a83a30" stroke-width="2"/>

    <rect x="170" y="216" width="184" height="18" rx="3" fill="#fae8e3" stroke="#a83a30" stroke-width="1.5"/>
    <circle cx="190" cy="225" r="5" fill="#fff" stroke="#36434f" stroke-width="2"/>
    <circle cx="190" cy="225" r="1.5" fill="#263340"/>
    <g fill="#e9edf0" stroke="#697580" stroke-width="1.5">
      <rect x="298" y="203" width="36" height="13" rx="2"/>
      <rect x="298" y="234" width="36" height="13" rx="2"/>
    </g>
    <g fill="#697580">
      <circle cx="306" cy="209.5" r="2"/>
      <circle cx="326" cy="209.5" r="2"/>
      <circle cx="306" cy="240.5" r="2"/>
      <circle cx="326" cy="240.5" r="2"/>
    </g>

    <!-- Starting blade face x=366; pom center x=380. The station edge
         is x=360. At 40 drawing units/inch the pom moves from ½″ to 3″. -->
    <rect x="354" y="165" width="12" height="120" rx="2" fill="#b4382b" stroke="#8e3027" stroke-width="1.5"/>
    <path d="M358 171V279" stroke="#dca99f" stroke-width="1"/>
    <use href="#pusher-pom" x="380" y="225" fill="#fff" stroke="#697580" stroke-width="1.5"/>
    <g fill="none" stroke="#a83a30" stroke-width="1.5" stroke-dasharray="5 4">
      <path d="M368 216H454M368 234H454"/>
      <rect x="454" y="165" width="12" height="120" rx="2"/>
    </g>
    <use href="#pusher-pom" x="480" y="225" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" stroke-dasharray="3 3"/>

    <path d="M91 189A46 46 0 0 1 158 202" fill="none" stroke="#b4382b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pusher-red-arrow)"/>
    <text x="120" y="303" text-anchor="middle" font-size="13" fill="#a83a30">Crank turns</text>
    <path d="M394 192H440" fill="none" stroke="#b4382b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pusher-red-arrow)"/>
    <text x="418" y="180" text-anchor="middle" font-size="12" fill="#a83a30">push</text>

    <text x="235" y="157" font-size="14" font-weight="600" fill="#a83a30">PUSH BLADE</text>
    <path d="M330 153 354 173" fill="none" stroke="#a83a30" stroke-width="1.25"/>
    <text x="212" y="275" font-size="12" fill="#697580">Fixed guide</text>
    <path d="M280 270 308 248" fill="none" stroke="#697580" stroke-width="1.25"/>
    <text x="391" y="260" font-size="13" fill="#697580">pom</text>
    <path d="M392 247 386 238" fill="none" stroke="#697580" stroke-width="1"/>

    <!-- Width is visible from above. Height is stated separately. -->
    <path d="M480 165H513M480 285H513M506 165V285M501 165H511M501 285H511" fill="none" stroke="#697580" stroke-width="1.25"/>
    <text x="519" y="218" font-size="13" font-weight="600">≥ 3″ wide</text>
    <text x="519" y="237" font-size="12" fill="#697580">blade width</text>

    <!-- Both distances use the same station edge, not the moving blade. -->
    <path d="M360 331V403" fill="none" stroke="#36434f" stroke-width="1.25"/>
    <path d="M380 287V355M480 287V403" fill="none" stroke="#b7c1c9" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="M360 347H380M380 342V352M360 389H480M480 384V394" fill="none" stroke="#36434f" stroke-width="1.5"/>
    <text x="346" y="351" text-anchor="end" font-size="14">Start: within ½″ of station</text>
    <text x="346" y="393" text-anchor="end" font-size="14">Finish: at least 3″ from station</text>
    <text x="310" y="428" text-anchor="middle" font-size="13" fill="#46535f">Blade height: at least ¾″ · Height is out of the page in this top view.</text>
  </g>
</svg>
