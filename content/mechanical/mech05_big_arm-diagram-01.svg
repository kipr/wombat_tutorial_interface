<svg viewBox="0 0 620 330" role="img" aria-label="Side view of a three degree of freedom arm. The shoulder joint at the base raises and lowers the upper arm. The elbow joint folds the forearm. The gripper at the end opens and closes. Each joint is driven independently." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="rr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"></path>
          </marker>
        </defs>

        
        <line x1="40" y1="292" x2="580" y2="292" stroke="#1C1C1C" stroke-width="3"></line>
        <rect x="96" y="248" width="100" height="44" rx="3" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>
        <text x="146" y="276" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" fill="#444">base</text>

        
        <line x1="146" y1="248" x2="286" y2="150" stroke="#888" stroke-width="9" stroke-linecap="round"></line>
        
        <line x1="286" y1="150" x2="424" y2="120" stroke="#888" stroke-width="9" stroke-linecap="round"></line>
        
        <line x1="424" y1="120" x2="470" y2="92" stroke="#C0392B" stroke-width="7" stroke-linecap="round"></line>
        <line x1="424" y1="120" x2="470" y2="140" stroke="#C0392B" stroke-width="7" stroke-linecap="round"></line>
        <circle cx="486" cy="116" r="15" fill="#F2F2F2" stroke="#444" stroke-width="2"></circle>

        
        <circle cx="146" cy="248" r="9" fill="#C0392B"></circle>
        <path d="M110,222 A46,46 0 0 1 176,206" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#rr)"></path>
        <circle cx="88" cy="248" r="14" fill="#C0392B"></circle>
        <text x="88" y="253" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#fff">1</text>
        <text x="60" y="222" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#C0392B">shoulder</text>

        
        <circle cx="286" cy="150" r="9" fill="#C0392B"></circle>
        <path d="M256,122 A42,42 0 0 1 320,116" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#rr)"></path>
        <circle cx="286" cy="192" r="14" fill="#C0392B"></circle>
        <text x="286" y="197" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#fff">2</text>
        <text x="286" y="220" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#C0392B">elbow</text>

        
        <circle cx="424" cy="120" r="9" fill="#C0392B"></circle>
        <circle cx="424" cy="176" r="14" fill="#C0392B"></circle>
        <text x="424" y="181" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>
        <text x="424" y="204" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#C0392B">gripper</text>
        <line x1="470" y1="84" x2="482" y2="70" stroke="#C0392B" stroke-width="2.5" marker-end="url(#rr)"></line>
        <line x1="470" y1="148" x2="482" y2="162" stroke="#C0392B" stroke-width="2.5" marker-end="url(#rr)"></line>

        <text x="300" y="42" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="19" font-weight="700" fill="#1C1C1C">THREE DEGREES OF FREEDOM</text>
        <text x="300" y="64" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13.5" fill="#666">each joint driven separately — none of them forced by the others</text>
      </svg>
