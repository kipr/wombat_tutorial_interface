<circle cx="424" cy="176" r="14" fill="#c0392b"/><text x="424" y="181" fill="#fff" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="424" y="204" fill="#c0392b" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" text-anchor="middle">gripper</text><path stroke="#c0392b" stroke-width="2.5" marker-end="url(#rr)" d="m470 84 12-14"/><path stroke="#c0392b" stroke-width="2.5" marker-end="url(#rr)" d="m470 148 12 14"/><text x="300" y="42" fill="#1c1c1c" font-family="'Barlow Condensed',sans-serif" font-size="19" font-weight="700" text-anchor="middle">THREE DEGREES OF FREEDOM</text><text x="300" y="64" fill="#666" font-family="'Barlow',sans-serif" font-size="13.5" text-anchor="middle">each joint driven separately — none of them forced by the others</text></svg>
