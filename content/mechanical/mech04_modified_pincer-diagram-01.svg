<svg xmlns="http://www.w3.org/2000/svg" aria-label="Two grippers on a cube. On the left, pivoting jaws are tilted and touch the cube only at single corner points, leaving wedge-shaped gaps. On the right, jaws parallel to the cube faces make full contact along three inches of each side." role="img" viewBox="0 0 620 250"><rect width="296" height="234" x="8" y="8" fill="#fff" stroke="#ccc" rx="8"/><text x="22" y="32" fill="#c0392b" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700">TILTED JAWS — corner contact</text><path fill="#f2f2f2" stroke="#444" stroke-width="2" d="M112 80h90v90h-90z"/><text x="157" y="132" fill="#444" font-family="'Barlow',sans-serif" font-size="13" text-anchor="middle">cube</text><path stroke="#c0392b" stroke-linecap="round" stroke-width="7" d="m88 196 24-114m114 114L202 82"/><circle cx="112" cy="82" r="5" fill="#1c1c1c"/><circle cx="202" cy="82" r="5" fill="#1c1c1c"/><text x="157" y="216" fill="#c0392b" font-family="'Barlow',sans-serif" font-size="12.5" text-anchor="middle">touches at two points only</text><text x="157" y="232" fill="#c0392b" font-family="'Barlow',sans-serif" font-size="12.5" text-anchor="middle">the cube can twist free</text><rect width="296" height="234" x="316" y="8" fill="#fff" stroke="#ccc" rx="8"/><text x="330" y="32" fill="#1e8449" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700">PARALLEL JAWS — face contact</text><path fill="#f2f2f2" stroke="#444" stroke-width="2" d="M420 80h90v90h-90z"/><text x="465" y="132" fill="#444" font-family="'Barlow',sans-serif" font-size="13" text-anchor="middle">cube</text><path stroke="#1e8449" stroke-linecap="round" stroke-width="7" d="M414 82v86m102-86v86"/><path fill="none" stroke="#1e8449" stroke-width="2" d="M396 88h-8v74h8"/><text x="380" y="128" fill="#1e8449" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" text-anchor="middle" transform="rotate(-90 380 128)">3″ of contact</text><text x="465" y="216" fill="#1e8449" font-family="'Barlow',sans-serif" font-size="12.5" text-anchor="middle">contact along the whole face</text><text x="465" y="232" fill="#1e8449" font-family="'Barlow',sans-serif" font-size="12.5" text-anchor="middle">friction holds it in place</text></svg>
