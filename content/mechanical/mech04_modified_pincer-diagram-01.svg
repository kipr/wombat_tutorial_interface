<svg viewBox="0 0 620 250" role="img" aria-label="Two grippers on a cube. On the left, pivoting jaws are tilted and touch the cube only at single corner points, leaving wedge-shaped gaps. On the right, jaws parallel to the cube faces make full contact along three inches of each side." xmlns="http://www.w3.org/2000/svg">
        
        <rect x="8" y="8" width="296" height="234" rx="8" fill="#fff" stroke="#CCC"></rect>
        <text x="22" y="32" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#C0392B">TILTED JAWS — corner contact</text>
        <rect x="112" y="80" width="90" height="90" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>
        <text x="157" y="132" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" fill="#444">cube</text>
        
        <line x1="88" y1="196" x2="112" y2="82" stroke="#C0392B" stroke-width="7" stroke-linecap="round"></line>
        <line x1="226" y1="196" x2="202" y2="82" stroke="#C0392B" stroke-width="7" stroke-linecap="round"></line>
        <circle cx="112" cy="82" r="5" fill="#1C1C1C"></circle>
        <circle cx="202" cy="82" r="5" fill="#1C1C1C"></circle>
        <text x="157" y="216" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" fill="#C0392B">touches at two points only</text>
        <text x="157" y="232" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" fill="#C0392B">the cube can twist free</text>

        
        <rect x="316" y="8" width="296" height="234" rx="8" fill="#fff" stroke="#CCC"></rect>
        <text x="330" y="32" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1E8449">PARALLEL JAWS — face contact</text>
        <rect x="420" y="80" width="90" height="90" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>
        <text x="465" y="132" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" fill="#444">cube</text>
        <line x1="414" y1="82" x2="414" y2="168" stroke="#1E8449" stroke-width="7" stroke-linecap="round"></line>
        <line x1="516" y1="82" x2="516" y2="168" stroke="#1E8449" stroke-width="7" stroke-linecap="round"></line>
        
        <path d="M396,88 L388,88 L388,162 L396,162" fill="none" stroke="#1E8449" stroke-width="2"></path>
        <text x="380" y="128" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#1E8449" transform="rotate(-90 380 128)">3″ of contact</text>
        <text x="465" y="216" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" fill="#1E8449">contact along the whole face</text>
        <text x="465" y="232" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" fill="#1E8449">friction holds it in place</text>
      </svg>
