<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" role="img" aria-labelledby="gear-title gear-description">
  <title id="gear-title">Meshed gears close both pincer jaws</title>
  <desc id="gear-description">Two meshed gears, each carrying an arm. When the left gear turns clockwise, the right gear is forced counterclockwise, and the two arms swing toward each other to close on a pom. Solid arms show the open position; dashed arms show the closed position. Drive only one gear.</desc>
