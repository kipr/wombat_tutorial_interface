  <g font-family="Barlow, Arial, sans-serif" text-anchor="middle">
    <text x="310" y="24" font-size="16" font-weight="600" fill="#263340">Both jaws close together</text>
    <path d="M185 43H251" fill="none" stroke="#b4382b" stroke-width="2.5" marker-end="url(#red-arrow)"/>
    <path d="M435 43H369" fill="none" stroke="#36434f" stroke-width="2.5" marker-end="url(#dark-arrow)"/>

    <!-- Pitch radii are 84; the second gear is phased by half a tooth. -->
    <use href="#gear-outline" transform="translate(226 230)" fill="#fae8e3" stroke="#a83a30" stroke-width="1.5" stroke-linejoin="round"/>
    <use href="#gear-outline" transform="translate(394 230) rotate(9)" fill="#e9edf0" stroke="#36434f" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="226" cy="230" r="58" fill="none" stroke="#dca99f" stroke-width="1"/>
    <circle cx="394" cy="230" r="58" fill="none" stroke="#b7c1c9" stroke-width="1"/>

    <!-- Dashed arms rotate about the same axles to show the closed position. -->
    <g fill="none" stroke-width="8" stroke-linejoin="round" stroke-dasharray="8 6">
      <path d="M226 230 166 73H220V90" transform="rotate(25 226 230)" stroke="#a83a30"/>
      <path d="M394 230 454 73H400V90" transform="rotate(-25 394 230)" stroke="#36434f"/>
    </g>
    <circle cx="310" cy="101" r="18" fill="#f3f5f6" stroke="#46535f" stroke-width="1.5"/>
    <text x="310" y="72" font-size="14" fill="#46535f">pom</text>
    <text x="103" y="90" font-size="14" fill="#46535f">open</text>
    <path d="M125 94 151 94" fill="none" stroke="#697580" stroke-width="1.25"/>
    <text x="510" y="90" font-size="14" fill="#46535f">closed</text>
    <path d="M486 96 359 114" fill="none" stroke="#697580" stroke-width="1.25" stroke-dasharray="4 3"/>

    <!-- Arms fasten to the gear faces; the inward-facing tips are the jaws. -->
    <path d="M226 230 166 73H220V90" fill="none" stroke="#a83a30" stroke-width="18" stroke-linejoin="round"/>
    <path d="M226 230 166 73H220V90" fill="none" stroke="#e7b3a9" stroke-width="13" stroke-linejoin="round"/>
    <path d="M394 230 454 73H400V90" fill="none" stroke="#36434f" stroke-width="18" stroke-linejoin="round"/>
    <path d="M394 230 454 73H400V90" fill="none" stroke="#c3cdd4" stroke-width="13" stroke-linejoin="round"/>

    <circle cx="226" cy="230" r="17" fill="#fff" stroke="#a83a30" stroke-width="2"/>
    <circle cx="394" cy="230" r="17" fill="#fff" stroke="#36434f" stroke-width="2"/>
    <circle cx="226" cy="230" r="6" fill="#263340"/>
    <circle cx="394" cy="230" r="6" fill="#263340"/>

    <!-- The lower arcs show clockwise (left) and counterclockwise (right). -->
    <path d="M265 252.5A45 45 0 0 1 187 252.5" fill="none" stroke="#b4382b" stroke-width="3" stroke-linecap="round" marker-end="url(#red-arrow)"/>
    <path d="M355 252.5A45 45 0 0 0 433 252.5" fill="none" stroke="#36434f" stroke-width="3" stroke-linecap="round" marker-end="url(#dark-arrow)"/>
    <text x="222" y="351" font-size="16" font-weight="600" fill="#a83a30">CLOCKWISE</text>
    <text x="402" y="351" font-size="15" font-weight="600" fill="#36434f">COUNTER-CW</text>
    <text x="402" y="372" font-size="13" fill="#36434f">counterclockwise</text>

    <!-- The leader stops below the engagement so every tooth stays visible. -->
    <path d="M310 274V380" fill="none" stroke="#697580" stroke-width="1.25"/>
    <circle cx="310" cy="274" r="2.5" fill="#697580"/>
    <text x="310" y="400" font-size="14" fill="#46535f">the mesh — teeth interlock here</text>
    <text x="310" y="435" font-size="15" font-weight="600" fill="#263340">drive only one gear</text>
  </g>
</svg>
