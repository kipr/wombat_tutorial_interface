<svg xmlns="http://www.w3.org/2000/svg" aria-label="Two mountings compared. Left, concentric: the gear's center sits on the axis of rotation and the rim sweeps one clean circle. Right, eccentric: the gear's center sits beside the axis, so the rim sweeps a wobbling ring — too far from the meshing gear on one side of the revolution and too close on the other." role="img" viewBox="0 0 620 300"><circle cx="160" cy="130" r="72" fill="#f2f2f2" stroke="#444" stroke-width="2.5"/><circle cx="160" cy="130" r="72" fill="none" stroke="#1e8449" stroke-dasharray="6 5" stroke-width="1.8"/><circle cx="160" cy="130" r="5" fill="#1e8449"/><text x="160" y="240" fill="#1e8449" font-family="'Barlow Condensed',sans-serif" font-size="18" font-weight="700" text-anchor="middle">CONCENTRIC</text><text x="160" y="260" fill="#1e8449" font-family="'Barlow',sans-serif" font-size="13" text-anchor="middle">gear center on the axis</text><text x="160" y="277" fill="#1e8449" font-family="'Barlow',sans-serif" font-size="13" text-anchor="middle">rim sweeps one clean circle</text><circle cx="452" cy="130" r="72" fill="#f2f2f2" stroke="#444" stroke-width="2.5"/><circle cx="440" cy="118" r="5" fill="#c0392b"/><circle cx="440" cy="118" r="89" fill="none" stroke="#c0392b" stroke-dasharray="6 5" stroke-width="1.8"/><circle cx="440" cy="118" r="55" fill="none" stroke="#c0392b" stroke-dasharray="3 4" stroke-width="1.2"/><text x="452" y="240" fill="#c0392b" font-family="'Barlow Condensed',sans-serif" font-size="18" font-weight="700" text-anchor="middle">ECCENTRIC</text><text x="452" y="260" fill="#c0392b" font-family="'Barlow',sans-serif" font-size="13" text-anchor="middle">axis misses the gear center</text><text x="452" y="277" fill="#c0392b" font-family="'Barlow',sans-serif" font-size="13" text-anchor="middle">rim sweeps far on one side, near on the other</text></svg>
