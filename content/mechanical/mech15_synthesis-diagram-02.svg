<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="lever-strokes-title lever-strokes-description" role="img" viewBox="0 0 720 505"><title id="lever-strokes-title">A 1-to-3 lever multiplies full stroke by three</title><desc id="lever-strokes-description">A lever has input and output arms in an exact one-to-three length ratio. Dashed positions at plus and minus 30 degrees show a two-inch full input stroke and a six-inch full output stroke in the opposite direction. The force is ideally one third as large. This example equals six inches; the challenge needs more than six.</desc><rect width="720" height="505" fill="#fff"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="360" y="30" font-size="23" font-weight="600" text-anchor="middle">3 times the distance — and one third the push</text><text x="24" y="57" fill="#697580">Measure each stroke from one end position to the other.</text><path fill="none" stroke="#b7c1c9" stroke-dasharray="7 6" stroke-linecap="round" stroke-width="8" d="m245.718 290 277.128-160"/><path fill="none" stroke="#b7c1c9" stroke-dasharray="7 6" stroke-linecap="round" stroke-width="8" d="m245.718 210 277.128 160"/><rect width="74" height="34" x="278" y="280" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="6"/><rect width="56" height="16" x="287" y="289" fill="none" stroke="#e0e5e8" rx="3"/><circle cx="294" cy="296" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="336" cy="296" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="294" cy="298" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="336" cy="298" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><path fill="#e9edf0" stroke="#697580" stroke-width="1.5" d="m315 256-20 24h40Z"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-width="18" d="M235 250h320"/><path fill="none" stroke="#e9edf0" stroke-linecap="round" stroke-width="14" d="M235 250h320"/><circle cx="299" cy="250" r="3.25" fill="#fff" stroke="#36434f" stroke-width="1.25"/><circle cx="363" cy="250" r="3.25" fill="#fff" stroke="#36434f" stroke-width="1.25"/><circle cx="427" cy="250" r="3.25" fill="#fff" stroke="#36434f" stroke-width="1.25"/><circle cx="491" cy="250" r="3.25" fill="#fff" stroke="#36434f" stroke-width="1.25"/><circle cx="315" cy="250" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/><circle cx="315" cy="250" r="4" fill="#fff" stroke="#697580" stroke-width="1.25"/><path fill="none" stroke="#a83a30" stroke-width="1.5" d="M245.718 210a80 80 0 0 0 0 80"/><path fill="none" stroke="#a83a30" stroke-width="1.5" d="M522.846 130a240 240 0 0 1 0 240"/><path fill="none" stroke="#36434f" stroke-width="1.25" d="M192 210v80m5-80h-10m10 80h-10"/><path fill="none" stroke="#a83a30" stroke-width="1.25" d="M605 130v240m5-240h-10m10 240h-10"/><path fill="none" stroke="#b7c1c9" stroke-dasharray="4 4" d="M192 210h47m-47 80h47m294-160h78m-78 240h78"/><text x="119" y="185" fill="#36434f" font-size="18" font-weight="600" text-anchor="middle">INPUT</text><text x="119" y="210" fill="#36434f" font-size="17" text-anchor="middle">2″ stroke</text><text x="110" y="320" fill="#697580" font-size="15" text-anchor="middle">from mechanism 1</text><text x="637" y="103" fill="#a83a30" font-size="18" font-weight="600" text-anchor="middle">OUTPUT</text><text x="637" y="126" fill="#a83a30" font-size="17" text-anchor="middle">6″ stroke</text><text x="315" y="340" fill="#697580" font-size="15" text-anchor="middle">pivot</text><path fill="none" stroke="#697580" stroke-width="1.25" d="M235 399h80m-80-5v10m80-10v10"/><path fill="none" stroke="#697580" stroke-width="1.25" d="M315 399h240m-240-5v10m240-10v10"/><text x="275" y="425" fill="#697580" text-anchor="middle">1 part</text><text x="435" y="425" fill="#697580" text-anchor="middle">3 parts</text><text x="360" y="459" fill="#a83a30" text-anchor="middle">This example reaches 6″. Your challenge requires more than 6″.</text><text x="360" y="482" fill="#697580" font-size="15" text-anchor="middle">Ideal force ratio: 1/3. Allow for friction in your build.</text></g></svg>
