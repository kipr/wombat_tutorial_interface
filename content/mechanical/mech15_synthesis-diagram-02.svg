<svg viewBox="0 0 620 320" role="img" aria-label="A lever on a pivot. The input is applied close to the pivot and moves a short distance. The output at the far end of the lever moves three times as far, because its arm is three times as long, but it pushes with one third the force." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="udA" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="9" markerHeight="9" orient="auto">
            <path d="M0,9 L5,0 L10,9 z" fill="#1F2D5A"></path>
          </marker>
          <marker id="udB" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="9" markerHeight="9" orient="auto">
            <path d="M0,9 L5,0 L10,9 z" fill="#C0392B"></path>
          </marker>
          <marker id="tkD" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M1,0 L1,10" stroke="#888" stroke-width="1.6"></path>
          </marker>
          <marker id="tkE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M9,0 L9,10" stroke="#888" stroke-width="1.6"></path>
          </marker>
        </defs>

        
        <rect x="180" y="172" width="330" height="16" rx="3" fill="#888" stroke="#666" stroke-width="1.5"></rect>

        
        <path d="M280,188 L262,222 L298,222 Z" fill="#1C1C1C"></path>
        <line x1="248" y1="222" x2="312" y2="222" stroke="#1C1C1C" stroke-width="2.5"></line>
        <g stroke="#888" stroke-width="1.6">
          <line x1="256" y1="222" x2="246" y2="236"></line><line x1="276" y1="222" x2="266" y2="236"></line>
          <line x1="296" y1="222" x2="286" y2="236"></line><line x1="312" y1="222" x2="302" y2="236"></line>
        </g>
        <text x="280" y="256" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" fill="#888">pivot</text>

        
        <line x1="210" y1="160" x2="210" y2="120" stroke="#1F2D5A" stroke-width="3" marker-end="url(#udA)"></line>
        <line x1="210" y1="200" x2="210" y2="240" stroke="#1F2D5A" stroke-width="3"></line>
        <text x="150" y="112" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1F2D5A">INPUT</text>
        <text x="150" y="132" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#1F2D5A">2″ stroke</text>
        <text x="150" y="150" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12" fill="#666">from mechanism 1</text>

        
        <line x1="490" y1="160" x2="490" y2="60" stroke="#C0392B" stroke-width="3" marker-end="url(#udB)"></line>
        <line x1="490" y1="200" x2="490" y2="300" stroke="#C0392B" stroke-width="3"></line>
        <text x="556" y="104" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#C0392B">OUTPUT</text>
        <text x="556" y="124" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#C0392B">6″ stroke</text>

        
        <line x1="210" y1="284" x2="280" y2="284" stroke="#888" stroke-width="1.6" marker-start="url(#tkD)" marker-end="url(#tkE)"></line>
        <text x="245" y="304" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#888">1 part</text>
        <line x1="280" y1="284" x2="490" y2="284" stroke="#888" stroke-width="1.6" marker-start="url(#tkD)" marker-end="url(#tkE)"></line>
        <text x="385" y="304" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#888">3 parts</text>

        <text x="310" y="44" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="18" font-weight="700" fill="#1C1C1C">3 times the distance — and one third the push</text>
      </svg>
