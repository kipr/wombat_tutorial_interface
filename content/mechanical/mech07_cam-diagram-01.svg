<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="cam-title cam-description" role="img" viewBox="0 0 720 480"><title id="cam-title">A 45° lobe lifts the follower once per turn</title><desc id="cam-description">The raised lobe spans 45 degrees measured at the fixed axle. Its rounded tip touches the follower shoe and pushes it up through a fixed guide. The dashed shoe marks the low position on the round part. For the other 315 degrees the follower stays low. Gravity or a rubber band keeps it against the cam as the lobe turns away.</desc><defs><marker id="cam-arrow" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a83a30" d="m0 0 10 5-10 5Z"/></marker></defs><path fill="#fff" d="M0 0h720v480H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="24" y="30" font-size="23" font-weight="600">One raised section. One lift per turn.</text><text x="24" y="55" fill="#697580">Measure the lobe angle at the axle, between its two edges.</text><g transform="translate(215 316)"><path fill="#f3f5f6" stroke="#697580" stroke-width="2" d="m-33.676-81.301 1.03-.526.969-.695.914-.865.869-1.032.832-1.194.806-1.349.789-1.495.782-1.63.784-1.75.796-1.858.815-1.947.843-2.021.879-2.073.921-2.107.967-2.12 1.02-2.112 1.075-2.082 1.133-2.032 1.191-1.96 1.25-1.867 1.308-1.756 1.364-1.626 1.416-1.478 1.464-1.315 1.507-1.137 1.544-.948 1.574-.748 1.598-.54 1.614-.327L0-124l1.622.109 1.614.327 1.598.54 1.574.748 1.544.948 1.507 1.137 1.464 1.315 1.416 1.478 1.364 1.626 1.308 1.756 1.25 1.867 1.191 1.96 1.133 2.032 1.075 2.082 1.02 2.112.967 2.12.921 2.107.879 2.073.843 2.021.815 1.947.796 1.858.784 1.75.782 1.63.789 1.495.806 1.349.832 1.194.869 1.032.914.865.969.695 1.03.526a88 88 0 1 1-67.352 0Z"/><path fill="#fae8e3" stroke="#a83a30" stroke-width="2" d="m-33.676-81.301 1.03-.526.969-.695.914-.865.869-1.032.832-1.194.806-1.349.789-1.495.782-1.63.784-1.75.796-1.858.815-1.947.843-2.021.879-2.073.921-2.107.967-2.12 1.02-2.112 1.075-2.082 1.133-2.032 1.191-1.96 1.25-1.867 1.308-1.756 1.364-1.626 1.416-1.478 1.464-1.315 1.507-1.137 1.544-.948 1.574-.748 1.598-.54 1.614-.327L0-124l1.622.109 1.614.327 1.598.54 1.574.748 1.544.948 1.507 1.137 1.464 1.315 1.416 1.478 1.364 1.626 1.308 1.756 1.25 1.867 1.191 1.96 1.133 2.032 1.075 2.082 1.02 2.112.967 2.12.921 2.107.879 2.073.843 2.021.815 1.947.796 1.858.784 1.75.782 1.63.789 1.495.806 1.349.832 1.194.869 1.032.914.865.969.695 1.03.526a88 88 0 0 0-67.352 0Z"/><circle r="88" fill="none" stroke="#b7c1c9" stroke-dasharray="5 5" stroke-width="1.25"/><g fill="#fff" stroke="#b7c1c9" stroke-width="1.5"><circle cx="-52" r="11"/><circle cx="52" r="11"/><circle cy="52" r="11"/></g></g><rect width="42" height="14" x="194" y="214" fill="none" stroke="#697580" stroke-dasharray="4 4" stroke-width="1.5" rx="3"/><rect width="16" height="89" x="207" y="89" fill="#e9edf0" stroke="#36434f" stroke-width="1.5" rx="2"/><path stroke="#fff" stroke-width="2" d="M212 93v81"/><rect width="42" height="14" x="194" y="178" fill="#e9edf0" stroke="#36434f" stroke-width="2" rx="3"/><path stroke="#fff" stroke-width="2" d="M198 183h34"/><g fill="#f3f5f6" stroke="#697580" stroke-width="1.5"><rect width="24" height="43" x="183" y="111" rx="2"/><rect width="24" height="43" x="223" y="111" rx="2"/></g><g fill="#697580"><circle cx="195" cy="121" r="2.5"/><circle cx="195" cy="144" r="2.5"/><circle cx="235" cy="121" r="2.5"/><circle cx="235" cy="144" r="2.5"/></g><text x="38" y="116" font-size="15">Fixed guide</text><path fill="none" stroke="#697580" stroke-width="1.25" d="m125 120 56 12"/><text x="432" y="105" font-size="19" font-weight="600">follower</text><path fill="none" stroke="#697580" stroke-width="1.25" d="M422 110H267l-43-12"/><path fill="none" stroke="#a83a30" stroke-width="2.5" marker-end="url(#cam-arrow)" d="M290 180v-55"/><text x="310" y="155" fill="#a83a30">pushed up by the lobe</text><path fill="none" stroke="#a83a30" stroke-dasharray="4 4" stroke-width="1.25" d="M160.659 184.809 215 316l54.341-131.191"/><path fill="none" stroke="#a83a30" stroke-width="2" d="M195.866 269.806a50 50 0 0 1 38.268 0"/><text x="215" y="258" fill="#a83a30" font-size="22" font-weight="600" text-anchor="middle">45°</text><circle cx="215" cy="316" r="12" fill="#e9edf0" stroke="#697580" stroke-width="1.5"/><path fill="#36434f" d="M212 307h6v6h6v6h-6v6h-6v-6h-6v-6h6Z"/><path fill="none" stroke="#697580" stroke-width="1.25" d="m225 326 27 31h60"/><text x="322" y="362" font-size="15">Fixed axle</text><path fill="none" stroke="#a83a30" stroke-width="2.5" marker-end="url(#cam-arrow)" d="M107.875 354.991a114 114 0 0 1 0-77.982"/><text x="215" y="451" text-anchor="middle">cam, turning on its axle</text><path stroke="#d0d4d8" d="M410 216h286"/><text x="432" y="247" font-size="19" font-weight="600">THE OTHER 315°</text><text x="432" y="275">the follower rides the round part</text><text x="432" y="299">and sits still, doing nothing</text><text x="432" y="326" fill="#697580" font-size="14">Dashed shoe = low position</text><path stroke="#d0d4d8" d="M410 350h286"/><text x="432" y="383" font-size="18" font-weight="600">Return force</text><text x="432" y="409">Gravity or a rubber band keeps</text><text x="432" y="433">the follower against the edge.</text></g></svg>
