<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="four-bar-title four-bar-description">
  <title id="four-bar-title">Four links, four pivots, two fixed anchors</title>
  <desc id="four-bar-description">A short crank rotates around the left anchored pivot. The coupler joins it to the rocker, which swings about the right anchored pivot. The dashed line between the two open fixed pivots is the ground link. Three links move; the distance between the anchors stays fixed.</desc>
  <defs>
    <marker id="four-bar-input" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#a83a30"/>
    </marker>
    <marker id="four-bar-output" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#36434f"/>
    </marker>
    <marker id="four-bar-output-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M10 0 0 5 10 10Z" fill="#36434f"/>
    </marker>
  </defs>
  <rect width="720" height="450" fill="#fff"/>
  <g font-family="Barlow, Arial, sans-serif" fill="#263340" font-size="16">
    <text x="24" y="30" font-size="23" fill="#263340" font-weight="600">Three links move. The fourth is your frame.</text>
    <text x="24" y="55" font-size="16" fill="#697580">The ground link is the fixed distance between the two anchored pivots.</text>
    <!-- The two anchor triangles are fixed to the same base. -->
    <rect x="105" y="326" width="420" height="49" rx="6" fill="#f3f5f6" stroke="#697580" stroke-width="1.5"/>
    <rect x="114" y="335" width="402" height="31" rx="3" fill="none" stroke="#e0e5e8"/>
    <circle cx="121" cy="342" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <circle cx="509" cy="342" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <circle cx="121" cy="359" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <circle cx="509" cy="359" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <path d="M170 306 151 326H189ZM460 306 441 326H479Z" fill="#e9edf0" stroke="#697580" stroke-width="1.5"/>
    <path d="M170 310H460" fill="none" stroke="#36434f" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M170 310 205 249.378" fill="none" stroke="#a83a30" stroke-width="18" stroke-linecap="round"/>
    <path d="M170 310 205 249.378" fill="none" stroke="#fae8e3" stroke-width="14" stroke-linecap="round"/>
