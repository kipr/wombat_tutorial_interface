    <circle cx="184" cy="285.751" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/>
    <circle cx="191" cy="273.627" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/>
    <circle cx="198" cy="261.502" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/>
    <path d="M205 249.378 445.528 150.656" fill="none" stroke="#697580" stroke-width="18" stroke-linecap="round"/>
    <path d="M205 249.378 445.528 150.656" fill="none" stroke="#e9edf0" stroke-width="14" stroke-linecap="round"/>
    <circle cx="253.106" cy="229.634" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="301.211" cy="209.889" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="349.317" cy="190.145" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="397.422" cy="170.4" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <path d="M445.528 150.656 460 310" fill="none" stroke="#36434f" stroke-width="18" stroke-linecap="round"/>
    <path d="M445.528 150.656 460 310" fill="none" stroke="#e9edf0" stroke-width="14" stroke-linecap="round"/>
    <circle cx="448.422" cy="182.525" r="3.25" fill="#fff" stroke="#36434f" stroke-width="1.25"/>
    <circle cx="451.317" cy="214.394" r="3.25" fill="#fff" stroke="#36434f" stroke-width="1.25"/>
    <circle cx="454.211" cy="246.262" r="3.25" fill="#fff" stroke="#36434f" stroke-width="1.25"/>
    <circle cx="457.106" cy="278.131" r="3.25" fill="#fff" stroke="#36434f" stroke-width="1.25"/>
    <circle cx="170" cy="310" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/>
