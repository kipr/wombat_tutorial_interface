    <circle cx="460" cy="310" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/>
    <circle cx="460" cy="310" r="4" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="205" cy="249.378" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/>
    <circle cx="205" cy="249.378" r="3.5" fill="#36434f" stroke="#36434f" stroke-width="1"/>
    <circle cx="445.528" cy="150.656" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/>
    <circle cx="445.528" cy="150.656" r="3.5" fill="#36434f" stroke="#36434f" stroke-width="1"/>
    <text x="40" y="174" font-size="18" fill="#a83a30" font-weight="600">CRANK</text>
    <text x="40" y="196" font-size="15" fill="#a83a30">motor drives this</text>
    <text x="215" y="99" font-size="18" fill="#36434f" font-weight="600">COUPLER</text>
    <text x="215" y="120" font-size="15" fill="#697580">carries the motion across</text>
    <path d="M305 129 333 201" fill="none" stroke="#697580" stroke-width="1.25"/>
    <text x="532" y="220" font-size="18" fill="#36434f" font-weight="600">ROCKER</text>
    <text x="532" y="242" font-size="15" fill="#697580">swings back</text>
    <text x="532" y="262" font-size="15" fill="#697580">and forth</text>
    <path d="M521 231 457 226" fill="none" stroke="#697580" stroke-width="1.25"/>
    <!-- Input arrow circles its anchor; the two-headed output arc rocks. -->
    <path d="M82 310A88 88 0 0 1 200.098 227.307" fill="none" stroke="#a83a30" stroke-width="2.5" marker-end="url(#four-bar-input)"/>
    <path d="M350.478 153.999A190 190 0 0 1 509.176 126.474" fill="none" stroke="#36434f" stroke-width="2" marker-start="url(#four-bar-output-start)" marker-end="url(#four-bar-output)"/>
    <text x="170" y="357" font-size="14" fill="#697580" text-anchor="middle">anchored</text>
    <text x="460" y="357" font-size="14" fill="#697580" text-anchor="middle">anchored</text>
    <path d="M170 381V394H460V381" fill="none" stroke="#697580" stroke-width="1.25"/>
    <text x="315" y="423" font-size="19" fill="#36434f" text-anchor="middle" font-weight="600">GROUND LINK — the fourth bar</text>
  </g>
</svg>
