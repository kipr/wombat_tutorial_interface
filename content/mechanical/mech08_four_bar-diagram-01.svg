<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="four-bar-title four-bar-description" role="img" viewBox="0 0 720 450"><title id="four-bar-title">Four links, four pivots, two fixed anchors</title><desc id="four-bar-description">A short crank rotates around the left anchored pivot. The coupler joins it to the rocker, which swings about the right anchored pivot. The dashed line between the two open fixed pivots is the ground link. Three links move; the distance between the anchors stays fixed.</desc><defs><marker id="four-bar-input" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a83a30" d="m0 0 10 5-10 5Z"/></marker><marker id="four-bar-output" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#36434f" d="m0 0 10 5-10 5Z"/></marker><marker id="four-bar-output-start" markerHeight="5" markerWidth="5" orient="auto" refX="2" refY="5" viewBox="0 0 10 10"><path fill="#36434f" d="M10 0 0 5l10 5Z"/></marker></defs><path fill="#fff" d="M0 0h720v450H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="24" y="30" font-size="23" font-weight="600">Three links move. The fourth is your frame.</text><text x="24" y="55" fill="#697580">The ground link is the fixed distance between the two anchored pivots.</text><rect width="420" height="49" x="105" y="326" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="6"/><rect width="402" height="31" x="114" y="335" fill="none" stroke="#e0e5e8" rx="3"/><circle cx="121" cy="342" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="509" cy="342" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="121" cy="359" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="509" cy="359" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><path fill="#e9edf0" stroke="#697580" stroke-width="1.5" d="m170 306-19 20h38Zm290 0-19 20h38Z"/><path fill="none" stroke="#36434f" stroke-dasharray="8 6" stroke-width="2" d="M170 310h290"/><path fill="none" stroke="#a83a30" stroke-linecap="round" stroke-width="18" d="m170 310 35-60.622"/><path fill="none" stroke="#fae8e3" stroke-linecap="round" stroke-width="14" d="m170 310 35-60.622"/><circle cx="177" cy="297.876" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/><circle cx="184" cy="285.751" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/><circle cx="191" cy="273.627" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/><circle cx="198" cy="261.502" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/><path fill="none" stroke="#697580" stroke-linecap="round" stroke-width="18" d="m205 249.378 240.528-98.722"/><path fill="none" stroke="#e9edf0" stroke-linecap="round" stroke-width="14" d="m205 249.378 240.528-98.722"/><circle cx="253.106" cy="229.634" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="301.211" cy="209.889" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="349.317" cy="190.145" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="397.422" cy="170.4" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-width="18" d="M445.528 150.656 460 310"/><path fill="none" stroke="#e9edf0" stroke-linecap="round" stroke-width="14" d="M445.528 150.656 460 310"/><circle cx="448.422" cy="182.525" r="3.25" fill="#fff" stroke="#36434f" stroke-width="1.25"/><circle cx="451.317" cy="214.394" r="3.25" fill="#fff" stroke="#36434f" stroke-width="1.25"/><circle cx="454.211" cy="246.262" r="3.25" fill="#fff" stroke="#36434f" stroke-width="1.25"/><circle cx="457.106" cy="278.131" r="3.25" fill="#fff" stroke="#36434f" stroke-width="1.25"/><circle cx="170" cy="310" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/><circle cx="170" cy="310" r="4" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="460" cy="310" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/><circle cx="460" cy="310" r="4" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="205" cy="249.378" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/><circle cx="205" cy="249.378" r="3.5" fill="#36434f" stroke="#36434f"/><circle cx="445.528" cy="150.656" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/><circle cx="445.528" cy="150.656" r="3.5" fill="#36434f" stroke="#36434f"/><text x="40" y="174" fill="#a83a30" font-size="18" font-weight="600">CRANK</text><text x="40" y="196" fill="#a83a30" font-size="15">motor drives this</text><text x="215" y="99" fill="#36434f" font-size="18" font-weight="600">COUPLER</text><text x="215" y="120" fill="#697580" font-size="15">carries the motion across</text><path fill="none" stroke="#697580" stroke-width="1.25" d="m305 129 28 72"/><text x="532" y="220" fill="#36434f" font-size="18" font-weight="600">ROCKER</text><text x="532" y="242" fill="#697580" font-size="15">swings back</text><text x="532" y="262" fill="#697580" font-size="15">and forth</text><path fill="none" stroke="#697580" stroke-width="1.25" d="m521 231-64-5"/><path fill="none" stroke="#a83a30" stroke-width="2.5" marker-end="url(#four-bar-input)" d="M82 310a88 88 0 0 1 118.098-82.693"/><path fill="none" stroke="#36434f" stroke-width="2" marker-end="url(#four-bar-output)" marker-start="url(#four-bar-output-start)" d="M350.478 153.999a190 190 0 0 1 158.698-27.525"/><text x="170" y="357" fill="#697580" font-size="14" text-anchor="middle">anchored</text><text x="460" y="357" fill="#697580" font-size="14" text-anchor="middle">anchored</text><path fill="none" stroke="#697580" stroke-width="1.25" d="M170 381v13h290v-13"/><text x="315" y="423" fill="#36434f" font-size="19" font-weight="600" text-anchor="middle">GROUND LINK — the fourth bar</text></g></svg>
