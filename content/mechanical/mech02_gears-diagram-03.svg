<svg viewBox="0 0 620 240" role="img" aria-label="Three gears in a row. The left gear turns clockwise, the middle idler gear is forced counterclockwise, and the right gear is forced clockwise again — the two outer gears turn the same way." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="darr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1C1C1C"></path>
          </marker>
        </defs>
        <circle cx="150" cy="120" r="62" fill="#fbeef0" stroke="#C0392B" stroke-width="2.5"></circle>
        <circle cx="150" cy="120" r="6" fill="#1C1C1C"></circle>
        <path d="M104,84 A58,58 0 0 1 162,60" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#darr)"></path>
        <text x="150" y="212" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13.5" font-weight="600" fill="#C0392B">clockwise</text>
        <circle cx="310" cy="120" r="52" fill="#fff" stroke="#888" stroke-width="2.5" stroke-dasharray="6 4"></circle>
        <circle cx="310" cy="120" r="6" fill="#1C1C1C"></circle>
        <path d="M350,88 A48,48 0 0 0 300,70" fill="none" stroke="#888" stroke-width="2.5" marker-end="url(#darr)"></path>
        <text x="310" y="202" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13.5" font-weight="600" fill="#888">idler — counterclockwise</text>
        <circle cx="466" cy="120" r="62" fill="#F2F2F2" stroke="#444" stroke-width="2.5"></circle>
        <circle cx="466" cy="120" r="6" fill="#1C1C1C"></circle>
        <path d="M420,84 A58,58 0 0 1 478,60" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#darr)"></path>
        <text x="466" y="212" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13.5" font-weight="600" fill="#444">clockwise again</text>
      </svg>
