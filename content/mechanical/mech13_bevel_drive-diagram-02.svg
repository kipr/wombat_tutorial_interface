<svg viewBox="0 0 620 400" role="img" aria-label="Top view of the vehicle. A motor at the left drives a shaft running to the right. At the end of the shaft a pair of bevel gears turns the drive ninety degrees onto an axle running toward the bottom of the page, where a wheel is mounted. The whole assembly sits on a chassis, and the vehicle travels left to right." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="travB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1E8449"></path>
          </marker>
        </defs>

        
        <rect x="40" y="60" width="480" height="300" rx="6" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="12 8"></rect>
        <text x="56" y="86" font-family="'Barlow Condensed',sans-serif" font-size="15" font-weight="700" fill="#888">LEGO OR CUSTOM CHASSIS</text>

        
        <rect x="70" y="150" width="140" height="100" rx="4" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>
        <text x="140" y="206" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700" fill="#444">MOTOR</text>

        
        <rect x="210" y="192" width="120" height="16" rx="2" fill="#888" stroke="#666" stroke-width="1.5"></rect>
        <text x="270" y="180" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#666">motor drive shaft</text>

        
        <path d="M372,184 L330,160 L330,240 L372,216 Z" fill="#FDF2F2" stroke="#C0392B" stroke-width="2.5"></path>
        <path d="M374,218 L350,262 L430,262 L406,218 Z" fill="#FDF2F2" stroke="#C0392B" stroke-width="2.5"></path>
        <circle cx="390" cy="200" r="6" fill="#C0392B"></circle>
        <text x="450" y="196" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#C0392B">BEVEL PAIR</text>
        <text x="450" y="216" font-family="'Barlow',sans-serif" font-size="12.5" fill="#C0392B">turns the drive 90°</text>

        
        <rect x="383" y="262" width="14" height="46" rx="2" fill="#888" stroke="#666" stroke-width="1.5"></rect>
        <text x="412" y="292" font-family="'Barlow',sans-serif" font-size="12.5" fill="#666">axle</text>

        
        <rect x="344" y="308" width="92" height="30" rx="4" fill="#1C1C1C"></rect>
        <text x="390" y="358" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1C1C1C">WHEEL</text>

        
        <line x1="440" y1="110" x2="576" y2="110" stroke="#1E8449" stroke-width="2.5" marker-end="url(#travB)"></line>
        <text x="508" y="100" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#1E8449">vehicle travels</text>

        <text x="140" y="330" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1C1C1C">TOP VIEW</text>
      </svg>
