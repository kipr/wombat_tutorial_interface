    <path d="M86 302H668" fill="none" stroke="#b7c1c9" stroke-width="1" stroke-dasharray="4 5"/>
    <text x="72" y="307" font-size="14" fill="#697580" text-anchor="end">90°</text>
    <path d="M86 239H668" fill="none" stroke="#b7c1c9" stroke-width="1" stroke-dasharray="4 5"/>
    <text x="72" y="244" font-size="14" fill="#697580" text-anchor="end">180°</text>
