    <text x="24" y="30" font-size="23" fill="#263340" font-weight="600">Four quick steps. Four long stops.</text>
    <text x="24" y="55" font-size="16" fill="#697580" >The driver keeps turning while the arm rests between steps.</text>
    <text x="684" y="83" font-size="15" fill="#697580" text-anchor="end">one full turn per minute</text>
    <path d="M86 365H668" fill="none" stroke="#b7c1c9" stroke-width="1" stroke-dasharray="4 5"/>
