<svg viewBox="0 0 620 300" role="img" aria-label="A graph of the arm's position over one minute. The line is flat for fifteen seconds, then jumps up, then is flat again for fifteen seconds, and so on, four times. The flat stretches are labelled dwell and the jumps are labelled index." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="upC" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="9" markerHeight="9" orient="auto">
            <path d="M0,9 L5,0 L10,9 z" fill="#C0392B"></path>
          </marker>
        </defs>

        
        <line x1="70" y1="252" x2="566" y2="252" stroke="#1C1C1C" stroke-width="2.5"></line>
        <line x1="70" y1="252" x2="70" y2="48" stroke="#1C1C1C" stroke-width="2.5"></line>
        <text x="44" y="150" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#444" transform="rotate(-90 44 150)">arm position</text>

        
        <g font-family="'Barlow',sans-serif" font-size="12.5" fill="#666" text-anchor="middle">
          <line x1="70" y1="252" x2="70" y2="260" stroke="#1C1C1C" stroke-width="2"></line><text x="70" y="278">0 s</text>
          <line x1="194" y1="252" x2="194" y2="260" stroke="#1C1C1C" stroke-width="2"></line><text x="194" y="278">15 s</text>
          <line x1="318" y1="252" x2="318" y2="260" stroke="#1C1C1C" stroke-width="2"></line><text x="318" y="278">30 s</text>
          <line x1="442" y1="252" x2="442" y2="260" stroke="#1C1C1C" stroke-width="2"></line><text x="442" y="278">45 s</text>
          <line x1="566" y1="252" x2="566" y2="260" stroke="#1C1C1C" stroke-width="2"></line><text x="566" y="278">60 s</text>
        </g>

        
        <g stroke="#1F2D5A" stroke-width="6" fill="none" stroke-linecap="round">
          <line x1="70" y1="228" x2="194" y2="228"></line>
          <line x1="194" y1="182" x2="318" y2="182"></line>
          <line x1="318" y1="136" x2="442" y2="136"></line>
          <line x1="442" y1="90" x2="566" y2="90"></line>
        </g>
        <g stroke="#C0392B" stroke-width="4" fill="none">
          <line x1="194" y1="226" x2="194" y2="188" marker-end="url(#upC)"></line>
          <line x1="318" y1="180" x2="318" y2="142" marker-end="url(#upC)"></line>
          <line x1="442" y1="134" x2="442" y2="96" marker-end="url(#upC)"></line>
        </g>

        
        <text x="132" y="216" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1F2D5A">DWELL</text>
        <text x="132" y="200" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12" fill="#666">the arm is not moving</text>
        <text x="236" y="212" font-family="'Barlow Condensed',sans-serif" font-size="15" font-weight="700" fill="#C0392B">INDEX</text>
        <text x="236" y="228" font-family="'Barlow',sans-serif" font-size="12" fill="#C0392B">a quick 90° step</text>
        <text x="500" y="58" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#666">one full turn per minute</text>
      </svg>
