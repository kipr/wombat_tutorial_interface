<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="geneva-timing-title geneva-timing-description">
  <title id="geneva-timing-title">Four 90-degree indexes complete a minute</title>
  <desc id="geneva-timing-description">An arm-position graph from zero to sixty seconds shows four long horizontal dwells, each followed by a short smooth 90-degree index. It reaches 90 degrees at 15 seconds, 180 at 30, 270 at 45, and 360 at 60. The last step returns the clock arm to its starting direction.</desc>
  <defs>
  </defs>
  <rect width="720" height="460" fill="#fff"/>
