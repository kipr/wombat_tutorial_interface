<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="geneva-timing-title geneva-timing-description" role="img" viewBox="0 0 720 460"><title id="geneva-timing-title">Four 90-degree indexes complete a minute</title><desc id="geneva-timing-description">An arm-position graph from zero to sixty seconds shows four long horizontal dwells, each followed by a short smooth 90-degree index. It reaches 90 degrees at 15 seconds, 180 at 30, 270 at 45, and 360 at 60. The last step returns the clock arm to its starting direction.</desc><path fill="#fff" d="M0 0h720v460H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="24" y="30" font-size="23" font-weight="600">Four quick steps. Four long stops.</text><text x="24" y="55" fill="#697580">The driver keeps turning while the arm rests between steps.</text><text x="684" y="83" fill="#697580" font-size="15" text-anchor="end">one full turn per minute</text><path fill="none" stroke="#b7c1c9" stroke-dasharray="4 5" d="M86 365h582"/><text x="72" y="370" fill="#697580" font-size="14" text-anchor="end">0°</text><path fill="none" stroke="#b7c1c9" stroke-dasharray="4 5" d="M86 302h582"/><text x="72" y="307" fill="#697580" font-size="14" text-anchor="end">90°</text><path fill="none" stroke="#b7c1c9" stroke-dasharray="4 5" d="M86 239h582"/><text x="72" y="244" fill="#697580" font-size="14" text-anchor="end">180°</text><path fill="none" stroke="#b7c1c9" stroke-dasharray="4 5" d="M86 176h582"/><text x="72" y="181" fill="#697580" font-size="14" text-anchor="end">270°</text><path fill="none" stroke="#b7c1c9" stroke-dasharray="4 5" d="M86 113h582"/><text x="72" y="118" fill="#697580" font-size="14" text-anchor="end">360°</text><path fill="none" stroke="#36434f" stroke-width="1.25" d="M86 365v8"/><text x="86" y="398" fill="#697580" font-size="15" text-anchor="middle">0 s</text><path fill="none" stroke="#36434f" stroke-width="1.25" d="M231.5 365v8"/><text x="231.5" y="398" fill="#697580" font-size="15" text-anchor="middle">15 s</text><path fill="none" stroke="#36434f" stroke-width="1.25" d="M377 365v8"/><text x="377" y="398" fill="#697580" font-size="15" text-anchor="middle">30 s</text><path fill="none" stroke="#36434f" stroke-width="1.25" d="M522.5 365v8"/><text x="522.5" y="398" fill="#697580" font-size="15" text-anchor="middle">45 s</text><path fill="none" stroke="#36434f" stroke-width="1.25" d="M668 365v8"/><text x="668" y="398" fill="#697580" font-size="15" text-anchor="middle">60 s</text><path fill="none" stroke="#36434f" stroke-width="1.5" d="M86 96v269h582"/><text x="25" y="244" fill="#36434f" text-anchor="middle" transform="rotate(-90 25 244)">arm position</text><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-width="4" d="M86 365h109.125"/><path fill="none" stroke="#a83a30" stroke-width="3.5" d="m195.125 365 .909-.032.91-.102.909-.181.909-.27.91-.372.909-.488.91-.62.909-.771.909-.944.91-1.141.909-1.364.909-1.617.91-1.898.909-2.205.91-2.532.909-2.864.909-3.183.91-3.462.909-3.671.91-3.783.909-3.783.909-3.671.91-3.462.909-3.183.909-2.864.91-2.532.909-2.205.909-1.898.91-1.617.909-1.364.91-1.141.909-.944.909-.771.91-.62.909-.488.909-.372.91-.27.909-.181.91-.102.909-.032"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-width="4" d="M231.5 302h109.125"/><path fill="none" stroke="#a83a30" stroke-width="3.5" d="m340.625 302 .909-.032.91-.102.909-.181.909-.27.91-.372.909-.488.91-.62.909-.771.909-.944.91-1.141.909-1.364.909-1.617.91-1.898.909-2.205.91-2.532.909-2.864.909-3.183.91-3.462.909-3.671.91-3.783.909-3.783.909-3.671.91-3.462.909-3.183.909-2.864.91-2.532.909-2.205.909-1.898.91-1.617.909-1.364.91-1.141.909-.944.909-.771.91-.62.909-.488.909-.372.91-.27.909-.181.91-.102L377 239"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-width="4" d="M377 239h109.125"/><path fill="none" stroke="#a83a30" stroke-width="3.5" d="m486.125 239 .909-.032.91-.102.909-.181.909-.27.91-.372.909-.488.91-.62.909-.771.909-.944.91-1.141.909-1.364.9