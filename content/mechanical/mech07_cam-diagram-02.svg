<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="cam-pusher-title cam-pusher-description" role="img" viewBox="0 0 720 510"><title id="cam-pusher-title">A cam-driven arm gives an object a repeated push</title><desc id="cam-pusher-description">Side view of a stationary base supporting a rotating cam and a pivoting arm. The raised lobe presses against a roller under the arm. The solid arm is raised, with rubber bands on its tip touching the left side of an object on an elevated horizontal surface. The dashed arm shows the lowered position between pushes. The tip rises and moves right to push the object. Gravity or a rubber band returns the arm.</desc><defs><marker id="cam-pusher-arrow" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a83a30" d="m0 0 10 5-10 5Z"/></marker><marker id="cam-return-arrow" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#697580" d="m0 0 10 5-10 5Z"/></marker></defs><path fill="#fff" d="M0 0h720v510H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="24" y="30" font-size="23" font-weight="600">The cam turns. The arm gives one push.</text><text x="24" y="55" fill="#697580" font-size="14">SIDE VIEW · Solid arm = raised · Dashed arm = between pushes</text><rect width="474" height="10" x="222" y="215" fill="#e9edf0" stroke="#697580" stroke-width="1.5" rx="2"/><path stroke="#36434f" stroke-width="2.5" d="M222 215h474"/><path stroke="#b7c1c9" stroke-width="2" d="M650 225v227m16-227v227"/><text x="565" y="249" fill="#697580" font-size="14">horizontal plane</text><rect width="62" height="48" x="220" y="166" fill="#f3f5f6" stroke="#697580" stroke-width="1.75" rx="4"/><path fill="none" stroke="#e0e5e8" stroke-width="1.5" d="M226 172h50v36"/><text x="251" y="149" text-anchor="middle">object</text><path fill="none" stroke="#a83a30" stroke-width="2.5" marker-end="url(#cam-pusher-arrow)" d="M305 188h191"/><text x="305" y="172" fill="#a83a30" font-size="14">direction of object movement</text><rect width="34" height="67" x="333" y="333" fill="#e9edf0" stroke="#697580" stroke-width="1.5" rx="3"/><rect width="24" height="58" x="258" y="342" fill="#e9edf0" stroke="#697580" stroke-width="1.5" rx="3"/><rect width="350" height="52" x="40" y="400" fill="#f3f5f6" stroke="#697580" stroke-width="1.75" rx="6"/><rect width="332" height="34" x="49" y="409" fill="none" stroke="#e0e5e8" rx="3"/><g fill="#fff" stroke="#b7c1c9" stroke-width="1.25"><circle cx="56" cy="416" r="3"/><circle cx="374" cy="416" r="3"/><circle cx="56" cy="436" r="3"/><circle cx="374" cy="436" r="3"/></g><text x="215" y="432" font-size="17" font-weight="600" text-anchor="middle">STATIONARY BASE</text><path fill="none" stroke="#b7c1c9" stroke-width="1.25" d="M40 453h350m-330 0-8 9m32-9-8 9m32-9-8 9m32-9-8 9m32-9-8 9m32-9-8 9m32-9-8 9m32-9-8 9m32-9-8 9m32-9-8 9m32-9-8 9m32-9-8 9m32-9-8 9m32-9-8 9"/><g transform="matrix(.5 0 0 .5 270 342)"><path fill="#f3f5f6" stroke="#697580" stroke-width="3" d="m-33.676-81.301 1.03-.526.969-.695.914-.865.869-1.032.832-1.194.806-1.349.789-1.495.782-1.63.784-1.75.796-1.858.815-1.947.843-2.021.879-2.073.921-2.107.967-2.12 1.02-2.112 1.075-2.082 1.133-2.032 1.191-1.96 1.25-1.867 1.308-1.756 1.364-1.626 1.416-1.478 1.464-1.315 1.507-1.137 1.544-.948 1.574-.748 1.598-.54 1.614-.327L0-124l1.622.109 1.614.327 1.598.54 1.574.748 1.544.948 1.507 1.137 1.464 1.315 1.416 1.478 1.364 1.626 1.308 1.756 1.25 1.867 1.191 1.96 1.133 2.032 1.075 2.082 1.02 2.112.967 2.12.921 2.107.879 2.073.843 2.021.815 1.947.796 1.858.784 1.75.782 1.63.789 1.495.806 1.349.832 1.194.869 1.032.914.865.969.695 1.03.526a88 88 0 1 1-67.352 0Z"/><path fill="#fae8e3" stroke="#a83a30" stroke-width="3" d="m-33.676-81.301 1.03-.526.969-.695.914-.865.869-1.032.832-1.194.806-1.349.789-1.495.782-1.63.784-1.75.796-1.858.815-1.947.843-2.021.879-2.073.921-2.107.967-2.12 1.02-2.112 1.075-2.082 1.133-2.032 1.191-1.96 1.25-1.867 1.308-1.756 1.364-1.626 1.416-1.478 1.464-1.315 1.507-1.137 1.544-.948 1.574-.748 1.598-.54 1.614-.327L0-124l1.622.109 1.614.327 1.598.54 1.574.748 1.544.948 1.507 1.137 1.464 1.315 1.416 1.478 1.364 1.626 1.308 1.756 1.25 1.867 1.191 1.96 1.133 2.032 1.075 2.082 1.02 2.112.967 2.12.921 2.107.879 2.073.843 2.021.815 1.947.796 1.858.784 1.75.782 1.63.789 1.495.806 1.349.832 1.194.869 1.032.914.865.969.695 1.03.526a88 88 0 0 0-67.352 0Z"/><circle r="88" fill="none" stroke="#b7c1c9" stroke-dasharray="6 6" stroke-width="2"/><g fill="#fff" stroke="#b7c1c9" stroke-width="2.5"><circle cx="-52" r="11"/><circle cx="52" r="11"/><circle cy="52" r="11"/></g><circle r="12" fill="#e9edf0" stroke="#697580" stroke-width="3"/><path fill="#36434f" d="M-3-9h6v6h6v6H3v6h-6V3h-6v-6h6Z"/></g><path fill="none" stroke="#a83a30" stroke-width="2.5" marker-end="url(#cam-pusher-arrow)" d="M213.618 362.521a60 60 0 0 1 0-41.042"/><text x="185" y="387" fill="#a83a30" font-size="14">Cam turns</text><g fill="none" stroke="#a83a30" stroke-dasharray="5 4" stroke-width="1.5" transform="rotate(-13.6 350 350)"><path d="m343.05 355.72-140-170a9 9 0 0 1 13.9-11.44l140 170a9 9 0 0 1-13.9 11.44Z"/><circle cx="210" cy="180" r="10"/></g><path stroke="#a83a30" stroke-linecap="round" stroke-width="10" d="M270 253v17"/><path stroke="#8e3027" stroke-linecap="round" stroke-width="22" d="M350 350 210 180"/><path stroke="#fae8e3" stroke-linecap="round" stroke-width="18" d="M350 350 210 180"/><path stroke="#dca99f" stroke-width="1.5" d="M346 346 214 186"/><g fill="#fff" stroke="#a83a30" stroke-width="1.5"><circle cx="322" cy="316" r="3.5"/><circle cx="294" cy="282" r="3.5"/><circle cx="266" cy="248" r="3.5"/><circle cx="238" cy="214" r="3.5"/></g><circle cx="270" cy="270" r="10" fill="#e9edf0" stroke="#36434f" stroke-width="2"/><circle cx="270" cy="270" r="3" fill="#697580"/><circle cx="350" cy="350" r="12" fill="#e9edf0" stroke="#697580" stroke-width="2"/><circle cx="350" cy="350" r="5" fill="#36434f" stroke="#fff" stroke-width="1.5"/><circle cx="210" cy="180" r="10" fill="#a83a30" stroke="#8e3027" stroke-width="1.5"/><g fill="none" stroke="#e8b95b" stroke-width="2" transform="rotate(-39.47 210 180)"><ellipse cx="206" cy="180" rx="2" ry="8"/><ellipse cx="210" cy="180" rx="2" ry="9"/><ellipse cx="214" cy="180" rx="2" ry="8"/></g><text x="24" y="100" fill="#a83a30" font-size="15">rubber bands here to grip the object</text><path fill="none" stroke="#a83a30" stroke-width="1.25" d="m163 108 35 56"/><path fill="none" stroke="#a83a30" stroke-width="2" marker-end="url(#cam-pusher-arrow)" d="M155 224q4-23 23-40"/><path fill="none" stroke="#697580" stroke-width="1.5" marker-end="url(#cam-return-arrow)" d="M135 185q-17 20-20 45"/><text x="40" y="257" fill="#697580" font-size="14">Arm returns</text><path fill="none" stroke="#697580" stroke-width="1.25" d="M260 270h-94l-15 15"/><text x="24" y="303" font-size="14">Roller follows the cam edge</text><text x="440" y="324" fill="#a83a30" font-size="18" font-weight="600">MOVING COMPONENT</text><text x="440" y="348" font-size="15">The arm pivots to lift and push.</text><path fill="none" stroke="#a83a30" stroke-width="1.25" d="M428 330h-38l-61-21"/><path fill="none" stroke="#697580" stroke-width="1.25" d="m361 355 48 25"/><text x="423" y="386" fill="#697580" font-size="14">Fixed pivot</text><text x="440" y="421" font-size="15">Gravity or a rubber band</text><text x="440" y="444" font-size="15">brings the arm back down.</text><text x="24" y="492" fill="#46535f" font-size="15">The motor keeps turning. The object moves only when the arm reaches it.</text></g></svg>
