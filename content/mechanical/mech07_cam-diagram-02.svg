<svg viewBox="0 0 620 330" role="img" aria-label="Side view. A stationary base sits at the lower left. A cam-driven arm rises from it to reach an object resting on a horizontal surface above the base. Rubber bands at the tip of the arm give it grip, and the object slides to the right along the surface." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrowR2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#444"></path>
          </marker>
        </defs>

        
        <line x1="236" y1="128" x2="596" y2="128" stroke="#1C1C1C" stroke-width="4"></line>
        <text x="560" y="150" text-anchor="end" font-family="'Barlow',sans-serif" font-size="12.5" fill="#888">horizontal plane</text>

        
        <rect x="322" y="90" width="58" height="36" rx="3" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>
        <text x="351" y="80" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" fill="#444">object</text>

        
        <line x1="398" y1="108" x2="520" y2="108" stroke="#444" stroke-width="2.5" marker-end="url(#arrowR2)"></line>
        <text x="459" y="98" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#444">direction of object movement</text>

        
        <rect x="70" y="212" width="190" height="96" rx="3" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>
        <text x="165" y="252" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="18" font-weight="700" fill="#444">STATIONARY</text>
        <text x="165" y="273" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="18" font-weight="700" fill="#444">BASE</text>

        
        <line x1="150" y1="212" x2="330" y2="140" stroke="#C0392B" stroke-width="8" stroke-linecap="round"></line>
        <circle cx="150" cy="212" r="7" fill="#1C1C1C"></circle>
        <path d="M232,96 q10,0 10,10 v10 q0,10 10,10 q-10,0 -10,10 v10 q0,10 -10,10" fill="none" stroke="#C0392B" stroke-width="2.2"></path>
        <text x="224" y="132" text-anchor="end" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700" fill="#C0392B">MOVING</text>
        <text x="224" y="152" text-anchor="end" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700" fill="#C0392B">COMPONENT</text>

        
        <circle cx="330" cy="140" r="10" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="4 3"></circle>
        <line x1="344" y1="166" x2="382" y2="196" stroke="#888" stroke-width="1.4"></line>
        <text x="388" y="202" font-family="'Barlow',sans-serif" font-size="12.5" fill="#888">rubber bands here to grip the object</text>

        <text x="480" y="262" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700" fill="#1C1C1C">SIDE VIEW</text>
      </svg>
