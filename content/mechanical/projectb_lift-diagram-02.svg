<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="lift-strategies-title lift-strategies-description" role="img" viewBox="0 0 800 820"><title id="lift-strategies-title">Lift the load, then release it</title><desc id="lift-strategies-description">Four concepts, with grey dashed starting positions and blue deployed parts. The pivoting arm keeps the same length as it rises along a circular arc. The telescoping section retains overlap with its sleeve. Each scissor bar keeps the same length; midpoint pins join the crossed bars, and right ends slide in tracks to keep the platform level. The open tipping bin rotates about its supported bottom pivot and pours poms into a receiving container. Mount the bin on a lift to reach the required height.</desc><defs><marker id="lift-strategies-arrow" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#357458" d="m0 0 10 5-10 5Z"/></marker></defs><path fill="#fff" d="M0 0h800v820H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="17"><text x="400" y="34" font-size="24" font-weight="600" text-anchor="middle">Lift the load. Then release it.</text><path fill="none" stroke="#b7c1c9" stroke-dasharray="6 5" stroke-width="3" d="M140 69h42"/><text x="192" y="75" fill="#697580" font-size="16">starting position</text><path fill="none" stroke="#3d617e" stroke-width="4" d="M414 69h42"/><text x="466" y="75" fill="#3d617e" font-size="16">deployed position</text><rect width="368" height="298" x="24" y="106" fill="#fff" stroke="#e0e5e8" stroke-width="1.5" rx="4"/><rect width="368" height="298" x="408" y="106" fill="#fff" stroke="#e0e5e8" stroke-width="1.5" rx="4"/><rect width="368" height="320" x="24" y="432" fill="#fff" stroke="#e0e5e8" stroke-width="1.5" rx="4"/><rect width="368" height="320" x="408" y="432" fill="#fff" stroke="#e0e5e8" stroke-width="1.5" rx="4"/><text x="42" y="136" font-size="20" font-weight="600">1 · Pivoting arm</text><path fill="none" stroke="#697580" s