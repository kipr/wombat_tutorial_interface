<svg xmlns="http://www.w3.org/2000/svg" aria-label="Flowchart of the five-step engineering design process. Step one, clearly define the problem. Step two, determine the needs to be met. Step three, determine the constraints. Step four, break the project into manageable and attainable steps. Step five, a decision: does the result meet the needs? If yes, the process ends. If no, the process returns to step one." role="img" viewBox="0 0 620 600"><defs><marker id="ar" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1c1c1c" d="m0 0 10 5-10 5z"/></marker></defs><rect width="340" height="56" x="150" y="14" fill="#fbeef0" stroke="#c0392b" stroke-width="2" rx="6"/><text x="320" y="38" fill="#1c1c1c" font-family="'Barlow',sans-serif" font-size="15" font-weight="600" text-anchor="middle">1  Clearly define the problem</text><text x="320" y="58" fill="#1c1c1c" font-family="'Barlow',sans-serif" font-size="15" font-weight="600" text-anchor="middle">to be solved</text><path stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)" d="M320 70v24"/><rect width="340" height="46" x="150" y="98" fill="#fff" stroke="#ccc" stroke-width="2" rx="6"/><text x="320" y="127" fill="#1c1c1c" font-family="'Barlow',sans-serif" font-size="15" font-weight="600" text-anchor="middle">2  Determine the needs to be met</text><path stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)" d="M320 144v24"/><rect width="340" height="46" x="150" y="172" fill="#fff" stroke="#ccc" stroke-width="2" rx="6"/><text x="320" y="201" fill="#1c1c1c" font-family="'Barlow',sans-serif" font-size="15" font-weight="600" text-anchor="middle">3  Determine the constraints</text><path stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)" d="M320 218v24"/><rect width="340" height="56" x="150" y="246" fill="#fff" stroke="#ccc" stroke-width="2" rx="6"/><text x="320" y="270" fill="#1c1c1c" font-family="'Barlow',sans-serif" font-size="15" font-weight="600" text-anchor="middle">4  Break the project down into</text><text x="320" y="290" fill="#1c1c1c" font-family="'Barlow',sans-serif" font-size="15" font-weight="600" text-anchor="middle">manageable, attainable steps</text><path stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)" d="M320 302v24"/><path fill="#fbeef0" stroke="#c0392b" stroke-width="2" d="m320 330 180 90-180 90-180-90Z"/><text x="320" y="405" fill="#1c1c1c" font-family="'Barlow',sans-serif" font-size="15" font-weight="600" text-anchor="middle">5  Does the result meet</text><text x="320" y="425" fill="#1c1c1c" font-family="'Barlow',sans-serif" font-size="15" font-weight="600" text-anchor="middle">the needs you defined,</text><text x="320" y="445" fill="#1c1c1c" font-family="'Barlow',sans-serif" font-size="15" font-weight="600" text-anchor="middle">within the constraints?</text><path stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)" d="M320 510v24"/><text x="334" y="528" fill="#1e8449" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700">YES</text><rect width="240" height="44" x="200" y="538" fill="#eef4ee" stroke="#1e8449" stroke-width="2" rx="6"/><text x="320" y="566" fill="#1c1c1c" font-family="'Barlow',sans-serif" font-size="15" font-weight="600" text-anchor="middle">End of the process</text><path fill="none" stroke="#c0392b" stroke-dasharray="7 5" stroke-width="2" marker-end="url(#ar)" d="M140 420H64V42h82"/><text x="74" y="410" fill="#c0392b" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700">NO</text><text x="74" y="240" fill="#c0392b" font-family="'Barlow Condensed',sans-serif" font-size="14" font-weight="600" text-anchor="middle" transform="rotate(-90 74 240)">refine · redo · rethink · rebuild</text></svg>
