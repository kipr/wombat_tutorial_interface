<svg xmlns="http://www.w3.org/2000/svg" aria-label="Two claw types compared. In a fixed claw, one jaw is stationary and the moving jaw shoves the object sideways until it is pinned against the fixed jaw. In a pincer, both jaws close inward and the object stays where it started." role="img" viewBox="0 0 620 240"><defs><marker id="mA" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#c0392b" d="m0 0 10 5-10 5z"/></marker><marker id="mG" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#888" d="m0 0 10 5-10 5z"/></marker></defs><rect width="296" height="224" x="8" y="8" fill="#fff" stroke="#ccc" rx="8"/><text x="22" y="32" fill="#1c1c1c" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700">FIXED CLAW — one side moves</text><path fill="#444" d="M70 70h14v96H70z"/><text x="77" y="188" fill="#444" font-family="'Barlow',sans-serif" font-size="12.5" text-anchor="middle">fixed</text><path fill="#c0392b" d="M240 70h14v96h-14z"/><path stroke="#c0392b" stroke-width="2.5" marker-end="url(#mA)" d="M232 118h-36"/><text x="247" y="188" fill="#c0392b" font-family="'Barlow',sans-serif" font-size="12.5" text-anchor="middle">moves</text><circle cx="160" cy="118" r="19" fill="#fff" stroke="#888" stroke-dasharray="5 4" stroke-width="2"/><circle cx="105" cy="118" r="19" fill="#f2f2f2" stroke="#444" stroke-width="2"/><path stroke="#888" stroke-width="2" marker-end="url(#mG)" d="M138 86h-14"/><text x="156" y="62" fill="#888" font-family="'Barlow',sans-serif" font-size="12.5" text-anchor="middle">object gets shoved</text><rect width="296" height="224" x="316" y="8" fill="#fff" stroke="#ccc" rx="8"/><text x="330" y="32" fill="#1c1c1c" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700">PINCER — both sides move</text><path fill="#c0392b" d="M378 70h14v96h-14z"/><path stroke="#c0392b" stroke-width="2.5" marker-end="url(#mA)" d="M400 118h32"/><path fill="#c0392b" d="M548 70h14v96h-14z"/><path stroke="#c0392b" stroke-width="2.5" marker-end="url(#mA)" d="M540 118h-32"/><circle cx="470" cy="118" r="19" fill="#f2f2f2" stroke="#444" stroke-width="2"/><text x="470" y="62" fill="#1e8449" font-family="'Barlow',sans-serif" font-size="12.5" text-anchor="middle">object stays put</text><text x="385" y="188" fill="#c0392b" font-family="'Barlow',sans-serif" font-size="12.5">moves</text><text x="520" y="188" fill="#c0392b" font-family="'Barlow',sans-serif" font-size="12.5">also moves</text></svg>
