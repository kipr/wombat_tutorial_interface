<svg viewBox="0 0 620 340" role="img" aria-label="A Geneva drive. A driver wheel on the left carries a pin near its rim and a raised lock disc. A slotted cross on the right has four slots cut in from the rim. The pin enters a slot, turns the cross a quarter turn, then leaves, and the lock disc holds the cross still until the next pass." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="rotG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"></path>
          </marker>
        </defs>

        
        <circle cx="330" cy="180" r="100" fill="#F2F2F2" stroke="#1C1C1C" stroke-width="3"></circle>
        
        <rect x="222" y="169" width="88" height="22" fill="#fff" stroke="#1C1C1C" stroke-width="2"></rect>
        <rect x="319" y="72" width="22" height="88" fill="#fff" stroke="#1C1C1C" stroke-width="2"></rect>
        <rect x="350" y="169" width="88" height="22" fill="#fff" stroke="#1C1C1C" stroke-width="2"></rect>
        <rect x="319" y="200" width="22" height="88" fill="#fff" stroke="#1C1C1C" stroke-width="2"></rect>
        <circle cx="330" cy="180" r="14" fill="#fff" stroke="#1C1C1C" stroke-width="2"></circle>
        <circle cx="330" cy="180" r="5" fill="#444"></circle>

        
        <line x1="330" y1="180" x2="420" y2="92" stroke="#C0392B" stroke-width="8" stroke-linecap="round"></line>
        <circle cx="420" cy="92" r="7" fill="#C0392B"></circle>

        
        <circle cx="170" cy="180" r="58" fill="#fff" stroke="#1C1C1C" stroke-width="3"></circle>
        <circle cx="170" cy="180" r="36" fill="#FDF2F2" stroke="#C0392B" stroke-width="2.5"></circle>
        <circle cx="170" cy="180" r="5" fill="#444"></circle>
        <circle cx="222" cy="180" r="11" fill="#C0392B" stroke="#922B21" stroke-width="2"></circle>

        
        <path d="M118,232 A74,74 0 0 1 106,158" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#rotG)"></path>
        <path d="M330,300 A120,120 0 0 0 434,246" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#rotG)"></path>

        
        <text x="170" y="102" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1C1C1C">DRIVER</text>
        <text x="170" y="120" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12" fill="#666">turns steadily</text>
        <text x="118" y="286" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="14" font-weight="700" fill="#C0392B">LOCK DISC</text>
        <text x="222" y="326" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="14" font-weight="700" fill="#C0392B">DRIVE PIN</text>
        <line x1="222" y1="192" x2="222" y2="312" stroke="#C0392B" stroke-width="1.4"></line>
        <line x1="140" y1="200" x2="118" y2="274" stroke="#C0392B" stroke-width="1.4"></line>
        <text x="462" y="176" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1C1C1C">SLOTTED CROSS</text>
        <text x="462" y="196" font-family="'Barlow',sans-serif" font-size="12" fill="#666">four slots, four stops</text>
        <text x="446" y="76" font-family="'Barlow Condensed',sans-serif" font-size="15" font-weight="700" fill="#C0392B">ARM</text>
      </svg>
