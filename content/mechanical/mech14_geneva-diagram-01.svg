<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="geneva-drive-title geneva-drive-description" role="img" viewBox="0 0 720 500"><title id="geneva-drive-title">A four-slot Geneva drive indexes and locks</title><desc id="geneva-drive-description">A driver on the left turns clockwise and carries a pin at radius equal to the shaft spacing divided by square root of two. The pin is at the mouth of the upper-left slot on the four-slot cross. It drives the cross counterclockwise through 90 degrees. A relieved raised lock disc fits the concave cutout between slots during dwell. A clock arm is fixed to the cross.</desc><defs><marker id="geneva-driver-turn" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a83a30" d="m0 0 10 5-10 5Z"/></marker><marker id="geneva-cross-turn" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#36434f" d="m0 0 10 5-10 5Z"/></marker></defs><path fill="#fff" d="M0 0h720v500H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="24" y="30" font-size="23" font-weight="600">One pass through a slot. One quarter turn.</text><text x="24" y="55" fill="#697580">Four driver turns make one full turn of the clock arm.</text><circle cx="245" cy="270" r="143" fill="#f3f5f6" stroke="#b7c1c9" stroke-width="1.25"/><path fill="#fae8e3" stroke="#a83a30" stroke-width="1.5" d="m245 270 106.252 28.47A110 110 0 1 1 216.53 163.748Z"/><path fill="#e9edf0" stroke="#36434f" stroke-linejoin="round" stroke-width="1.5" d="M117.318 85.214a145 145 0 0 1-9.957 12.247L43.134 33.234a7 7 0 0 0-9.9 9.9l64.227 64.227a145 145 0 0 1-12.247 9.957 112 112 0 0 0-170.428 0 145 145 0 0 1-12.247-9.957l64.227-64.227a7 7 0 0 0-9.9-9.9l-64.227 64.227a145 145 0 0 1-9.957-12.247 112 112 0 0 0 0-170.428 145 145 0 0 1 9.957-12.247l64.227 64.227a7 7 0 0 0 9.9-9.9l-64.227-64.227a145 145 0 0 1 12.247-9.957 112 112 0 0 0 170.428 0 145 145 0 0 1 12.247 9.957L33.234-43.134a7 7 0 0 0 9.9 9.9l64.227-64.227a145 145 0 0 1 9.957 12.247 112 112 0 0 0 0 170.428Z" transform="translate(435 270)"/><path fill="none" stroke="#a83a30" stroke-linecap="round" stroke-width="18" d="M435 270V118"/><path fill="none" stroke="#fae8e3" stroke-linecap="round" stroke-width="14" d="M435 270V118"/><circle cx="435" cy="270" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/><circle cx="435" cy="270" r="3.5" fill="#36434f" stroke="#36434f"/><circle cx="245" cy="270" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/><circle cx="245" cy="270" r="3.5" fill="#36434f" stroke="#36434f"/><circle cx="340" cy="175" r="6" fill="#a83a30" stroke="#fff" stroke-width="2"/><path fill="none" stroke="#a83a30" stroke-width="2.5" marker-end="url(#geneva-driver-turn)" d="M122 198a143 143 0 0 1 93-68"/><path fill="none" stroke="#36434f" stroke-width="2.5" marker-end="url(#geneva-cross-turn)" d="M551 337a135 135 0 0 0 1-134"/><text x="54" y="116" fill="#36434f" font-size="18" font-weight="600">DRIVER</text><text x="54" y="138" fill="#697580" font-size="15">turns steadily</text><text x="40" y="342" fill="#a83a30" font-size="17" font-weight="600">LOCK DISC</text><path fill="none" stroke="#a83a30" stroke-width="1.25" d="m141 338 52-23"/><text x="40" y="431" fill="#a83a30" font-size="17" font-weight="600">DRIVE PIN</text><path fill="none" stroke="#a83a30" stroke-width="1.25" d="M148 425h37l155-241"/><text x="578" y="145" fill="#a83a30" font-size="17" font-weight="600">ARM</text><path fill="none" stroke="#a83a30" stroke-width="1.25" d="m565 141-118-15"/><text x="544" y="396" fill="#36434f" font-size="17" font-weight="600">SLOTTED CROSS</text><text x="544" y="419" fill="#697580" font-size="15">four slots, four stops</text><text x="260" y="474" fill="#36434f" font-size="17" text-anchor="middle">Pin enters. Cross indexes. Lock holds.</text></g></svg>
