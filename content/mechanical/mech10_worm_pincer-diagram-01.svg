  <g font-family="Barlow, Arial, sans-serif" fill="#263340" font-size="16">
    <text x="24" y="30" font-size="23" fill="#263340" font-weight="600">Same push. Opposite sides. Opposite turns.</text>
    <text x="24" y="55" font-size="15" fill="#697580">The worm does the driving. The two wheels never touch each other.</text>
