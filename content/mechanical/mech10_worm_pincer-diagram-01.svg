<svg viewBox="0 0 620 280" role="img" aria-label="A worm with one gear above it and one gear below. The thread pushes both gears in the same direction along the worm, but because it contacts the upper gear at its bottom and the lower gear at its top, the two gears rotate in opposite directions." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="pushA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1E8449"></path>
          </marker>
          <marker id="rotD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"></path>
          </marker>
        </defs>

        
        <rect x="150" y="120" width="290" height="38" rx="4" fill="#FDF2F2" stroke="#C0392B" stroke-width="2.5"></rect>
        <g stroke="#C0392B" stroke-width="2">
          <line x1="166" y1="158" x2="188" y2="120"></line><line x1="196" y1="158" x2="218" y2="120"></line>
          <line x1="226" y1="158" x2="248" y2="120"></line><line x1="256" y1="158" x2="278" y2="120"></line>
          <line x1="286" y1="158" x2="308" y2="120"></line><line x1="316" y1="158" x2="338" y2="120"></line>
          <line x1="346" y1="158" x2="368" y2="120"></line><line x1="376" y1="158" x2="398" y2="120"></line>
        </g>
        <text x="106" y="145" text-anchor="end" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700" fill="#C0392B">WORM</text>

        
        <circle cx="295" cy="78" r="42" fill="#fff" stroke="#1C1C1C" stroke-width="6" stroke-dasharray="13.2 13.2"></circle>
        <circle cx="295" cy="78" r="33" fill="#fff" stroke="#CCC" stroke-width="1.5"></circle>
        <circle cx="295" cy="78" r="5" fill="#444"></circle>
        <path d="M262,44 A44,44 0 0 0 258,96" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#rotD)"></path>
        <text x="180" y="60" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="15" font-weight="700" fill="#C0392B">COUNTER-CW</text>

        
        <circle cx="295" cy="200" r="42" fill="#fff" stroke="#1C1C1C" stroke-width="6" stroke-dasharray="13.2 13.2"></circle>
        <circle cx="295" cy="200" r="33" fill="#fff" stroke="#CCC" stroke-width="1.5"></circle>
        <circle cx="295" cy="200" r="5" fill="#444"></circle>
        <path d="M328,234 A44,44 0 0 0 332,182" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#rotD)"></path>
        <text x="180" y="228" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="15" font-weight="700" fill="#C0392B">CLOCKWISE</text>

        
        <line x1="266" y1="112" x2="324" y2="112" stroke="#1E8449" stroke-width="2.5" marker-end="url(#pushA)"></line>
        <line x1="266" y1="166" x2="324" y2="166" stroke="#1E8449" stroke-width="2.5" marker-end="url(#pushA)"></line>
        <text x="470" y="106" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#1E8449">pushed at its bottom</text>
        <text x="470" y="176" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#1E8449">pushed at its top</text>
        <text x="470" y="140" font-family="'Barlow',sans-serif" font-size="13" fill="#666">same push, both times</text>
      </svg>
