<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="worm-pincer-concept-title worm-pincer-concept-description">
  <title id="worm-pincer-concept-title">The same push turns two gears in opposite directions</title>
  <desc id="worm-pincer-concept-description">A horizontal worm meshes with one wheel above it and another below. For the direction shown, the screw pushes both contact points right. The upper gear is pushed at its bottom and turns counterclockwise; the lower gear is pushed at its top and turns clockwise. The wheels do not touch each other.</desc>
