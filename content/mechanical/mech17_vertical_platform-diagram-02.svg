<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 535" role="img" aria-labelledby="equal-work-title equal-work-description">
  <title id="equal-work-title">Force and distance trade while ideal work stays equal</title>
  <desc id="equal-work-description">The motor-side rectangle is 280 by 56 units. The platform-side rectangle is 56 by 280 units. Each has exactly the same area: five distance units times one force unit equals one distance unit times five force units. Friction reduces the useful output of a real machine.</desc>
  <rect width="720" height="535" fill="#fff"/>
  <g font-family="Barlow, Arial, sans-serif" fill="#263340" font-size="16">
    <!-- Equal areas: 280×56 = 56×280 = 15680. -->
    <text x="360" y="31" font-size="23" fill="#263340" text-anchor="middle" font-weight="600">SAME AREA — SAME WORK</text>
    <text x="360" y="59" font-size="17" fill="#697580" text-anchor="middle">An ideal machine trades distance for force.</text>
    <rect x="82" y="334" width="280" height="56" rx="3" fill="#eaf0f5" stroke="#3d617e" stroke-width="1.5" />
    <rect x="484" y="110" width="56" height="280" rx="3" fill="#fae8e3" stroke="#a83a30" stroke-width="1.5" />
    <text x="222" y="312" font-size="18" fill="#3d617e" text-anchor="middle" font-weight="600">AT THE MOTOR</text>
    <text x="565" y="89" font-size="18" fill="#a83a30" text-anchor="middle" font-weight="600">AT THE PLATFORM</text>
    <text x="222" y="370" font-size="17" fill="#3d617e" text-anchor="middle">5 distance × 1 force</text>
    <text x="514" y="258" font-size="16" fill="#a83a30" text-anchor="middle" transform="rotate(-90 514 258)">1 distance × 5 force</text>
    <text x="416" y="300" font-size="34" fill="#36434f" text-anchor="middle" font-weight="600">=</text>
    <path d="M82 420L362 420M82 415L82 425M362 415L362 425" fill="none" stroke="#697580" stroke-width="1.25" />
    <text x="222" y="446" font-size="16" fill="#697580" text-anchor="middle">long distance</text>
    <path d="M484 420L540 420M484 415L484 425M540 415L540 425" fill="none" stroke="#697580" stroke-width="1.25" />
    <text x="512" y="446" font-size="16" fill="#697580" text-anchor="middle">short distance</text>
    <path d="M58 334L58 390M63 334L53 334M63 390L53 390" fill="none" stroke="#697580" stroke-width="1.25" />
    <text x="36" y="362" font-size="15" fill="#697580" text-anchor="middle" transform="rotate(-90 36 362)">small force</text>
    <path d="M592 110L592 390M597 110L587 110M597 390L587 390" fill="none" stroke="#a83a30" stroke-width="1.25" />
    <text x="618" y="250" font-size="16" fill="#a83a30" text-anchor="middle" transform="rotate(-90 618 250)">large force</text>
    <text x="360" y="486" font-size="16" fill="#36434f" text-anchor="middle">Both rectangles: 5 units of work. The shape changes; the area does not.</text>
    <text x="360" y="511" font-size="15" fill="#697580" text-anchor="middle">Real machines lose some input work to friction.</text>
  </g>
</svg>
