<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="equal-work-title equal-work-description" role="img" viewBox="0 0 720 535"><title id="equal-work-title">Force and distance trade while ideal work stays equal</title><desc id="equal-work-description">The motor-side rectangle is 280 by 56 units. The platform-side rectangle is 56 by 280 units. Each has exactly the same area: five distance units times one force unit equals one distance unit times five force units. Friction reduces the useful output of a real machine.</desc><path fill="#fff" d="M0 0h720v535H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="360" y="31" font-size="23" font-weight="600" text-anchor="middle">SAME AREA — SAME WORK</text><text x="360" y="59" fill="#697580" font-size="17" text-anchor="middle">An ideal machine trades distance for force.</text><rect width="280" height="56" x="82" y="334" fill="#eaf0f5" stroke="#3d617e" stroke-width="1.5" rx="3"/><rect width="56" height="280" x="484" y="110" fill="#fae8e3" stroke="#a83a30" stroke-width="1.5" rx="3"/><text x="222" y="312" fill="#3d617e" font-size="18" font-weight="600" text-anchor="middle">AT THE MOTOR</text><text x="565" y="89" fill="#a83a30" font-size="18" font-weight="600" text-anchor="middle">AT THE PLATFORM</text><text x="222" y="370" fill="#3d617e" font-size="17" text-anchor="middle">5 distance × 1 force</text><text x="514" y="258" fill="#a83a30" text-anchor="middle" transform="rotate(-90 514 258)">1 distance × 5 force</text><text x="416" y="300" fill="#36434f" font-size="34" font-weight="600" text-anchor="middle">=</text><path fill="none" stroke="#697580" stroke-width="1.25" d="M82 420h280m-280-5v10m280-10v10"/><text x="222" y="446" fill="#697580" text-anchor="middle">long distance</text><path fill="none" stroke="#697580" stroke-width="1.25" d="M484 420h56m-56-5v10m56-10v10"/><text x="512" y="446" fill="#697580" text-anchor="middle">short distance</text><path fill="none" stroke="#697580" stroke-width="1.25" d="M58 334v56m5-56H53m10 56H53"/><text x="36" y="362" fill="#697580" font-size="15" text-anchor="middle" transform="rotate(-90 36 362)">small force</text><path fill="none" stroke="#a83a30" stroke-width="1.25" d="M592 110v280m5-280h-10m10 280h-10"/><text x="618" y="250" fill="#a83a30" text-anchor="middle" transform="rotate(-90 618 250)">large force</text><text x="360" y="486" fill="#36434f" text-anchor="middle">Both rectangles: 5 units of work. The shape changes; the area does not.</text><text x="360" y="511" fill="#697580" font-size="15" text-anchor="middle">Real machines lose some input work to friction.</text></g></svg>
