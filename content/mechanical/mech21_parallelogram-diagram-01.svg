<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="continuous-lift-title continuous-lift-description" role="img" viewBox="0 0 720 510"><title id="continuous-lift-title">Continuous rotation can lift and lower</title><desc id="continuous-lift-description">A guided platform driven by a wheel through a pivoting rod. The solid upper and dashed lower positions share a 45-unit crank radius and a 160-unit connecting rod, giving 90 units of lift. The platform reverses at each end while the wheel continues in one direction. The guides constrain this slider-crank example; the next diagram compares free linkages.</desc><defs><marker id="lift-turn" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a83a30" d="m0 0 10 5-10 5Z"/></marker><marker id="lift-travel" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#357458" d="m0 0 10 5-10 5Z"/></marker><marker id="lift-travel-start" markerHeight="5" markerWidth="5" orient="auto" refX="2" refY="5" viewBox="0 0 10 10"><path fill="#357458" d="M10 0 0 5l10 5Z"/></marker></defs><path fill="#fff" d="M0 0h720v510H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="360" y="31" font-size="23" font-weight="600" text-anchor="middle">Continuous rotation can lift and lower</text><text x="360" y="60" fill="#697580" text-anchor="middle">Slider-crank example · the guides keep this platform moving vertically.</text><rect width="278" height="161" x="66" y="124" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="6"/><rect width="260" height="143" x="75" y="133" fill="none" stroke="#e0e5e8" rx="3"/><circle cx="82" cy="140" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="328" cy="140" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="82" cy="269" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="328" cy="269" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><path fill="none" stroke="#36434f" stroke-width="7" d="M80 132v143m250-143v143"/><path fill="none" stroke="#b7c1c9" stroke-width="3" d="M80 132v143m250-143v143"/><path fill="none" stroke="#b7c1c9" stroke-dasharray="6 5" stroke-linecap="round" stroke-width="3" d="M205 410V250"/><rect width="226" height="14" x="92" y="243" fill="none" stroke="#b7c1c9" stroke-dasharray="6 5" stroke-width="1.5" rx="3"/><text x="110" y="275" fill="#697580" font-size="15">lower position</text><circle cx="205" cy="365" r="60" fill="#f3f5f6" stroke="#697580" stroke-width="1.5"/><circle cx="205" cy="365" r="45" fill="none" stroke="#b7c1c9"/><path fill="none" stroke="#a83a30" stroke-width="4" d="M205 365v-45"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-width="18" d="M205 320V160"/><path fill="none" stroke="#e9edf0" stroke-linecap="round" stroke-width="14" d="M205 320V160"/><rect width="24" height="18" x="72" y="241" fill="none" stroke="#b7c1c9" stroke-dasharray="6 5" stroke-width="1.5" rx="3"/><rect width="24" height="18" x="314" y="241" fill="none" stroke="#b7c1c9" stroke-dasharray="6 5" stroke-width="1.5" rx="3"/><rect width="24" height="18" x="72" y="151" fill="#e9edf0" stroke="#697580" stroke-width="1.5" rx="3"/><rect width="24" height="18" x="314" y="151" fill="#e9edf0" stroke="#697580" stroke-width="1.5" rx="3"/><rect width="226" height="14" x="92" y="153" fill="#eaf0f5" stroke="#3d617e" stroke-width="1.5" rx="3"/><circle cx="205" cy="160" r="6" fill="#fff" stroke="#36434f" stroke-width="1.5"/><circle cx="205" cy="160" r="2" fill="#36434f" stroke="#36434f"/><circle cx="205" cy="320" r="7" fill="#fae8e3" stroke="#a83a30" stroke-width="1.5"/><circle cx="205" cy="365" r="6" fill="#fff" stroke="#36434f" stroke-width="1.5"/><circle cx="205" cy="365" r="2" fill="#36434f" stroke="#36434f"/><circle cx="205" cy="410" r="7" fill="#fff" stroke="#b7c1c9" stroke-width="1.5"/><path fill="none" stroke="#a83a30" stroke-width="2.5" marker-end="url(#lift-turn)" d="M139 409a79 79 0 0 1 0-88"/><text x="75" y="462" fill="#a83a30" font-size="18" font-weight="600">ONE DIRECTION</text><text x="75" y="486" fill="#a83a30" font-size="18" font-weight="600">ONLY</text><path fill="none" stroke="#357458" stroke-width="2.2" marker-end="url(#lift-travel)" marker-start="url(#lift-travel-start)" d="M366 245v-86"/><text x="398" y="170" fill="#357458" font-size="20" font-weight="600">UP AND DOWN</text><text x="398" y="199" fill="#36434f">the platform reverses</text><text x="398" y="223" fill="#697580">even though the wheel never does</text><text x="398" y="293" font-size="18" font-weight="600">Lift = twice the pin offset</text><text x="398" y="321" fill="#697580" font-size="15">the same rule as the crank in Challenge 6</text><path fill="none" stroke="#a83a30" stroke-width="1.25" d="M205 440h45m-45-5v10m45-10v10"/><text x="252" y="445" fill="#a83a30" font-size="15">pin offset</text><text x="398" y="378" fill="#36434f">Both rod ends pivot.</text><text x="398" y="403" fill="#697580">Guides prevent sideways motion.</text></g></svg>
