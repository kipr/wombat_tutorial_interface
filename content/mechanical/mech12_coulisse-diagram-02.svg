<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="coulisse-poms-title coulisse-poms-description" role="img" viewBox="0 0 720 470"><title id="coulisse-poms-title">The arm’s height window isolates the top pom</title><desc id="coulisse-poms-description">Side view of an effector arm on a stationary base. Its underside is one and a half inches above the ground and its height is one and a quarter inches, both inside the lesson’s allowed ranges. It clears the two touching bottom poms and strikes the third balanced on top.</desc><defs><marker id="pom-hit" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a83a30" d="m0 0 10 5-10 5Z"/></marker></defs><path fill="#fff" d="M0 0h720v470H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="24" y="30" font-size="23" font-weight="600">Strike the top pom. Clear the bottom layer.</text><text x="24" y="55" fill="#697580">Set the arm’s underside above the lower poms before you run it.</text><path fill="none" stroke="#36434f" stroke-width="2.5" d="M48 340h638"/><rect width="152" height="170" x="63" y="170" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="6"/><rect width="134" height="152" x="72" y="179" fill="none" stroke="#e0e5e8" rx="3"/><circle cx="79" cy="186" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="199" cy="186" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="79" cy="324" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="199" cy="324" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><text x="139" y="307" fill="#697580" font-size="15" font-weight="600" text-anchor="middle">STATIONARY</text><text x="139" y="327" fill="#697580" font-size="15" font-weight="600" text-anchor="middle">BASE</text><rect width="216" height="50" x="215" y="230" fill="#fae8e3" stroke="#a83a30" stroke-width="1.5" rx="3"/><text x="321" y="213" fill="#a83a30" font-size="17" font-weight="600" text-anchor="middle">EFFECTOR ARM</text><path fill="none" stroke="#a83a30" d="M232 242h186"/><path fill="none" stroke="#a83a30" stroke-width="2.5" marker-end="url(#pom-hit)" d="M450 255h44"/><circle cx="533" cy="315" r="25" fill="#fff" stroke="#697580" stroke-width="1.5"/><circle cx="583" cy="315" r="25" fill="#fff" stroke="#697580" stroke-width="1.5"/><circle cx="558" cy="271.699" r="25" fill="#fae8e3" stroke="#a83a30" stroke-width="2"/><text x="558" y="225" fill="#a83a30" font-weight="600" text-anchor="middle">only this one</text><text x="558" y="373" fill="#697580" text-anchor="middle">these must not move</text><path fill="none" stroke="#a83a30" stroke-width="1.25" d="M257 230v50m5-50h-10m10 50h-10"/><text x="270" y="258" fill="#a83a30">¾–2″ tall</text><path fill="none" stroke="#697580" stroke-width="1.25" d="M336 280v60m5-60h-10m10 60h-10"/><text x="216" y="407" fill="#36434f">1¼–1¾″ off the ground</text><path fill="none" stroke="#697580" stroke-width="1.25" d="M334 386v-42"/><text x="63" y="407" fill="#36434f" font-size="15" font-weight="600">SIDE VIEW</text><text x="24" y="447" fill="#697580" font-size="15">Shown: a 1¼″ tall arm with its underside 1½″ above the ground.</text></g></svg>
