<svg viewBox="0 0 620 320" role="img" aria-label="Side view. A stationary base at the left carries an effector arm that extends to the right at a set height. Two poms rest on the ground with a third balanced on top of them. The arm passes above the bottom two poms and strikes only the top one, knocking it clear." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="hitA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"></path>
          </marker>
          <marker id="tk3" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M0,1 L10,1" stroke="#444" stroke-width="1.6"></path>
          </marker>
        </defs>

        
        <line x1="60" y1="250" x2="596" y2="250" stroke="#1C1C1C" stroke-width="3"></line>

        
        <rect x="80" y="130" width="150" height="120" rx="3" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>
        <text x="155" y="182" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="15" font-weight="700" fill="#444">STATIONARY</text>
        <text x="155" y="202" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="15" font-weight="700" fill="#444">BASE</text>

        
        <rect x="230" y="166" width="160" height="24" rx="2" fill="#C0392B" stroke="#922B21" stroke-width="2"></rect>
        <text x="300" y="156" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="15" font-weight="700" fill="#C0392B">EFFECTOR ARM</text>

        
        <line x1="410" y1="166" x2="410" y2="190" stroke="#444" stroke-width="1.6" marker-start="url(#tk3)" marker-end="url(#tk3)"></line>
        <text x="420" y="184" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#444">¾–2″ tall</text>
        <line x1="410" y1="190" x2="410" y2="250" stroke="#444" stroke-width="1.6" marker-start="url(#tk3)" marker-end="url(#tk3)"></line>
        <text x="420" y="226" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#444">1¼–1¾″ off the ground</text>

        
        <circle cx="480" cy="224" r="26" fill="#fff" stroke="#888" stroke-width="2.5"></circle>
        <circle cx="534" cy="224" r="26" fill="#fff" stroke="#888" stroke-width="2.5"></circle>
        <text x="507" y="288" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" fill="#888">these must not move</text>

        
        <circle cx="507" cy="178" r="26" fill="#FADBD8" stroke="#C0392B" stroke-width="2.5"></circle>
        <text x="507" y="140" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#C0392B">only this one</text>

        
        <line x1="396" y1="178" x2="452" y2="178" stroke="#C0392B" stroke-width="3" marker-end="url(#hitA)"></line>

        <text x="155" y="290" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1C1C1C">SIDE VIEW</text>
      </svg>
