<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 485" role="img" aria-labelledby="rack-jaws-title rack-jaws-description">
  <title id="rack-jaws-title">Two sliding jaws close by the same amount</title>
  <desc id="rack-jaws-description">Top view of a stationary pinion between two guided racks. Counterclockwise rotation moves the left rack down and the right rack up. Grey jaws are open; red dashed jaws close equally on a four-inch block. The 24-tooth pinion and both racks have matching pitch.</desc>
