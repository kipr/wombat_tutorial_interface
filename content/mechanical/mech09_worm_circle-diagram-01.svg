<svg viewBox="0 0 620 300" role="img" aria-label="Top view of a worm gear set. A motor turns a threaded worm whose axis runs left to right. The worm meshes with the rim of a toothed wheel whose axis points straight up out of the surface. One full turn of the worm advances the wheel by exactly one tooth." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="axA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#888"></path>
          </marker>
          <marker id="rotB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"></path>
          </marker>
        </defs>

        
        <circle cx="400" cy="176" r="82" fill="#fff" stroke="#1C1C1C" stroke-width="7" stroke-dasharray="10.7 10.7"></circle>
        <circle cx="400" cy="176" r="70" fill="#fff" stroke="#CCC" stroke-width="1.5"></circle>
        <circle cx="400" cy="176" r="7" fill="#C0392B"></circle>
        <text x="400" y="182" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12" fill="#888">24 teeth</text>

        
        <rect x="70" y="66" width="86" height="56" rx="4" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>
        <text x="113" y="100" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#444">MOTOR</text>

        
        <rect x="156" y="76" width="180" height="36" rx="4" fill="#FDF2F2" stroke="#C0392B" stroke-width="2.5"></rect>
        <g stroke="#C0392B" stroke-width="2">
          <line x1="172" y1="112" x2="192" y2="76"></line><line x1="196" y1="112" x2="216" y2="76"></line>
          <line x1="220" y1="112" x2="240" y2="76"></line><line x1="244" y1="112" x2="264" y2="76"></line>
          <line x1="268" y1="112" x2="288" y2="76"></line><line x1="292" y1="112" x2="312" y2="76"></line>
        </g>
        <text x="246" y="62" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700" fill="#C0392B">WORM — a screw</text>

        
        <line x1="60" y1="94" x2="352" y2="94" stroke="#888" stroke-width="1.5" stroke-dasharray="8 6" marker-end="url(#axA)"></line>
        <text x="120" y="140" font-family="'Barlow',sans-serif" font-size="12.5" fill="#888">worm axis — lies flat</text>

        
        <circle cx="400" cy="176" r="16" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4"></circle>
        <text x="470" y="252" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" fill="#888">wheel axis points</text>
        <text x="470" y="270" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" fill="#888">straight up out of the table</text>
        <line x1="424" y1="192" x2="452" y2="238" stroke="#888" stroke-width="1.4"></line>

        
        <path d="M370,262 A46,46 0 0 0 430,262" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#rotB)"></path>

        
        <text x="524" y="106" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700" fill="#1C1C1C">1 TURN</text>
        <text x="524" y="126" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700" fill="#1C1C1C">= 1 TOOTH</text>
        <text x="524" y="148" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" fill="#666">so 24 teeth</text>
        <text x="524" y="164" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" fill="#666">means 24 : 1</text>
      </svg>
