ll="none" stroke="#36434f" stroke-width="9" d="M164 191h84"/><path fill="none" stroke="#b7c1c9" stroke-width="2" d="M169 188h70"/><rect width="112" height="64" x="52" y="160" fill="#e9edf0" stroke="#36434f" stroke-width="1.5" rx="5"/><path fill="none" stroke="#b7c1c9" d="M60 168h95v48"/><path fill="none" stroke="#697580" stroke-width="2" d="M60 170v44"/><text x="108" y="198" fill="#36434f" font-size="17" font-weight="600" text-anchor="middle">MOTOR</text><use href="#circle-worm"/><text x="249" y="110" fill="#a83a30" font-size="18" font-weight="600">WORM — a screw</text><path fill="none" stroke="#a83a30" stroke-width="1.25" d="m328 119 17 45"/><text x="44" y="264" fill="#697580" font-size="15">worm axis — lies flat</text><path fill="none" stroke="#697580" stroke-width="1.25" d="m174 250 34-53"/><text x="390" y="421" fill="#36434f" text-anchor="middle">24 teeth</text><circle cx="390" cy="300" r="7" fill="#fff" stroke="#36434f" stroke-width="1.5"/><circle cx="390" cy="300" r="2.5" fill="#36434f" stroke="#36434f"/><rect width="166" height="134" x="530" y="102" fill="#f3f5f6" stroke="#e0e5e8" rx="5"/><text x="547" y="131" fill="#a83a30" font-size="21" font-weight="600">1 TURN</text><text x="547" y="158" fill="#a83a30" font-size="21" font-weight="600">= 1 TOOTH</text><text x="547" y="189" fill="#36434f">so 24 teeth</text><text x="547" y="213" fill="#36434f">means 24 : 1</text><path fill="none" stroke="#a83a30" stroke-width="2.5" marker-end="url(#worm-drive-arrow)" d="M469.196 379.196A112 112 0 0 0 502 300"/><text x="530" y="305" fill="#a83a30">Wheel turns</text><text x="530" y="328" fill="#a83a30">slowly</text><path fill="none" stroke="#697580" stroke-width="1.25" d="m398 309 72 99h40"/><text x="520" y="409" fill="#697580" font-size="15">wheel axis points</text><text x="520" y="431" fill="#697580" font-size="14">straight up out of the table</text><text x="24" y="461" fill="#36434f">The shafts are at 90°: one lies flat, one points up.</text></g></svg>
