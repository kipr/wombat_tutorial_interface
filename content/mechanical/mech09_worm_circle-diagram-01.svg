<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="worm-drive-title worm-drive-description">
  <title id="worm-drive-title">One turn of the worm advances the wheel by one tooth</title>
  <desc id="worm-drive-description">Top view of a motor driving a horizontal single-start worm, meshed with a 24-tooth wheel. The worm axis runs left to right. A dot in a circle marks the wheel axis pointing out of the table, perpendicular to the worm axis. Twenty-four worm turns produce one complete wheel turn: a 24 to 1 reduction.</desc>
