    <text x="390" y="421" font-size="16" fill="#36434f" text-anchor="middle">24 teeth</text>
    <circle cx="390" cy="300" r="7" fill="#fff" stroke="#36434f" stroke-width="1.5"/>
    <circle cx="390" cy="300" r="2.5" fill="#36434f" stroke="#36434f" stroke-width="1"/>
    <rect x="530" y="102" width="166" height="134" rx="5" fill="#f3f5f6" stroke="#e0e5e8"/>
    <text x="547" y="131" font-size="21" fill="#a83a30" font-weight="600">1 TURN</text>
    <text x="547" y="158" font-size="21" fill="#a83a30" font-weight="600">= 1 TOOTH</text>
    <text x="547" y="189" font-size="16" fill="#36434f">so 24 teeth</text>
    <text x="547" y="213" font-size="16" fill="#36434f">means 24 : 1</text>
    <path d="M469.196 379.196A112 112 0 0 0 502 300" fill="none" stroke="#a83a30" stroke-width="2.5" marker-end="url(#worm-drive-arrow)"/>
    <text x="530" y="305" font-size="16" fill="#a83a30">Wheel turns</text>
    <text x="530" y="328" font-size="16" fill="#a83a30">slowly</text>
    <path d="M398 309 470 408H510" fill="none" stroke="#697580" stroke-width="1.25"/>
    <text x="520" y="409" font-size="15" fill="#697580">wheel axis points</text>
    <text x="520" y="431" font-size="14" fill="#697580">straight up out of the table</text>
    <text x="24" y="461" font-size="16" fill="#36434f">The shafts are at 90°: one lies flat, one points up.</text>
