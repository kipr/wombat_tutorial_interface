  <g font-family="Barlow, Arial, sans-serif" fill="#263340" font-size="16">
    <text x="24" y="30" font-size="23" fill="#263340" font-weight="600">A screw turns a wheel, one tooth at a time.</text>
    <text x="24" y="55" font-size="15" fill="#697580">TOP VIEW · A single-start worm gives a large reduction in one step.</text>
    <path d="M32 191H516" fill="none" stroke="#b7c1c9" stroke-width="1" stroke-dasharray="7 5"/>
    <!-- 24 teeth, pitch radius 87; worm lead = 2π × 87 / 24 = 22.777.
         Thread crests enter tooth gaps rather than overlapping tooth tips. -->
