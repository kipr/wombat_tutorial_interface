<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="lift-envelope-title lift-envelope-description">
  <title id="lift-envelope-title">Start below 12 inches; deliver above 17 inches</title>
  <desc id="lift-envelope-description">Scaled side view with both heights measured from the same floor, at 18 drawing units per inch. The dashed starting envelope is 12 inches tall; the entire machine must be below its top before the run. The open container rim is 17 inches above the floor. Four poms pass over the rim. A green arrow extends above the rim to show that the lift must gain more than five inches, including clearance to release the load.</desc>
  <defs><marker id="lift-envelope-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#357458"/></marker></defs>
  <rect width="800" height="540" fill="#fff"/>
  <g font-family="Barlow, Arial, sans-serif" fill="#263340" font-size="17">
    <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="600">Start small. Reach above the opening.</text>
    <text x="400" y="64" text-anchor="middle" fill="#697580">Side view · both heights use the same floor</text>
    <!-- Scale: 18 units/in. Floor y=450; 12-inch limit y=234; 17-inch rim y=144. -->
    <rect x="106" y="234" width="184" height="216" rx="4" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" stroke-dasharray="7 5"/>
    <path d="M290 234H516" fill="none" stroke="#697580" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="198" y="280" text-anchor="middle" font-size="20" font-weight="600">STARTING</text>
    <text x="198" y="306" text-anchor="middle" font-size="20" font-weight="600">ENVELOPE</text>
    <text x="198" y="341" text-anchor="middle" font-size="16" fill="#697580">everything fits in here</text>
    <text x="198" y="364" text-anchor="middle" font-size="16" fill="#697580">before the run starts</text>
    <path d="M72 234V450M65 234H100M65 450H100" fill="none" stroke="#697580" stroke-width="1.3" />
    <text x="51" y="342" text-anchor="middle" transform="rotate(-90 51 342)" font-size="18">under 12″</text>
    <path d="M552 144V450H672V144" fill="none" stroke="#263340" stroke-width="3" />
    <path d="M554 146V448H670V146" fill="#f3f5f6"/>
    <path d="M542 144H562M662 144H682" fill="none" stroke="#263340" stroke-width="4" stroke-linecap="round"/>
    <path d="M306 144H542" fill="none" stroke="#263340" stroke-width="1.5" />
    <text x="612" y="315" text-anchor="middle" font-size="18" font-weight="600">CONTAINER</text>
    <text x="612" y="341" text-anchor="middle" font-size="16" fill="#697580">open at the top</text>
    <path d="M718 144V450M686 144H725M686 450H725" fill="none" stroke="#697580" stroke-width="1.3" />
    <text x="744" y="297" text-anchor="middle" transform="rotate(-90 744 297)" font-size="18">17″ to the top</text>
    <path d="M350 234V120" fill="none" stroke="#357458" stroke-width="2.5" marker-end="url(#lift-envelope-arrow)"/>
    <text x="374" y="174" fill="#357458" font-size="21" font-weight="600">more than 5″</text>
    <text x="374" y="200" fill="#357458">gain this</text>
    <text x="374" y="222" fill="#357458" font-size="16">after the run begins</text>
    <text x="382" y="110" fill="#357458" font-size="16">clear the rim to release</text>
    <path d="M600 101Q636 116 618 184" fill="none" stroke="#357458" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#lift-envelope-arrow)"/>
    <circle cx="598" cy="106" r="6" fill="#fae8e3" stroke="#a83a30" stroke-width="1.3"/>
    <circle cx="619" cy="124" r="6" fill="#fae8e3" stroke="#a83a30" stroke-width="1.3"/>
    <circle cx="624" cy="146" r="6" fill="#fae8e3" stroke="#a83a30" stroke-width="1.3"/>
    <circle cx="620" cy="170" r="6" fill="#fae8e3" stroke="#a83a30" stroke-width="1.3"/>
    <path d="M32 450H768" fill="none" stroke="#263340" stroke-width="2" />
    <text x="34" y="476" fill="#697580" font-size="16">floor</text>
    <text x="400" y="512" text-anchor="middle" fill="#697580">The starting limit includes the robot, lift, and load.</text>
  </g>
</svg>
