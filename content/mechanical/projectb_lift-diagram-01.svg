<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="lift-envelope-title lift-envelope-description" role="img" viewBox="0 0 800 540"><title id="lift-envelope-title">Start below 12 inches; deliver above 17 inches</title><desc id="lift-envelope-description">Scaled side view with both heights measured from the same floor, at 18 drawing units per inch. The dashed starting envelope is 12 inches tall; the entire machine must be below its top before the run. The open container rim is 17 inches above the floor. Four poms pass over the rim. A green arrow extends above the rim to show that the lift must gain more than five inches, including clearance to release the load.</desc><defs><marker id="lift-envelope-arrow" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#357458" d="m0 0 10 5-10 5Z"/></marker></defs><path fill="#fff" d="M0 0h800v540H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="17"><text x="400" y="34" font-size="24" font-weight="600" text-anchor="middle">Start small. Reach above the opening.</text><text x="400" y="64" fill="#697580" text-anchor="middle">Side view · both heights use the same floor</text><rect width="184" height="216" x="106" y="234" fill="#f3f5f6" stroke="#697580" stroke-dasharray="7 5" stroke-width="1.5" rx="4"/><path fill="none" stroke="#697580" stroke-dasharray="7 5" stroke-width="1.5" d="M290 234h226"/><text x="198" y="280" font-size="20" font-weight="600" text-anchor="middle">STARTING</text><text x="198" y="306" font-size="20" font-weight="600" text-anchor="middle">ENVELOPE</text><text x="198" y="341" fill="#697580" font-size="16" text-anchor="middle">everything fits in here</text><text x="198" y="364" fill="#697580" font-size="16" text-anchor="middle">before the run starts</text><path fill="none" stroke="#697580" stroke-width="1.3" d="M72 234v216m-7-216h35M65 450h35"/><text x="51" y="342" font-size="18" text-anchor="middle" transform="rotate(-90 51 342)">under 12″</text><path fill="none" stroke="#263340" stroke-width="3" d="M552 144v306h120V144"/><path fill="#f3f5f6" d="M554 146v302h116V146"/><path fill="none" stroke="#263340" stroke-linecap="round" stroke-width="4" d="M542 144h20m100 0h20"/><path fill="none" stroke="#263340" stroke-width="1.5" d="M306 144h236"/><text x="612" y="315" font-size="18" font-weight="600" text-anchor="middle">CONTAINER</text><text x="612" y="341" fill="#697580" font-size="16" text-anchor="middle">open at the top</text><path fill="none" stroke="#697580" stroke-width="1.3" d="M718 144v306m-32-306h39m-39 306h39"/><text x="744" y="297" font-size="18" text-anchor="middle" transform="rotate(-90 744 297)">17″ to the top</text><path fill="none" stroke="#357458" stroke-width="2.5" marker-end="url(#lift-envelope-arrow)" d="M350 234V120"/><text x="374" y="174" fill="#357458" font-size="21" font-weight="600">more than 5″</text><text x="374" y="200" fill="#357458">gain this</text><text x="374" y="222" fill="#357458" font-size="16">after the run begins</text><text x="382" y="110" fill="#357458" font-size="16">clear the rim to release</text><path fill="none" stroke="#357458" stroke-dasharray="4 5" stroke-width="1.5" marker-end="url(#lift-envelope-arrow)" d="M600 101q36 15 18 83"/><circle cx="598" cy="106" r="6" fill="#fae8e3" stroke="#a83a30" stroke-width="1.3"/><circle cx="619" cy="124" r="6" fill="#fae8e3" stroke="#a83a30" stroke-width="1.3"/><circle cx="624" cy="146" r="6" fill="#fae8e3" stroke="#a83a30" stroke-width="1.3"/><circle cx="620" cy="170" r="6" fill="#fae8e3" stroke="#a83a30" stroke-width="1.3"/><path fill="none" stroke="#263340" stroke-width="2" d="M32 450h736"/><text x="34" y="476" fill="#697580" font-size="16">floor</text><text x="400" y="512" fill="#697580" text-anchor="middle">The starting limit includes the robot, lift, and load.</text></g></svg>
