<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 550" role="img" aria-labelledby="four-bar-grabber-title four-bar-grabber-description">
  <title id="four-bar-grabber-title">A four-bar linkage reaches out and draws the pom back</title>
  <desc id="four-bar-grabber-description">Top view. Two pivots on the right edge of a stationary base support equal-length links and a grabber on the coupler. The solid linkage reaches a pom three inches from the base. The grey dashed linkage shows the same links rotated back, carrying the grabber and pom toward the base. The grabber can be two inches wide or use a cup.</desc>
  <defs>
    <marker id="four-bar-pull" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#357458"/>
    </marker>
    <g id="four-bar-pom">
      <path d="M0 -14Q5 -18 8 -12Q14 -13 14 -7Q19 -3 14 1Q18 7 11 9Q11 16 5 14Q0 19 -4 14Q-11 17 -12 10Q-18 8 -14 2Q-19 -3 -13 -7Q-13 -14 -7 -12Q-4 -18 0 -14Z"/>
      <path d="M-7 -3Q-1 -9 5 -4M-4 6Q2 1 8 5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="720" height="550" fill="#fff"/>
  <g font-family="Barlow, Arial, sans-serif" fill="#263340" font-size="16">
    <text x="24" y="30" font-size="23" fill="#263340" font-weight="600">Reach out. Catch the pom. Draw it back.</text>
    <text x="24" y="55" font-size="14" fill="#697580">TOP VIEW · Grey dashed = retracted · Solid = extended</text>
    <rect x="50" y="280" width="140" height="200" rx="6" fill="#f3f5f6" stroke="#697580" stroke-width="1.5"/>
    <rect x="59" y="289" width="122" height="182" rx="3" fill="none" stroke="#e0e5e8"/>
    <circle cx="66" cy="296" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <circle cx="174" cy="296" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <circle cx="66" cy="464" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <circle cx="174" cy="464" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <text x="120" y="365" font-size="16" fill="#36434f" text-anchor="middle" font-weight="600">STATIONARY</text>
    <text x="120" y="388" font-size="16" fill="#36434f" text-anchor="middle" font-weight="600">BASE</text>
    <!-- Each side link has length sqrt(210² + 90²) in both poses.
         Retracted (90,-210) and extended (210,-90) are rotations, not stretching. -->
    <path d="M190 300V460" fill="none" stroke="#36434f" stroke-width="2" stroke-dasharray="8 6"/>
    <g fill="none" stroke="#697580" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round">
      <path d="M190 300 280 90V250L190 460"/>
      <path d="M454 268H416Q405 268 405 279V301Q405 312 416 312H454" transform="translate(-120 -120)"/>
    </g>
    <use href="#four-bar-pom" x="310" y="170" fill="none" stroke="#697580" stroke-width="1.25" stroke-dasharray="3 3"/>
    <path d="M190 300 400 210" fill="none" stroke="#697580" stroke-width="18" stroke-linecap="round"/>
    <path d="M190 300 400 210" fill="none" stroke="#e9edf0" stroke-width="14" stroke-linecap="round"/>
    <circle cx="232" cy="282" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="274" cy="264" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="316" cy="246" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="358" cy="228" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <path d="M190 460 400 370" fill="none" stroke="#697580" stroke-width="18" stroke-linecap="round"/>
    <path d="M190 460 400 370" fill="none" stroke="#e9edf0" stroke-width="14" stroke-linecap="round"/>
    <circle cx="232" cy="442" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="274" cy="424" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="316" cy="406" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="358" cy="388" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <path d="M400 210 400 370" fill="none" stroke="#a83a30" stroke-width="18" stroke-linecap="round"/>
    <path d="M400 210 400 370" fill="none" stroke="#fae8e3" stroke-width="14" stroke-linecap="round"/>
    <circle cx="400" cy="242" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/>
    <circle cx="400" cy="274" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/>
    <circle cx="400" cy="306" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/>
    <circle cx="400" cy="338" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/>
    <path d="M454 268H416Q405 268 405 279V301Q405 312 416 312H454" fill="none" stroke="#a83a30" stroke-width="7" stroke-linejoin="round"/>
    <path d="M417 273H450M417 307H450" fill="none" stroke="#b4822b" stroke-width="6"/>
    <circle cx="190" cy="300" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/>
    <circle cx="190" cy="300" r="4" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="190" cy="460" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/>
    <circle cx="190" cy="460" r="4" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="400" cy="210" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/>
    <circle cx="400" cy="210" r="3.5" fill="#36434f" stroke="#36434f" stroke-width="1"/>
    <circle cx="400" cy="370" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/>
    <circle cx="400" cy="370" r="3.5" fill="#36434f" stroke="#36434f" stroke-width="1"/>
    <use href="#four-bar-pom" x="430" y="290" fill="#fff" stroke="#697580" stroke-width="1.5"/>
    <text x="489" y="258" font-size="18" fill="#a83a30" font-weight="600">GRABBER</text>
    <text x="489" y="280" font-size="15" fill="#a83a30">2″ wide, or a cup</text>
    <path d="M479 267 456 275" fill="none" stroke="#a83a30" stroke-width="1.25"/>
    <text x="478" y="336" font-size="16" fill="#697580">pom</text>
    <path d="M468 329 441 302" fill="none" stroke="#697580" stroke-width="1.25"/>
    <path d="M524 212Q464 111 342 108" fill="none" stroke="#357458" stroke-width="2.5" marker-end="url(#four-bar-pull)"/>
    <text x="495" y="136" font-size="17" fill="#357458" font-weight="600">pull back</text>
    <text x="165" y="135" font-size="14" fill="#697580">retracted</text>
    <text x="336" y="442" font-size="14" fill="#697580">extended</text>
    <path d="M190 483V514M430 328V514" fill="none" stroke="#b7c1c9" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M190 503H430M190 497V509M430 497V509" fill="none" stroke="#36434f" stroke-width="1.5"/>
    <text x="310" y="495" font-size="18" fill="#36434f" text-anchor="middle" font-weight="600">3″</text>
    <text x="310" y="538" font-size="14" fill="#697580" text-anchor="middle">Measure from the base to the pom.</text>
  </g>
</svg>
