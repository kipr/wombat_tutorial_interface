<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="four-bar-grabber-title four-bar-grabber-description" role="img" viewBox="0 0 720 550"><title id="four-bar-grabber-title">A four-bar linkage reaches out and draws the pom back</title><desc id="four-bar-grabber-description">Top view. Two pivots on the right edge of a stationary base support equal-length links and a grabber on the coupler. The solid linkage reaches a pom three inches from the base. The grey dashed linkage shows the same links rotated back, carrying the grabber and pom toward the base. The grabber can be two inches wide or use a cup.</desc><defs><marker id="four-bar-pull" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#357458" d="m0 0 10 5-10 5Z"/></marker><g id="four-bar-pom"><path d="M0-14q5-4 8 2 6-1 6 5 5 4 0 8 4 6-3 8 0 7-6 5-5 5-9 0-7 3-8-4-6-2-2-8-5-5 1-9 0-7 6-5 3-6 7-2Z"/><path fill="none" stroke-linecap="round" d="M-7-3q6-6 12-1M-4 6Q2 1 8 5"/></g></defs><path fill="#fff" d="M0 0h720v550H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="24" y="30" font-size="23" font-weight="600">Reach out. Catch the pom. Draw it back.</text><text x="24" y="55" fill="#697580" font-size="14">TOP VIEW · Grey dashed = retracted · Solid = extended</text><rect width="140" height="200" x="50" y="280" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="6"/><rect width="122" height="182" x="59" y="289" fill="none" stroke="#e0e5e8" rx="3"/><circle cx="66" cy="296" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="174" cy="296" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="66" cy="464" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="174" cy="464" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><text x="120" y="365" fill="#36434f" font-weight="600" text-anchor="middle">STATIONARY</text><text x="120" y="388" fill="#36434f" font-weight="600" text-anchor="middle">BASE</text><path fill="none" stroke="#36434f" stroke-dasharray="8 6" stroke-width="2" d="M190 300v160"/><g fill="none" stroke="#697580" stroke-dasharray="6 5" stroke-linecap="round" stroke-width="2"><path d="m190 300 90-210v160l-90 210"/><path d="M454 268h-38q-11 0-11 11v22q0 11 11 11h38" transform="translate(-120 -120)"/></g><use x="310" y="170" fill="none" stroke="#697580" stroke-dasharray="3 3" stroke-width="1.25" href="#four-bar-pom"/><path fill="none" stroke="#697580" stroke-linecap="round" stroke-width="18" d="m190 300 210-90"/><path fill="none" stroke="#e9edf0" stroke-linecap="round" stroke-width="14" d="m190 300 210-90"/><circle cx="232" cy="282" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="274" cy="264" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="316" cy="246" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="358" cy="228" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><path fill="none" stroke="#697580" stroke-linecap="round" stroke-width="18" d="m190 460 210-90"/><path fill="none" stroke="#e9edf0" stroke-linecap="round" stroke-width="14" d="m190 460 210-90"/><circle cx="232" cy="442" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="274" cy="424" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="316" cy="406" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="358" cy="388" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><path fill="none" stroke="#a83a30" stroke-linecap="round" stroke-width="18" d="M400 210v160"/><path fill="none" stroke="#fae8e3" stroke-linecap="round" stroke-width="14" d="M400 210v160"/><circle cx="400" cy="242" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/><circle cx="400" cy="274" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/><circle cx="400" cy="306" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/><circle cx="400" cy="338" r="3.25" fill="#fff" stroke="#a83a30" stroke-width="1.25"/><path fill="none" stroke="#a83a30" stroke-linejoin="round" stroke-width="7" d="M454 268h-38q-11 0-11 11v22q0 11 11 11h38"/><path fill="none" stroke="#b4822b" stroke-width="6" d="M417 273h33m-33 34h33"/><circle cx="190" cy="300" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/><circle cx="190" cy="300" r="4" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="190" cy="460" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/><circle cx="190" cy="460" r="4" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="400" cy="210" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/><circle cx="400" cy="210" r="3.5" fill="#36434f" stroke="#36434f"/><circle cx="400" cy="370" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/><circle cx="400" cy="370" r="3.5" fill="#36434f" stroke="#36434f"/><use x="430" y="290" fill="#fff" stroke="#697580" stroke-width="1.5" href="#four-bar-pom"/><text x="489" y="258" fill="#a83a30" font-size="18" font-weight="600">GRABBER</text><text x="489" y="280" fill="#a83a30" font-size="15">2″ wide, or a cup</text><path fill="none" stroke="#a83a30" stroke-width="1.25" d="m479 267-23 8"/><text x="478" y="336" fill="#697580">pom</text><path fill="none" stroke="#697580" stroke-width="1.25" d="m468 329-27-27"/><path fill="none" stroke="#357458" stroke-width="2.5" marker-end="url(#four-bar-pull)" d="M524 212q-60-101-182-104"/><text x="495" y="136" fill="#357458" font-size="17" font-weight="600">pull back</text><text x="165" y="135" fill="#697580" font-size="14">retracted</text><text x="336" y="442" fill="#697580" font-size="14">extended</text><path fill="none" stroke="#b7c1c9" stroke-dasharray="4 4" d="M190 483v31m240-186v186"/><path fill="none" stroke="#36434f" stroke-width="1.5" d="M190 503h240m-240-6v12m240-12v12"/><text x="310" y="495" fill="#36434f" font-size="18" font-weight="600" text-anchor="middle">3″</text><text x="310" y="538" fill="#697580" font-size="14" text-anchor="middle">Mea