<svg viewBox="0 0 620 300" role="img" aria-label="Two platforms compared. Without guides, a platform pushed at a single point by a pinion twists out of square. With guide rails running along both edges, the platform can only travel along the rails." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="dblB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1E8449"></path>
          </marker>
          <marker id="rotL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"></path>
          </marker>
        </defs>

        
        <rect x="8" y="8" width="296" height="284" rx="8" fill="#fff" stroke="#CCC"></rect>
        <text x="24" y="34" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#C0392B">NO GUIDE — it twists</text>

        <g transform="rotate(-9 155 150)">
          <rect x="62" y="122" width="190" height="56" rx="4" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>
        </g>
        <line x1="46" y1="212" x2="266" y2="212" stroke="#444" stroke-width="11" stroke-dasharray="9 11"></line>
        <circle cx="104" cy="238" r="24" fill="#fff" stroke="#1C1C1C" stroke-width="5" stroke-dasharray="10 10"></circle>
        <circle cx="104" cy="238" r="4" fill="#444"></circle>
        <circle cx="104" cy="196" r="7" fill="#C0392B"></circle>
        <text x="128" y="200" font-family="'Barlow',sans-serif" font-size="12" font-weight="600" fill="#C0392B">pushed here only</text>

        <path d="M212,96 A56,56 0 0 1 244,140" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#rotL)"></path>
        <text x="24" y="272" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#C0392B">Free to spin about the drive point.</text>

        
        <rect x="316" y="8" width="296" height="284" rx="8" fill="#fff" stroke="#CCC"></rect>
        <text x="332" y="34" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1E8449">GUIDED — one way only</text>

        <rect x="340" y="104" width="250" height="12" rx="2" fill="#1C1C1C"></rect>
        <rect x="340" y="200" width="250" height="12" rx="2" fill="#1C1C1C"></rect>
        <rect x="372" y="122" width="190" height="72" rx="4" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>

        <line x1="346" y1="236" x2="586" y2="236" stroke="#444" stroke-width="11" stroke-dasharray="9 11"></line>
        <circle cx="412" cy="262" r="24" fill="#fff" stroke="#1C1C1C" stroke-width="5" stroke-dasharray="10 10"></circle>
        <circle cx="412" cy="262" r="4" fill="#444"></circle>

        <line x1="400" y1="158" x2="534" y2="158" stroke="#1E8449" stroke-width="3" marker-start="url(#dblB)" marker-end="url(#dblB)"></line>
        <text x="332" y="94" font-family="'Barlow',sans-serif" font-size="12" font-weight="600" fill="#1C1C1C">guide rail</text>
        <text x="332" y="272" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#1E8449">Two freedoms removed. One left.</text>
      </svg>
