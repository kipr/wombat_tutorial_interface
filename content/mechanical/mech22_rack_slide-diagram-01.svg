  <title id="slide-guides-title">The drive pushes. The guides keep it square.</title>
  <desc id="slide-guides-description">Top views of two rack-driven platforms with 24-tooth pinions and matching tooth pitch. Both racks are attached to their platforms. Without guides the dashed platform outline shows unwanted rotation about the drive region. With two long guide rails the platform can only slide along them. Pinion teeth enter rack gaps.</desc>
