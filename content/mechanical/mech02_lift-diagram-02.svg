<svg xmlns="http://www.w3.org/2000/svg" aria-label="Four strategies for gaining height. A pivoting arm swings up through an arc. A telescoping section slides up out of another. A scissor linkage unfolds upward. A tipping bin rotates to pour its contents out at height." role="img" viewBox="0 0 620 440"><defs><marker id="up2" markerHeight="8" markerWidth="8" orient="auto" refX="5" refY="1" viewBox="0 0 10 10"><path fill="#c0392b" d="m0 9 5-9 5 9z"/></marker></defs><rect width="296" height="200" x="8" y="8" fill="#fff" stroke="#ccc" rx="8"/><text x="20" y="30" fill="#1c1c1c" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700">1 · Pivoting arm</text><line x1="30" x2="285" y1="180" y2="180" stroke="#1c1c1c" stroke-width="2"/><rect width="46" height="22" x="52" y="158" fill="#f2f2f2" stroke="#444" stroke-width="1.5"/><circle cx="75" cy="158" r="4" fill="#444"/><line x1="75" x2="205" y1="158" y2="146" stroke="#888" stroke-linecap="round" stroke-width="4"/><line x1="75" x2="118" y1="158" y2="52" stroke="#c0392b" stroke-linecap="round" stroke-width="4"/><path fill="none" stroke="#c0392b" stroke-dasharray="6 5" stroke-width="1.6" d="M205 146a140 140 0 0 0-87-94"/><circle cx="118" cy="52" r="7" fill="#c0392b"/><text x="140" y="52" fill="#c0392b" font-family="'Barlow',sans-serif" font-size="13">load ends up here</text><text x="20" y="200" fill="#666" font-family="'Barlow',sans-serif" font-size="12.5">Cost: the load swings sideways as well as up.</text><rect width="296" height="200" x="316" y="8" fill="#fff" stroke="#ccc" rx="8"/><text x="328" y="30" fill="#1c1c1c" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700">2 · Telescoping slide</text><line x1="338" x2="593" y1="180" y2="180" stroke="#1c1c1c" stroke-width="2"/><rect width="46" height="70" x="430" y="110" fill="#f2f2f2" stroke="#444" stroke-width="1.5"/><rect width="26" height="70" x="440" y="46" fill="#fbeef0" stroke="#c0392b" stroke-width="2"/><line x1="500" x2="500" y1="120" y2="52" stroke="#c0392b" stroke-width="2.5" marker-end="url(#up2)"/><text x="512" y="86" fill="#c0392b" font-family="'Barlow',sans-serif" font-size="13">slides straight up</text><text x="328" y="200" fill="#666" font-family="'Barlow',sans-serif" font-size="12.5">Cost: hard to build without binding or wobble.</text><rect width="296" height="200" x="8" y="220" fill="#fff" stroke="#ccc" rx="8"/><text x="20" y="242" fill="#1c1c1c" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700">3 · Scissor linkage</text><line x1="30" x2="285" y1="392" y2="392" stroke="#1c1c1c" stroke-width="2"/><g fill="none" stroke="#c0392b" stroke-linecap="round" stroke-width="3.5"><path d="m120 392 50-62m0 62-50-62"/><path d="m120 330 50-62m0 62-50-62"/></g><circle cx="145" cy="330" r="4.5" fill="#444"/><rect width="74" height="12" x="108" y="256" fill="#f2f2f2" stroke="#444" stroke-width="1.5" rx="2"/><text x="196" y="300" fill="#c0392b" font-family="'Barlow',sans-serif" font-size="13">platform stays level</text><text x="20" y="412" fill="#666" font-family="'Barlow',sans-serif" font-size="12.5">Cost: many joints, and every joint adds slop.</text><rect width="296" height="200" x="316" y="220" fill="#fff" stroke="#ccc" rx="8"/><text x="328" y="242" fill="#1c1c1c" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700">4 · Tipping bin</text><line x1="338" x2="593" y1="392" y2="392" stroke="#1c1c1c" stroke-width="2"/><path fill="#fbeef0" stroke="#c0392b" stroke-width="2.5" d="M418 300h68v52h-68Z" transform="rotate(-38 452 330)"/><circle cx="452" cy="352" r="4.5" fill="#444"/><circle cx="500" cy="286" r="6" fill="#888"/><circle cx="516" cy="306" r="6" fill="#888"/><circle cx="527" cy="330" r="6" fill="#888"/><text x="404" y="272" fill="#c0392b" font-family="'Barlow',sans-serif" font-size="13">contents pour out</text><text x="328" y="412" fill="#666" font-family="'Barlow',sans-serif" font-size="12.5">Cost: you control when it dumps, not where each pom lands.</text></svg>
