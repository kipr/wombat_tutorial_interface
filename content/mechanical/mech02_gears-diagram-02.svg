<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" role="img" aria-labelledby="count-title count-description">
  <title id="count-title">Count teeth to predict gear rotation</title>
  <desc id="count-description">A 10-tooth gear meshed with an 8-tooth gear. For the 10-tooth gear to make one full rotation, ten teeth must pass through the mesh. Those same ten clicks pass through the 8-tooth gear, which only needs eight clicks per rotation. Each tooth is numbered.</desc>
