<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="cardan-joints-title cardan-joints-description" role="img" viewBox="0 0 720 535"><title id="cardan-joints-title">One Cardan joint varies speed; a phased pair cancels it</title><desc id="cardan-joints-description">Left: a universal joint has two forked yokes and a cross with perpendicular pin axes, connecting shafts at forty-five degrees. A steady input produces two speed cycles per turn. Right: equal and opposite forty-five-degree bends connect parallel end shafts. The two yokes on the intermediate shaft have aligned trunnion axes, so the second joint cancels the first joint’s speed variation. These are projected mechanism schematics.</desc><rect width="720" height="535" fill="#fff"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="360" y="31" font-size="23" font-weight="600" text-anchor="middle">A second joint can cancel the speed variation</text><path fill="none" stroke="#b7c1c9" d="M360 76v375"/><text x="24" y="90" fill="#36434f" font-size="20" font-weight="600">ONE JOINT</text><text x="384" y="90" fill="#36434f" font-size="20" font-weight="600">TWO JOINTS</text><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-width="10" d="M45 268h105"/><path fill="none" stroke="#c9d2d8" stroke-width="2" d="M45 266h105"/><path fill="none" stroke="#3d617e" stroke-linecap="round" stroke-width="10" d="m212 238 88-88"/><path fill="none" stroke="#9eafbf" stroke-width="2" d="m212 236 88-88"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-width="12.5" d="M129.5 268h18.75"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-linejoin="round" stroke-width="6.25" d="m145.75 268 2.688 10.563h26.25"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-linejoin="round" stroke-width="6.25" d="m145.75 268 17.313-10.562h26.25"/><path fill="none" stroke="#3d617e" stroke-linecap="round" stroke-width="12.5" d="m219.123 230.877-13.258 13.258"/><path fill="none" stroke="#3d617e" stroke-linecap="round" stroke-linejoin="round" stroke-width="6.25" d="m207.633 242.367-18.562-4.419-18.561 18.562"/><path fill="none" stroke="#3d617e" stroke-linecap="round" stroke-linejoin="round" stroke-width="6.25" d="m207.633 242.367 4.419 18.562-18.562 18.561"/><path fill="none" stroke="#a83a30" stroke-linecap="round" stroke-width="5" d="m174.688 278.563 14.625-21.125"/><path fill="none" stroke="#a83a30" stroke-linecap="round" stroke-width="5" d="m170.51 256.51 22.98 22.98"/><circle cx="182" cy="268" r="3.75" fill="#fff" stroke="#a83a30"/><circle cx="174.688" cy="278.563" r="3.75" fill="#fff" stroke="#a83a30"/><circle cx="189.313" cy="257.438" r="3.75" fill="#fff" stroke="#a83a30"/><circle cx="170.51" cy="256.51" r="3.75" fill="#fff" stroke="#a83a30"/><circle cx="193.49" cy="279.49" r="3.75" fill="#fff" stroke="#a83a30"/><text x="79" y="243" fill="#697580" text-anchor="middle">input</text><text x="277" y="211" fill="#3d617e" text-anchor="middle">output</text><path fill="none" stroke="#b7c1c9" stroke-dasharray="6 5" d="M182 268h101"/><path fill="none" stroke="#697580" stroke-width="1.2" d="M247 268a65 65 0 0 0-19.038-45.962"/><text x="274" y="251" fill="#697580" text-anchor="middle">45°</text><text x="183" y="144" fill="#a83a30" font-weight="600" text-anchor="middle">Steady input, uneven output</text><text x="24" y="359" fill="#a83a30">The output speeds up and slows</text><text x="24" y="382" fill="#a83a30">down twice in every turn.</text><text x="24" y="418" fill="#697580" font-size="15">The bigger the angle, the worse it gets.</text><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-width="10" d="M388 287h36"/><path fill="none" stroke="#c9d2d8" stroke-width="2" d="M388 285h36"/><path fill="none" stroke="#357458" stroke-linecap="round" stroke-width="10" d="m483.214 258.786 83.572-83.572"/><path fill="none" stroke="#c9d2d8" stroke-width="2" d="m483.214 256.786 83.572-83.572"/><path fill="none" stroke="#3d617e" stroke-linecap="round" stroke-width="10" d="M620 147h68"/><path fill="none" stroke="#9eafbf" stroke-width="2" d="M620 145h68"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-width="9.5" d="M415.1 287h14.25"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.75" d="m427.45 287 2.043 8.027h19.949"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.75" d="m427.45 287 13.158-8.027h19.95"/><path fill="none" stroke="#3d617e" stroke-linecap="round" stroke-width="9.5" d="m483.214 258.786-10.077 10.077"/><path fill="none" stroke="#3d617e" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.75" d="m474.481 267.519-14.107-3.359-14.107 14.107"/><path fill="none" stroke="#3d617e" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.75" d="m474.481 267.519 3.359 14.107-14.107 14.107"/><path fill="none" stroke="#a83a30" stroke-linecap="round" stroke-width="3.8" d="m449.442 295.027 11.116-16.054"/><path fill="none" stroke="#a83a30" stroke-linecap="round" stroke-width="3.8" d="m446.267 278.267 17.466 17.466"/><circle cx="455" cy="287" r="2.85" fill="#fff" stroke="#a83a30"/><circle cx="449.442" cy="295.027" r="2.85" fill="#fff" stroke="#a83a30"/><circle cx="460.558" cy="278.973" r="2.85" fill="#fff" stroke="#a83a30"/><circle cx="446.267" cy="278.267" r="2.85" fill="#fff" stroke="#a83a30"/><circle cx="463.733" cy="295.733" r="2.85" fill="#fff" stroke="#a83a30"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-width="9.5" d="m566.786 175.214 10.077-10.077"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.75" d="m575.519 166.481-3.359-14.107 14.107-14.107"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.75" d="m575.519 166.481 14.107 3.359 14.107-14.107"/><path fill="none" stroke="#3d617e" stroke-linecap="round" stroke-width="9.5" d="M634.9 147h-14.25"/><path fill="none" stroke="#3d617e" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.75" d="m622.55 147-13.157 8.028h-19.951"/><path fill="none" stroke="#3d617e" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.75" d="m622.55 147-2.042-8.028h-19.95"/><path fill="none" stroke="#a83a30" stroke-linecap="round" stroke-width="3.8" d="m589.442 155.028 11.116-16.056"/><path fill="none" stroke="#a83a30" stroke-linecap="round" stroke-width="3.8" d="m586.267 138.267 17.466 17.466"/><circle cx="595" cy="147" r="2.85" fill="#fff" stroke="#a83a30"/><circle cx="589.442" cy="155.028" r="2.85" fill="#fff" stroke="#a83a30"/><circle cx="600.558" cy="138.972" r="2.85" fill="#fff" stroke="#a83a30"/><circle cx="586.267" cy="138.267" r="2.85" fill="#fff" stroke="#a83a30"/><circle cx="603.733" cy="155.733" r="2.85" fill="#fff" stroke="#a83a30"/><text x="554" y="248" fill="#357458" text-anchor="middle">middle shaft</text><text x="398" y="213" fill="#697580" font-size="15">45°</text><path fill="none" stroke="#b7c1c9" d="m426 220 19 40"/><text x="643" y="212" fill="#697580" font-size="15">45°</text><path fill="none" stroke="#b7c1c9" d="m625 205-15-35"/><text x="384" y="359" fill="#357458" font-weight="600">Equal and opposite bends.</text><text x="384" y="382" fill="#357458">The second joint undoes what</text><text x="384" y="405" fill="#357458">the first one did.</text><text x="384" y="438" fill="#36434f" font-size="15" font-weight="600">Middle-shaft yokes must be aligned.</text><text x="360" y="483" fill="#697580" font-size="15" text-anchor="middle">Two-joint example: parallel end shafts, equal 45° bends, correctly phased yokes.</text><text x="360" y="508" fill="#697580" font-size="15" text-anchor="middle">Cross pins are red. Each fork pivots on one of two perpendicular pin axes.</text></g></svg>
