    <text x="554" y="248" font-size="16" fill="#357458" text-anchor="middle">middle shaft</text>
    <text x="398" y="213" font-size="15" fill="#697580" >45°</text>
    <path d="M426 220 445 260" fill="none" stroke="#b7c1c9" stroke-width="1" />
    <text x="643" y="212" font-size="15" fill="#697580" >45°</text>
    <path d="M625 205 610 170" fill="none" stroke="#b7c1c9" stroke-width="1" />
    <text x="384" y="359" font-size="16" fill="#357458" font-weight="600">Equal and opposite bends.</text>
    <text x="384" y="382" font-size="16" fill="#357458" >The second joint undoes what</text>
    <text x="384" y="405" font-size="16" fill="#357458" >the first one did.</text>
    <text x="384" y="438" font-size="15" fill="#36434f" font-weight="600">Middle-shaft yokes must be aligned.</text>
    <text x="360" y="483" font-size="15" fill="#697580" text-anchor="middle">Two-joint example: parallel end shafts, equal 45° bends, correctly phased yokes.</text>
    <text x="360" y="508" font-size="15" fill="#697580" text-anchor="middle">Cross pins are red. Each fork pivots on one of two perpendicular pin axes.</text>
