    <path d="M207.633 242.367L212.052 260.929L193.49 279.49" fill="none" stroke="#3d617e" stroke-width="6.25" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M174.688 278.563L189.313 257.438" fill="none" stroke="#a83a30" stroke-width="5" stroke-linecap="round"/>
