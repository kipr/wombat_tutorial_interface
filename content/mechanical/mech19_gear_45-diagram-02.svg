<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 535" role="img" aria-labelledby="cardan-joints-title cardan-joints-description">
  <title id="cardan-joints-title">One Cardan joint varies speed; a phased pair cancels it</title>
  <desc id="cardan-joints-description">Left: a universal joint has two forked yokes and a cross with perpendicular pin axes, connecting shafts at forty-five degrees. A steady input produces two speed cycles per turn. Right: equal and opposite forty-five-degree bends connect parallel end shafts. The two yokes on the intermediate shaft have aligned trunnion axes, so the second joint cancels the first joint’s speed variation. These are projected mechanism schematics.</desc>
  <rect width="720" height="535" fill="#fff"/>
  <g font-family="Barlow, Arial, sans-serif" fill="#263340" font-size="16">
    <text x="360" y="31" font-size="23" fill="#263340" text-anchor="middle" font-weight="600">A second joint can cancel the speed variation</text>
    <path d="M360 76V451" fill="none" stroke="#b7c1c9" stroke-width="1" />
    <text x="24" y="90" font-size="20" fill="#36434f" font-weight="600">ONE JOINT</text>
    <text x="384" y="90" font-size="20" fill="#36434f" font-weight="600">TWO JOINTS</text>
