    <circle cx="193.49" cy="279.49" r="3.75" fill="#fff" stroke="#a83a30" stroke-width="1"/>
    <text x="79" y="243" font-size="16" fill="#697580" text-anchor="middle">input</text>
    <text x="277" y="211" font-size="16" fill="#3d617e" text-anchor="middle">output</text>
    <path d="M182 268H283" fill="none" stroke="#b7c1c9" stroke-width="1" stroke-dasharray="6 5"/>
    <path d="M247 268A65 65 0 0 0 227.962 222.038" fill="none" stroke="#697580" stroke-width="1.2" />
    <text x="274" y="251" font-size="16" fill="#697580" text-anchor="middle">45°</text>
    <text x="183" y="144" font-size="16" fill="#a83a30" text-anchor="middle" font-weight="600">Steady input, uneven output</text>
    <text x="24" y="359" font-size="16" fill="#a83a30" >The output speeds up and slows</text>
    <text x="24" y="382" font-size="16" fill="#a83a30" >down twice in every turn.</text>
    <text x="24" y="418" font-size="15" fill="#697580" >The bigger the angle, the worse it gets.</text>
