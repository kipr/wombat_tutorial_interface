<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 507" role="img" aria-labelledby="supported-platform-title supported-platform-description">
  <title id="supported-platform-title">Support the slide over its full travel</title>
  <desc id="supported-platform-description">Cutaway top view of a seven by two inch platform, drawn at 48 units per inch. The rack is attached underneath it and meshes with a fixed 24-tooth pinion driven by a motor below the deck. Long stationary rails guide both sides throughout two inches of travel. The grey dashed outline is shifted exactly two inches to the right.</desc>
