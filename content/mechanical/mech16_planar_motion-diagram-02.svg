<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 535" role="img" aria-labelledby="serial-parallel-title serial-parallel-description">
  <title id="serial-parallel-title">A serial chain and a three-leg planar parallel mechanism</title>
  <desc id="serial-parallel-description">Left: three driven joints form one chain from a fixed base to an effector. Right: three separate base drives each connect through a free elbow to a different corner of one platform. The passive pivots let the three drives position and orient the platform together. These are layout schematics, not assembly instructions.</desc>
