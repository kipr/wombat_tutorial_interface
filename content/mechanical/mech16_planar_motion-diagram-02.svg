<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="serial-parallel-title serial-parallel-description" role="img" viewBox="0 0 720 535"><title id="serial-parallel-title">A serial chain and a three-leg planar parallel mechanism</title><desc id="serial-parallel-description">Left: three driven joints form one chain from a fixed base to an effector. Right: three separate base drives each connect through a free elbow to a different corner of one platform. The passive pivots let the three drives position and orient the platform together. These are layout schematics, not assembly instructions.</desc><path fill="#fff" d="M0 0h720v535H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="360" y="31" font-size="23" font-weight="600" text-anchor="middle">The same three inputs, arranged differently</text><path fill="none" stroke="#b7c1c9" d="M360 73v384"/><text x="24" y="83" font-size="20" font-weight="600">SERIAL — one chain</text><text x="385" y="83" font-size="20" font-weight="600">PARALLEL — three legs</text><rect width="78" height="53" x="48" y="359" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="6"/><rect width="60" height="35" x="57" y="368" fill="none" stroke="#e0e5e8" rx="3"/><circle cx="64" cy="375" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="110" cy="375" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="64" cy="396" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="110" cy="396" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><path fill="none" stroke="#697580" stroke-linecap="round" stroke-width="18" d="m87 359 58-92"/><path fill="none" stroke="#e9edf0" stroke-linecap="round" stroke-width="14" d="m87 359 58-92"/><circle cx="98.6" cy="340.6" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="110.2" cy="322.2" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="121.8" cy="303.8" r="3.25" fill="#fff" stroke="#697580" s