<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="coulisse-concept-title coulisse-concept-description" role="img" viewBox="0 0 720 430"><title id="coulisse-concept-title">The pin spends longer on one stroke than the other</title><desc id="coulisse-concept-description">A pin at radius 74 turns clockwise around a fixed axle 190 units above the slotted arm’s pivot. The two tangent positions divide its circle into approximately 226 and 134 degrees. The same steady wheel speed therefore produces unequal stroke times. The current pin sits inside the slot.</desc><defs><marker id="coulisse-turn" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#697580" d="m0 0 10 5-10 5Z"/></marker></defs><path fill="#fff" d="M0 0h720v430H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="24" y="30" font-size="23" font-weight="600">A steady turn makes an uneven swing.</text><text x="24" y="55" fill="#697580" font-size="15">The arm reverses where its slot is tangent to the pin’s circle.</text><circle cx="265" cy="172" r="74" fill="#f8f9fa" stroke="#b7c1c9"/><path fill="none" stroke="#36434f" stroke-width="6" d="M196.843 200.821a74 74 0 1 1 136.314 0"/><path fill="none" stroke="#a83a30" stroke-width="6" d="M333.157 200.821a74 74 0 0 1-136.314 0"/><path fill="none" stroke="#b7c1c9" stroke-dasharray="7 6" stroke-linecap="round" stroke-width="10" d="M265 362 145.752 80M265 362 384.248 80"/><path fill="none" stroke="#36434f" stroke-linecap="round" stroke-width="18" d="M265 362V80"/><path fill="none" stroke="#e9edf0" stroke-linecap="round" stroke-width="14" d="M265 362V80"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-width="7" d="M265 335V91"/><path fill="none" stroke="#a83a30" stroke-linecap="round" stroke-width="18" d="M265 172V98"/><path fill="none" stroke="#fae8e3" stroke-linecap="round" stroke-width="14" d="M265 172V98"/><circle cx="265" cy="172" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/><circle cx="265" cy="172" r="3.5" fill="#36434f" stroke="#36434f"/><circle cx="265" cy="98" r="9" fill="#a83a30" stroke="#fff" stroke-width="2"/><circle cx="265" cy="362" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/><circle cx="265" cy="362" r="4" fill="#fff" stroke="#697580" stroke-width="1.25"/><path fill="none" stroke="#697580" stroke-width="2" d="M239 379h52"/><text x="105" y="286" fill="#36434f" font-size="17" font-weight="600">SLOTTED ARM</text><text x="48" y="308" fill="#697580" font-size="14">the white gap is the slot</text><path fill="none" stroke="#697580" stroke-width="1.25" d="m215 285 40-20"/><text x="292" y="101" fill="#a83a30" font-size="17" font-weight="600">PIN</text><text x="265" y="405" fill="#697580" font-size="15" text-anchor="middle">pivot</text><path fill="none" stroke="#697580" stroke-width="2.5" marker-end="url(#coulisse-turn)" d="M351 122a98 98 0 0 1 10 60"/><text x="440" y="128" fill="#36434f" font-size="18" font-weight="600">SLOW STROKE</text><text x="440" y="151" fill="#697580">about 226° of the turn</text><path fill="none" stroke="#36434f" stroke-width="6" d="M416 140h18"/><text x="440" y="216" fill="#a83a30" font-size="18" font-weight="600">FAST STROKE</text><text x="440" y="239" fill="#697580">about 134° of the turn</text><path fill="none" stroke="#a83a30" stroke-width="6" d="M416 228h18"/><text x="440" y="299" fill="#36434f" font-size="18" font-weight="600">Same wheel speed.</text><text x="440" y="326" fill="#36434f" font-size="18" font-weight="600">Unequal time.</text><text x="440" y="367" fill="#697580" font-size="15">Example: 226 ÷ 134 ≈ 1.69</text><text x="440" y="389" fill="#697580" font-size="15">The long arc takes more time.</text></g></svg>
