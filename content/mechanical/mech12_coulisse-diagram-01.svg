<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="coulisse-concept-title coulisse-concept-description">
  <title id="coulisse-concept-title">The pin spends longer on one stroke than the other</title>
  <desc id="coulisse-concept-description">A pin at radius 74 turns clockwise around a fixed axle 190 units above the slotted arm’s pivot. The two tangent positions divide its circle into approximately 226 and 134 degrees. The same steady wheel speed therefore produces unequal stroke times. The current pin sits inside the slot.</desc>
  <defs>
    <marker id="coulisse-turn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#697580"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#fff"/>
  <g font-family="Barlow, Arial, sans-serif" fill="#263340" font-size="16">
    <!-- r/d = 74/190; tangent angle asin(r/d); arcs 180 ± 2 asin(r/d). -->
    <text x="24" y="30" font-size="23" fill="#263340" font-weight="600">A steady turn makes an uneven swing.</text>
    <text x="24" y="55" font-size="15" fill="#697580" >The arm reverses where its slot is tangent to the pin’s circle.</text>
    <circle cx="265" cy="172" r="74" fill="#f8f9fa" stroke="#b7c1c9" stroke-width="1"/>
    <path d="M196.843 200.821A74 74 0 1 1 333.157 200.821" fill="none" stroke="#36434f" stroke-width="6" />
    <path d="M333.157 200.821A74 74 0 0 1 196.843 200.821" fill="none" stroke="#a83a30" stroke-width="6" />
    <path d="M265 362L145.752 80" fill="none" stroke="#b7c1c9" stroke-width="10" stroke-dasharray="7 6" stroke-linecap="round"/>
    <path d="M265 362L384.248 80" fill="none" stroke="#b7c1c9" stroke-width="10" stroke-dasharray="7 6" stroke-linecap="round"/>
    <path d="M265 362 265 80" fill="none" stroke="#36434f" stroke-width="18" stroke-linecap="round"/>
    <path d="M265 362 265 80" fill="none" stroke="#e9edf0" stroke-width="14" stroke-linecap="round"/>
    <path d="M265 335V91" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <path d="M265 172 265 98" fill="none" stroke="#a83a30" stroke-width="18" stroke-linecap="round"/>
    <path d="M265 172 265 98" fill="none" stroke="#fae8e3" stroke-width="14" stroke-linecap="round"/>
    <circle cx="265" cy="172" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/>
    <circle cx="265" cy="172" r="3.5" fill="#36434f" stroke="#36434f" stroke-width="1"/>
    <circle cx="265" cy="98" r="9" fill="#a83a30" stroke="#fff" stroke-width="2"/>
    <circle cx="265" cy="362" r="11" fill="#fff" stroke="#36434f" stroke-width="2"/>
    <circle cx="265" cy="362" r="4" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <path d="M239 379H291" fill="none" stroke="#697580" stroke-width="2" />
    <text x="105" y="286" font-size="17" fill="#36434f" font-weight="600">SLOTTED ARM</text>
    <text x="48" y="308" font-size="14" fill="#697580" >the white gap is the slot</text>
    <path d="M215 285 255 265" fill="none" stroke="#697580" stroke-width="1.25" />
    <text x="292" y="101" font-size="17" fill="#a83a30" font-weight="600">PIN</text>
    <text x="265" y="405" font-size="15" fill="#697580" text-anchor="middle">pivot</text>
    <path d="M351 122A98 98 0 0 1 361 182" fill="none" stroke="#697580" stroke-width="2.5" marker-end="url(#coulisse-turn)"/>
    <text x="440" y="128" font-size="18" fill="#36434f" font-weight="600">SLOW STROKE</text>
    <text x="440" y="151" font-size="16" fill="#697580" >about 226° of the turn</text>
    <path d="M416 140H434" fill="none" stroke="#36434f" stroke-width="6" />
    <text x="440" y="216" font-size="18" fill="#a83a30" font-weight="600">FAST STROKE</text>
    <text x="440" y="239" font-size="16" fill="#697580" >about 134° of the turn</text>
    <path d="M416 228H434" fill="none" stroke="#a83a30" stroke-width="6" />
    <text x="440" y="299" font-size="18" fill="#36434f" font-weight="600">Same wheel speed.</text>
    <text x="440" y="326" font-size="18" fill="#36434f" font-weight="600">Unequal time.</text>
    <text x="440" y="367" font-size="15" fill="#697580" >Example: 226 ÷ 134 ≈ 1.69</text>
    <text x="440" y="389" font-size="15" fill="#697580" >The long arc takes more time.</text>
  </g>
</svg>
