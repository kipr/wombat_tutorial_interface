<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="crane-linkage-title crane-linkage-description" role="img" viewBox="0 0 720 530"><title id="crane-linkage-title">A closed four-bar crane with an extended coupler</title><desc id="crane-linkage-description">The blue input link joins the left fixed pivot to the coupler. The rocker joins the right fixed pivot to a point exactly on the coupler; the coupler continues to the load. Solid and dashed positions share all link lengths. A sampled dashed curve follows the actual boom-tip path between them.</desc><defs><marker id="crane-turn" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#3d617e" d="m0 0 10 5-10 5Z"/></marker></defs><path fill="#fff" d="M0 0h720v530H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="360" y="31" font-size="23" font-weight="600" text-anchor="middle">One driving link moves the whole crane</text><text x="360" y="58" fill="#697580" text-anchor="middle">Four links close the loop. The coupler continues beyond its joint.</text><rect width="215" height="48" x="113" y="423" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="6"/><rect width="197" height="30" x="122" y="432" fill="none" stroke="#e0e5e8" rx="3"/><circle cx="129" cy="439" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="312" cy="439" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="129" cy="455" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="312" cy="455" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><text x="220" y="455" fill="#36434f" font-weight="600" text-anchor="middle">STATIONARY BASE</text><path fill="none" stroke="#b7c1c9" stroke-dasharray="6 5" stroke-linecap="round" stroke-width="7" d="m162 423 68.308-33.316 40.175-316.662M285.5 423l-40.844-146.41"/><path fill="none" stroke="#697580" stroke-dasharray="6 5" stroke-width="2" d="M162 423h123.5"/><path fill="none" stroke="#69