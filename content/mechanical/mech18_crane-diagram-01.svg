<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" role="img" aria-labelledby="crane-linkage-title crane-linkage-description">
  <title id="crane-linkage-title">A closed four-bar crane with an extended coupler</title>
  <desc id="crane-linkage-description">The blue input link joins the left fixed pivot to the coupler. The rocker joins the right fixed pivot to a point exactly on the coupler; the coupler continues to the load. Solid and dashed positions share all link lengths. A sampled dashed curve follows the actual boom-tip path between them.</desc>
  <defs>
    <marker id="crane-turn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#3d617e"/>
    </marker>
  </defs>
  <rect width="720" height="530" fill="#fff"/>
