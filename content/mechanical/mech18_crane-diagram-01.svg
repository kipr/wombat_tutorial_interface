    <text x="360" y="31" font-size="23" fill="#263340" text-anchor="middle" font-weight="600">One driving link moves the whole crane</text>
    <text x="360" y="58" font-size="16" fill="#697580" text-anchor="middle">Four links close the loop. The coupler continues beyond its joint.</text>
