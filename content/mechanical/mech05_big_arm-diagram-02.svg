<svg viewBox="0 0 620 300" role="img" aria-label="An arm pivoting at a point. A ten ounce object sits twelve inches out on the right, producing one hundred twenty ounce-inches. A nine ounce counterweight sits five inches out on the left, producing forty five ounce-inches in the opposite direction, which subtracts from the total." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="dn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="9" markerHeight="9" orient="auto">
            <path d="M0,0 L5,10 L10,0 z" fill="#444"></path>
          </marker>
          <marker id="tk1" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M1,0 L1,10" stroke="#444" stroke-width="1.6"></path>
          </marker>
          <marker id="tk2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M9,0 L9,10" stroke="#444" stroke-width="1.6"></path>
          </marker>
        </defs>

        
        <line x1="88" y1="128" x2="516" y2="128" stroke="#888" stroke-width="9" stroke-linecap="round"></line>
        
        <path d="M290,128 L272,164 L308,164 Z" fill="#1C1C1C"></path>
        <circle cx="290" cy="128" r="9" fill="#C0392B"></circle>
        <text x="290" y="186" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#1C1C1C">pivot</text>

        
        <circle cx="490" cy="104" r="20" fill="#F2F2F2" stroke="#444" stroke-width="2"></circle>
        <line x1="490" y1="132" x2="490" y2="166" stroke="#444" stroke-width="2.5" marker-end="url(#dn)"></line>
        <text x="518" y="108" font-family="'Barlow',sans-serif" font-size="14" font-weight="600" fill="#444">10 oz</text>
        <line x1="290" y1="212" x2="490" y2="212" stroke="#444" stroke-width="1.6" marker-start="url(#tk1)" marker-end="url(#tk2)"></line>
        <text x="390" y="234" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="14" font-weight="600" fill="#444">12 in</text>
        <text x="390" y="268" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="19" font-weight="700" fill="#C0392B">10 × 12 = 120 oz-in</text>

        
        <rect x="98" y="98" width="36" height="28" rx="3" fill="#FDF2F2" stroke="#C0392B" stroke-width="2"></rect>
        <line x1="116" y1="132" x2="116" y2="166" stroke="#444" stroke-width="2.5" marker-end="url(#dn)"></line>
        <text x="98" y="88" font-family="'Barlow',sans-serif" font-size="14" font-weight="600" fill="#C0392B">9 oz</text>
        <line x1="116" y1="212" x2="290" y2="212" stroke="#444" stroke-width="1.6" marker-start="url(#tk1)" marker-end="url(#tk2)"></line>
        <text x="203" y="234" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="14" font-weight="600" fill="#444">5 in</text>
        <text x="203" y="268" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="19" font-weight="700" fill="#1E8449">9 × 5 = 45 oz-in</text>
        <text x="203" y="42" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1E8449">COUNTERWEIGHT — subtracts</text>
        <text x="440" y="42" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#C0392B">LOAD — adds</text>
      </svg>
