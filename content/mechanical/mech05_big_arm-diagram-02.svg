<svg xmlns="http://www.w3.org/2000/svg" aria-label="An arm pivoting at a point. A ten ounce object sits twelve inches out on the right, producing one hundred twenty ounce-inches. A nine ounce counterweight sits five inches out on the left, producing forty five ounce-inches in the opposite direction, which subtracts from the total." role="img" viewBox="0 0 620 300"><defs><marker id="dn" markerHeight="9" markerWidth="9" orient="auto" refX="5" refY="9" viewBox="0 0 10 10"><path fill="#444" d="m0 0 5 10 5-10z"/></marker><marker id="tk1" markerHeight="8" markerWidth="8" orient="auto" refX="1" refY="5" viewBox="0 0 10 10"><path stroke="#444" stroke-width="1.6" d="M1 0v10"/></marker><marker id="tk2" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path stroke="#444" stroke-width="1.6" d="M9 0v10"/></marker></defs><path stroke="#888" stroke-linecap="round" stroke-width="9" d="M88 128h428"/><path fill="#1c1c1c" d="m290 128-18 36h36Z"/><circle cx="290" cy="128" r="9" fill="#c0392b"/><text x="290" y="186" fill="#1c1c1c" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" text-anchor="middle">pivot</text><circle cx="490" cy="104" r="20" fill="#f2f2f2" stroke="#444" stroke-width="2"/><path stroke="#444" stroke-width="2.5" marker-end="url(#dn)" d="M490 132v34"/><text x="518" y="108" fill="#444" font-family="'Barlow',sans-serif" font-size="14" font-weight="600">10 oz</text><path stroke="#444" stroke-width="1.6" marker-end="url(#tk2)" marker-start="url(#tk1)" d="M290 212h200"/><text x="390" y="234" fill="#444" font-family="'Barlow',sans-serif" font-size="14" font-weight="600" text-anchor="middle">12 in</text><text x="390" y="268" fill="#c0392b" font-family="'Barlow Condensed',sans-serif" font-size="19" font-weight="700" text-anchor="middle">10 × 12 = 120 oz-in</text><rect width="36" height="28" x="98" y="98" fill="#fdf2f2" stroke="#c0392b" stroke-width="2" rx="3"/><path stroke="#444" stroke-width="2.5" marker-end="url(#dn)" d="M116 132v34"/><text x="98" y="88" fill="#c0392b" font-family="'Barlow',sans-serif" font-size="14" font-weight="600">9 oz</text><path stroke="#444" stroke-width="1.6" marker-end="url(#tk2)" marker-start="url(#tk1)" d="M116 212h174"/><text x="203" y="234" fill="#444" font-family="'Barlow',sans-serif" font-size="14" font-weight="600" text-anchor="middle">5 in</text><text x="203" y="268" fill="#1e8449" font-family="'Barlow Condensed',sans-serif" font-size="19" font-weight="700" text-anchor="middle">9 × 5 = 45 oz-in</text><text x="203" y="42" fill="#1e8449" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" text-anchor="middle">COUNTERWEIGHT — subtracts</text><text x="440" y="42" fill="#c0392b" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" text-anchor="middle">LOAD — adds</text></svg>
