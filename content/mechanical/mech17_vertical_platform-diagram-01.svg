<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="scissor-positions-title scissor-positions-description" role="img" viewBox="0 0 720 535"><title id="scissor-positions-title">Two positions of the same two-stage scissor lift</title><desc id="scissor-positions-description">Each of the eight drawn links is 180 units long, and each X is pinned at its exact center. The collapsed view has a 50-unit rise per X; the extended view has a 145-unit rise per X. Both platform plates are the same width. Left ends pivot; right ends slide in tracks at the base and platform. The platform remains level.</desc><defs><marker id="scissor-slide" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#357458" d="m0 0 10 5-10 5Z"/></marker></defs><path fill="#fff" d="M0 0h720v535H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="360" y="31" font-size="23" font-weight="600" text-anchor="middle">Same links. Different height. Level platform.</text><text x="169" y="79" fill="#36434f" font-size="19" font-weight="600" text-anchor="middle">COLLAPSED</text><rect width="238" height="29" x="44" y="281" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="6"/><rect width="220" height="11" x="53" y="290" fill="none" stroke="#e0e5e8" rx="3"/><circle cx="60" cy="297" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="266" cy="297" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="60" cy="294" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="266" cy="294" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><rect width="238" height="25" x="44" y="410" fill="#e9edf0" stroke="#697580" stroke-width="1.5" rx="3"/><path fill="none" stroke="#697580" stroke-linecap="round" stroke-width="5" d="M77 410h188M77 310h188"/><path fill="none" stroke="#697580" stroke-linecap="round" stroke-width="18" d="m62 410 172.916-50"/><path fill="none" stroke="#e9edf0" stroke-linecap="round