    <marker id="scissor-slide" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#357458"/>
    </marker>
  </defs>
