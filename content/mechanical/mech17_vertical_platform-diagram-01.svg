<svg viewBox="0 0 620 320" role="img" aria-label="A scissor lift shown collapsed on the left and extended on the right. Crossed links pinned at their centres form stacked X shapes. One end of each pair is a fixed pivot and the other slides horizontally. The platform on top stays level in both positions." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="tkF" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M0,1 L10,1" stroke="#444" stroke-width="1.6"></path>
          </marker>
          <marker id="slideA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1E8449"></path>
          </marker>
        </defs>

        
        <text x="140" y="34" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700" fill="#1C1C1C">COLLAPSED</text>
        <line x1="50" y1="262" x2="240" y2="262" stroke="#1C1C1C" stroke-width="3"></line>
        <g stroke="#888" stroke-width="7" stroke-linecap="round">
          <line x1="70" y1="262" x2="212" y2="228"></line>
          <line x1="212" y1="262" x2="70" y2="228"></line>
          <line x1="70" y1="228" x2="212" y2="196"></line>
          <line x1="212" y1="228" x2="70" y2="196"></line>
        </g>
        <circle cx="141" cy="245" r="6" fill="#444"></circle>
        <circle cx="141" cy="212" r="6" fill="#444"></circle>
        <circle cx="70" cy="262" r="7" fill="#C0392B"></circle>
        <circle cx="212" cy="262" r="7" fill="none" stroke="#1E8449" stroke-width="3"></circle>
        <rect x="62" y="182" width="158" height="14" rx="3" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>

        
        <text x="440" y="34" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700" fill="#1C1C1C">EXTENDED</text>
        <line x1="350" y1="262" x2="540" y2="262" stroke="#1C1C1C" stroke-width="3"></line>
        <g stroke="#888" stroke-width="7" stroke-linecap="round">
          <line x1="392" y1="262" x2="490" y2="166"></line>
          <line x1="490" y1="262" x2="392" y2="166"></line>
          <line x1="392" y1="166" x2="490" y2="70"></line>
          <line x1="490" y1="166" x2="392" y2="70"></line>
        </g>
        <circle cx="441" cy="214" r="6" fill="#444"></circle>
        <circle cx="441" cy="118" r="6" fill="#444"></circle>
        <circle cx="392" cy="262" r="7" fill="#C0392B"></circle>
        <circle cx="490" cy="262" r="7" fill="none" stroke="#1E8449" stroke-width="3"></circle>
        <rect x="382" y="56" width="118" height="14" rx="3" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>

        
        <line x1="516" y1="286" x2="470" y2="286" stroke="#1E8449" stroke-width="2.5" marker-end="url(#slideA)"></line>
        <text x="540" y="290" font-family="'Barlow',sans-serif" font-size="12" font-weight="600" fill="#1E8449">slides in</text>

        
        <line x1="566" y1="70" x2="566" y2="262" stroke="#444" stroke-width="1.6" marker-start="url(#tkF)" marker-end="url(#tkF)"></line>
        <text x="586" y="170" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#444" transform="rotate(-90 586 170)">lift height</text>

        
        <circle cx="264" cy="120" r="7" fill="#C0392B"></circle>
        <text x="280" y="125" font-family="'Barlow',sans-serif" font-size="12.5" fill="#444">fixed pivot</text>
        <circle cx="264" cy="148" r="7" fill="none" stroke="#1E8449" stroke-width="3"></circle>
        <text x="280" y="153" font-family="'Barlow',sans-serif" font-size="12.5" fill="#444">sliding end</text>
        <text x="264" y="90" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#666">the platform stays</text>
        <text x="264" y="106" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#666">level either way</text>
      </svg>
