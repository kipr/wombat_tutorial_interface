<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 535" role="img" aria-labelledby="scissor-positions-title scissor-positions-description">
  <title id="scissor-positions-title">Two positions of the same two-stage scissor lift</title>
  <desc id="scissor-positions-description">Each of the eight drawn links is 180 units long, and each X is pinned at its exact center. The collapsed view has a 50-unit rise per X; the extended view has a 145-unit rise per X. Both platform plates are the same width. Left ends pivot; right ends slide in tracks at the base and platform. The platform remains level.</desc>
