<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="lift-paths-title lift-paths-description">
  <title id="lift-paths-title">A level platform and a nearly straight coupler path</title>
  <desc id="lift-paths-description">Two four-bar linkages with calculated paths and unchanged link lengths between poses. A parallelogram keeps its blue coupler level while its marked midpoint follows a circular arc. An unequal-link Hoeken linkage has an extended coupler whose tip follows a nearly vertical segment during part of the cycle, then curves away on the return. The blue coupler tilts. Red marks the useful path; grey shows another pose and the remaining return path.</desc>
  <rect width="720" height="520" fill="#fff"/>
  <g font-family="Barlow, Arial, sans-serif" fill="#263340" font-size="16">
    <!-- Left: 110-unit arms; ground and coupler spans both 140.
         Right: Hoeken linkage at 150° (solid) and 210° (grey), rotated 90°.
         Length ratios: ground 2, crank 1, coupler/rocker 2.5 each;
         tracing tip extends the coupler another 2.5. The red segment covers
         crank angles 90°–270°. The complete return curve is grey. -->
