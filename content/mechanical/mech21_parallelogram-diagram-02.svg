<svg viewBox="0 0 620 320" role="img" aria-label="Two four-bar linkages compared. In a parallelogram, where both moving links are equal, the platform stays level but swings through an arc. With unequal links, a point on the coupler traces a path that is very nearly a straight vertical line, but the platform tilts as it moves." xmlns="http://www.w3.org/2000/svg">
        
        <rect x="8" y="8" width="296" height="304" rx="8" fill="#fff" stroke="#CCC"></rect>
        <text x="24" y="34" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1C1C1C">PARALLELOGRAM</text>
        <text x="24" y="52" font-family="'Barlow',sans-serif" font-size="12.5" fill="#666">both moving links equal</text>

        <line x1="60" y1="264" x2="220" y2="264" stroke="#1C1C1C" stroke-width="2.5"></line>
        <line x1="80" y1="264" x2="80" y2="152" stroke="#888" stroke-width="8" stroke-linecap="round"></line>
        <line x1="200" y1="264" x2="200" y2="152" stroke="#888" stroke-width="8" stroke-linecap="round"></line>
        <rect x="70" y="140" width="140" height="14" rx="3" fill="#dbe3f0" stroke="#1F2D5A" stroke-width="2.5"></rect>
        <circle cx="80" cy="264" r="7" fill="#fff" stroke="#1C1C1C" stroke-width="3"></circle>
        <circle cx="200" cy="264" r="7" fill="#fff" stroke="#1C1C1C" stroke-width="3"></circle>
        <circle cx="140" cy="147" r="6" fill="#C0392B"></circle>

        <path d="M72,166 A122,122 0 0 1 208,166" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7 5"></path>
        <text x="140" y="196" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#C0392B">the point swings on an arc</text>

        <text x="24" y="290" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#1E8449">Stays level.</text>
        <text x="24" y="306" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#C0392B">Drifts sideways as it rises.</text>

        
        <rect x="316" y="8" width="296" height="304" rx="8" fill="#fff" stroke="#CCC"></rect>
        <text x="332" y="34" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1C1C1C">UNEQUAL LINKS</text>
        <text x="332" y="52" font-family="'Barlow',sans-serif" font-size="12.5" fill="#666">deliberately different lengths</text>

        <line x1="368" y1="264" x2="528" y2="264" stroke="#1C1C1C" stroke-width="2.5"></line>
        <line x1="388" y1="264" x2="376" y2="166" stroke="#888" stroke-width="8" stroke-linecap="round"></line>
        <line x1="508" y1="264" x2="522" y2="140" stroke="#888" stroke-width="8" stroke-linecap="round"></line>
        <line x1="376" y1="166" x2="522" y2="140" stroke="#1F2D5A" stroke-width="9" stroke-linecap="round"></line>
        <circle cx="388" cy="264" r="7" fill="#fff" stroke="#1C1C1C" stroke-width="3"></circle>
        <circle cx="508" cy="264" r="7" fill="#fff" stroke="#1C1C1C" stroke-width="3"></circle>
        <circle cx="449" cy="153" r="6" fill="#C0392B"></circle>

        <path d="M445,96 Q459,154 445,212" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7 5"></path>
        <text x="500" y="196" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#C0392B">very nearly straight</text>

        <text x="332" y="290" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#1E8449">Travels almost straight up.</text>
        <text x="332" y="306" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#C0392B">The platform tilts.</text>
      </svg>
