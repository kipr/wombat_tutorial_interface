<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="lift-paths-title lift-paths-description" role="img" viewBox="0 0 720 520"><title id="lift-paths-title">A level platform and a nearly straight coupler path</title><desc id="lift-paths-description">Two four-bar linkages with calculated paths and unchanged link lengths between poses. A parallelogram keeps its blue coupler level while its marked midpoint follows a circular arc. An unequal-link Hoeken linkage has an extended coupler whose tip follows a nearly vertical segment during part of the cycle, then curves away on the return. The blue coupler tilts. Red marks the useful path; grey shows another pose and the remaining return path.</desc><path fill="#fff" d="M0 0h720v520H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="360" y="31" font-size="23" font-weight="600" text-anchor="middle">Choose the path to suit the load</text><path fill="none" stroke="#b7c1c9" d="M360 78v399"/><text x="25" y="96" fill="#36434f" font-size="20" font-weight="600">PARALLELOGRAM</text><text x="25" y="122" fill="#697580">both moving links equal</text><path fill="none" stroke="#36434f" stroke-width="4" d="M65 351h140"/><path fill="none" stroke="#b7c1c9" stroke-dasharray="6 5" stroke-linecap="round" stroke-width="3" d="m65 351 99.69386-46.488h140L205 351"/><path fill="none" stroke="#697580" stroke-linecap="round" stroke-width="18" d="m65 351 46.488-99.694"/><path fill="none" stroke="#e9edf0" stroke-linecap="round" stroke-width="14" d="m65 351 46.488-99.694"/><circle cx="74.298" cy="331.061" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="83.595" cy="311.122" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="92.893" cy="291.184" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="102.19" cy="271.245" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><path fill="none" stroke="#697580" stroke-linecap="round" stroke-width="18" d="m205