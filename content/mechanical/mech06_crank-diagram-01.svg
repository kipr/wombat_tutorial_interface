<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="crank-title crank-desc" role="img" viewBox="0 0 720 850"><title id="crank-title">How a crank turns rotation into a straight push</title><desc id="crank-desc">Three snapshots of the same crank turning counterclockwise. The fixed axle and guide stay in place. In snapshot 1 the pin points right and the pusher is farthest out. After a quarter-turn, the pin is above the axle, the connecting rod tilts, and the pusher moves inward. After a half-turn, the pin points left and the pusher is farthest in. Both rod ends pivot. The next half-turn brings the pusher back out. The stroke between the two extreme pusher positions is twice the axle-to-pin offset.</desc><defs><circle id="crank-axle" cx="140" r="7" fill="#343a40" stroke="#fff" stroke-width="2"/><circle id="crank-joint" r="7" fill="#fff" stroke="#343a40" stroke-width="2.5"/><g id="crank-fixed-parts"><circle cx="140" r="64" fill="#f5f5f5" stroke="#666" stroke-width="2"/><circle cx="140" r="48" fill="none" stroke="#777" stroke-dasharray="5 5" stroke-width="1.5"/><path fill="#ebedef" d="M308-22h202v44H308z"/><path fill="none" stroke="#606870" stroke-width="3" d="M308-22h202M308 22h202"/><path stroke="#606870" stroke-width="1.5" d="M320-22v-7m24 7v-7m24 7v-7m24 7v-7m24 7v-7m24 7v-7m24 7v-7m24 7v-7M320 22v7m24-7v7m24-7v7m24-7v7m24-7v7m24-7v7m24-7v7m24-7v7"/></g><g id="crank-pusher"><rect width="32" height="34" x="-16" y="-17" fill="#e8b95b" stroke="#71501a" stroke-width="2" rx="3"/><use href="#crank-joint"/></g><marker id="crank-arrow" markerHeight="6" markerWidth="6" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#343a40" d="m0 0 10 5-10 5Z"/></marker></defs><path fill="#fff" d="M0 0h720v850H0z"/><g fill="#343a40" font-family="'Barlow',Arial,sans-serif" font-size="18"><text x="24" y="30" font-size="24" font-weight="700">One wheel turns. The pusher goes out and back.</text><text x="24" y="56">Read down: these are three moments in the same motion.</text><text x="24" y="93" font-size="21" font-weight="700">1. Pin points right — pusher farthest out</text><g transform="translate(0 183)"><use href="#crank-fixed-parts"/><path stroke="#244a68" stroke-linecap="round" stroke-width="10" d="M188 0h240"/><path stroke="#b33328" stroke-linecap="round" stroke-width="10" d="M140 0h48"/><use href="#crank-axle"/><use x="188" href="#crank-joint"/><use x="428" href="#crank-pusher"/></g><path fill="none" stroke="#606870" stroke-width="1.5" d="m73 130 63 46m87-44-33 43m81-24v24m191-28-24 17m-221 67-51-40m369 24-30-8"/><text x="24" y="124">Fixed axle</text><text x="210" y="126" fill="#b33328">Off-center pin</text><text x="271" y="145" fill="#244a68">connecting rod</text><text x="453" y="141">Pusher</text><text x="140" y="266" text-anchor="middle">crank wheel</text><text x="218" y="246" fill="#b33328">Crank arm</text><text x="535" y="216" font-weight="700">Fixed guide</text><text x="535" y="238">Pusher slides only</text><text x="535" y="260">left and right.</text><path stroke="#d0d4d8" d="M24 282h672"/><text x="24" y="315" font-size="21" font-weight="700">2. After a quarter-turn — pusher moves inward</text><g transform="translate(0 400)"><use href="#crank-fixed-parts"/><path stroke="#244a68" stroke-linecap="round" stroke-width="10" d="M140-48 375.151 0"/><path stroke="#b33328" stroke-linecap="round" stroke-width="10" d="M140 0v-48"/><use href="#crank-axle"/><use x="140" y="-48" href="#crank-joint"/><use x="375.151" href="#crank-pusher"/><path fill="none" stroke="#343a40" stroke-width="2.5" marker-end="url(#crank-arrow)" d="M82-58A82 82 0 0 0 58 0"/><path fill="none" stroke="#343a40" stroke-width="2.5" marker-end="url(#crank-arrow)" d="M436 51h-86"/></g><text x="235" y="351" fill="#244a68">The rod tilts.</text><text x="535" y="382">Both rod ends</text><text x="535" y="404">can pivot.</text><text x="140" y="486" text-anchor="middle">Wheel keeps turning</text><text x="392" y="481" text-anchor="middle">Pusher moves left</text><path stroke="#d0d4d8" d="M24 502h672"/><text x="24" y="535" font-size="21" font-weight="700">3. After a half-turn — pusher farthest in</text><g transform="translate(0 620)"><use href="#crank-fixed-parts"/><path stroke="#244a68" stroke-linecap="round" stroke-width="10" d="M92 0h240"/><path stroke="#b33328" stroke-linecap="round" stroke-width="10" d="M140 0H92"/><use href="#crank-axle"/><use x="92" href="#crank-joint"/><use x="332" href="#crank-pusher"/><path fill="none" stroke="#343a40" stroke-width="2.5" marker-end="url(#crank-arrow)" d="M82-58A82 82 0 0 0 58 0"/></g><text x="535" y="598">The next half-turn</text><text x="535" y="620">brings the pusher</text><text x="535" y="642">back out.</text><path fill="none" stroke="#71501a" stroke-dasharray="4 5" stroke-width="1.5" d="M428 690v34m-96-73v73"/><path fill="none" stroke="#343a40" stroke-width="2" d="M332 704h96m-96-9v18m96-18v18"/><text x="332" y="682" text-anchor="middle">In (3)</text><text x="428" y="682" text-anchor="middle">Out (1)</text><text x="380" y="747" font-size="20" font-weight="700" text-anchor="middle">Stroke: distance from one end of travel to the other</text><path fill="none" stroke="#b33328" stroke-width="1.5" d="M92 633v71m48-71v71"/><path fill="none" stroke="#b33328" stroke-width="2" d="M92 690h48m-48-8v16m48-16v16"/><text x="116" y="729" fill="#b33328" text-anchor="middle">Pin offset</text><text x="24" y="775" fill="#b33328">Pin offset = distance from axle to pin</text><text x="360" y="816" font-size="25" font-weight="700" text-anchor="middle">stroke = 2 × offset</text></g></svg>
