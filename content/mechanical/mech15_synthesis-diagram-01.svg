<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="series-mechanisms-title series-mechanisms-description">
  <title id="series-mechanisms-title">Check the interfaces between mechanisms</title>
  <desc id="series-mechanisms-description">Mechanism one is driven by the motor; its output drives mechanism two; the second output must travel more than six inches. Arrows connect the three blocks. A red dot and visible interface label mark each join, where binding, looseness, or an unsupported connection can stop the chain.</desc>
  <defs>
    <marker id="series-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#36434f"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fff"/>
  <g font-family="Barlow, Arial, sans-serif" fill="#263340" font-size="16">
    <text x="24" y="30" font-size="23" fill="#263340" font-weight="600">Each output becomes the next input.</text>
    <text x="24" y="55" font-size="16" fill="#697580" >Turn the chain by hand and watch the joins for binding or free play.</text>
    <rect x="35" y="135" width="174" height="106" rx="3" fill="#f3f5f6" stroke="#36434f" stroke-width="1.5" />
    <rect x="44" y="144" width="156" height="88" rx="3" fill="none" stroke="#b7c1c9" stroke-width="1.5" />
    <text x="122" y="178" font-size="18" fill="#36434f" text-anchor="middle" font-weight="600">MECHANISM 1</text>
    <text x="122" y="207" font-size="15" fill="#36434f" text-anchor="middle">the motor drives this</text>
    <rect x="273" y="135" width="174" height="106" rx="3" fill="#f3f5f6" stroke="#36434f" stroke-width="1.5" />
    <rect x="282" y="144" width="156" height="88" rx="3" fill="none" stroke="#b7c1c9" stroke-width="1.5" />
    <text x="360" y="178" font-size="18" fill="#36434f" text-anchor="middle" font-weight="600">MECHANISM 2</text>
    <text x="360" y="207" font-size="15" fill="#36434f" text-anchor="middle">driven by the first</text>
    <rect x="511" y="135" width="174" height="106" rx="3" fill="#fae8e3" stroke="#a83a30" stroke-width="1.5" />
    <rect x="520" y="144" width="156" height="88" rx="3" fill="none" stroke="#b7c1c9" stroke-width="1.5" />
    <text x="598" y="178" font-size="18" fill="#a83a30" text-anchor="middle" font-weight="600">OUTPUT</text>
    <text x="598" y="207" font-size="15" fill="#a83a30" text-anchor="middle">more than 6 inches</text>
    <path d="M213 188H266" fill="none" stroke="#36434f" stroke-width="2" marker-end="url(#series-flow)"/>
    <circle cx="241" cy="188" r="7" fill="#a83a30" stroke="#fff" stroke-width="1.5"/>
    <text x="241" y="103" font-size="16" fill="#a83a30" text-anchor="middle" font-weight="600">INTERFACE</text>
    <path d="M241 111V174" fill="none" stroke="#a83a30" stroke-width="1.25" />
    <path d="M451 188H504" fill="none" stroke="#36434f" stroke-width="2" marker-end="url(#series-flow)"/>
    <circle cx="479" cy="188" r="7" fill="#a83a30" stroke="#fff" stroke-width="1.5"/>
    <text x="479" y="103" font-size="16" fill="#a83a30" text-anchor="middle" font-weight="600">INTERFACE</text>
    <path d="M479 111V174" fill="none" stroke="#a83a30" stroke-width="1.25" />
    <text x="360" y="289" font-size="17" fill="#36434f" text-anchor="middle">Almost every failure happens at a red dot, not inside a box.</text>
    <text x="360" y="320" font-size="16" fill="#697580" text-anchor="middle">Support the connection. Let the required joint move freely.</text>
  </g>
</svg>
