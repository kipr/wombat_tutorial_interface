<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="series-mechanisms-title series-mechanisms-description" role="img" viewBox="0 0 720 350"><title id="series-mechanisms-title">Check the interfaces between mechanisms</title><desc id="series-mechanisms-description">Mechanism one is driven by the motor; its output drives mechanism two; the second output must travel more than six inches. Arrows connect the three blocks. A red dot and visible interface label mark each join, where binding, looseness, or an unsupported connection can stop the chain.</desc><defs><marker id="series-flow" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#36434f" d="m0 0 10 5-10 5Z"/></marker></defs><path fill="#fff" d="M0 0h720v350H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="24" y="30" font-size="23" font-weight="600">Each output becomes the next input.</text><text x="24" y="55" fill="#697580">Turn the chain by hand and watch the joins for binding or free play.</text><rect width="174" height="106" x="35" y="135" fill="#f3f5f6" stroke="#36434f" stroke-width="1.5" rx="3"/><rect width="156" height="88" x="44" y="144" fill="none" stroke="#b7c1c9" stroke-width="1.5" rx="3"/><text x="122" y="178" fill="#36434f" font-size="18" font-weight="600" text-anchor="middle">MECHANISM 1</text><text x="122" y="207" fill="#36434f" font-size="15" text-anchor="middle">the motor drives this</text><rect width="174" height="106" x="273" y="135" fill="#f3f5f6" stroke="#36434f" stroke-width="1.5" rx="3"/><rect width="156" height="88" x="282" y="144" fill="none" stroke="#b7c1c9" stroke-width="1.5" rx="3"/><text x="360" y="178" fill="#36434f" font-size="18" font-weight="600" text-anchor="middle">MECHANISM 2</text><text x="360" y="207" fill="#36434f" font-size="15" text-anchor="middle">driven by the first</text><rect width="174" height="106" x="511" y="135" fill="#fae8e3" stroke="#a83a30" stroke-width="1.5" rx="3"/><rect width="156" height="88" x="520" y="144" fill="none" stroke="#b7c1c9" stroke-width="1.5" rx="3"/><text x="598" y="178" fill="#a83a30" font-size="18" font-weight="600" text-anchor="middle">OUTPUT</text><text x="598" y="207" fill="#a83a30" font-size="15" text-anchor="middle">more than 6 inches</text><path fill="none" stroke="#36434f" stroke-width="2" marker-end="url(#series-flow)" d="M213 188h53"/><circle cx="241" cy="188" r="7" fill="#a83a30" stroke="#fff" stroke-width="1.5"/><text x="241" y="103" fill="#a83a30" font-weight="600" text-anchor="middle">INTERFACE</text><path fill="none" stroke="#a83a30" stroke-width="1.25" d="M241 111v63"/><path fill="none" stroke="#36434f" stroke-width="2" marker-end="url(#series-flow)" d="M451 188h53"/><circle cx="479" cy="188" r="7" fill="#a83a30" stroke="#fff" stroke-width="1.5"/><text x="479" y="103" fill="#a83a30" font-weight="600" text-anchor="middle">INTERFACE</text><path fill="none" stroke="#a83a30" stroke-width="1.25" d="M479 111v63"/><text x="360" y="289" fill="#36434f" font-size="17" text-anchor="middle">Almost every failure happens at a red dot, not inside a box.</text><text x="360" y="320" fill="#697580" text-anchor="middle">Support the connection. Let the required joint move freely.</text></g></svg>
