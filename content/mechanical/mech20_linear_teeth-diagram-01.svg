<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 485" role="img" aria-labelledby="telescoping-stages-title telescoping-stages-description">
  <title id="telescoping-stages-title">Equal stage travel doubles the reach beyond an identical base</title>
  <desc id="telescoping-stages-description">Both bases and all stage bars are 110 units long. Each stage slides 75 units relative to its support, retaining 35 units of overlap. One stage reaches 75 units beyond the base; a second stage carried by the first reaches 150. The grey dashed outline marks the retracted envelope. The comparison is of travel, not the full length of a bar.</desc>
  <rect width="720" height="485" fill="#fff"/>
  <g font-family="Barlow, Arial, sans-serif" fill="#263340" font-size="16">
    <!-- Both bases 110 units wide. First stage x+75..x+185; second x+150..x+260. -->
    <text x="360" y="31" font-size="23" fill="#263340" text-anchor="middle" font-weight="600">Stage travel adds to the travel carrying it</text>
    <path d="M360 74V400" fill="none" stroke="#b7c1c9" stroke-width="1" />
    <text x="35" y="92" font-size="20" fill="#36434f" font-weight="600">ONE STAGE</text>
    <rect x="35" y="179" width="110" height="98" rx="6" fill="#f3f5f6" stroke="#697580" stroke-width="1.5"/>
    <rect x="44" y="188" width="92" height="80" rx="3" fill="none" stroke="#e0e5e8"/>
    <circle cx="51" cy="195" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <circle cx="129" cy="195" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <circle cx="51" cy="261" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <circle cx="129" cy="261" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <text x="90" y="166" font-size="16" fill="#697580" text-anchor="middle" font-weight="600">BASE</text>
    <rect x="35" y="211" width="110" height="52" rx="3" fill="none" stroke="#b7c1c9" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="110" y="211" width="110" height="52" rx="3" fill="#eaf0f5" stroke="#3d617e" stroke-width="1.5" />
    <path d="M145 280V326M220 266V326" fill="none" stroke="#b7c1c9" stroke-width="1" stroke-dasharray="6 5"/>
    <path d="M145 320L220 320M145 315L145 325M220 315L220 325" fill="none" stroke="#3d617e" stroke-width="1.25" />
    <text x="182.5" y="347" font-size="17" fill="#3d617e" text-anchor="middle">reach</text>
    <text x="182.5" y="373" font-size="16" fill="#697580" text-anchor="middle">1 × travel</text>
    <text x="394" y="92" font-size="20" fill="#36434f" font-weight="600">TWO STAGES</text>
    <rect x="394" y="179" width="110" height="98" rx="6" fill="#f3f5f6" stroke="#697580" stroke-width="1.5"/>
    <rect x="403" y="188" width="92" height="80" rx="3" fill="none" stroke="#e0e5e8"/>
    <circle cx="410" cy="195" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <circle cx="488" cy="195" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <circle cx="410" cy="261" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <circle cx="488" cy="261" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/>
    <text x="449" y="166" font-size="16" fill="#697580" text-anchor="middle" font-weight="600">BASE</text>
    <rect x="394" y="211" width="110" height="52" rx="3" fill="none" stroke="#b7c1c9" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="469" y="211" width="110" height="52" rx="3" fill="#eaf0f5" stroke="#3d617e" stroke-width="1.5" />
    <rect x="544" y="222" width="110" height="30" rx="3" fill="#fae8e3" stroke="#a83a30" stroke-width="1.5" />
    <text x="523" y="198" font-size="15" fill="#3d617e" text-anchor="middle">stage 1</text>
    <text x="614" y="279" font-size="15" fill="#a83a30" text-anchor="middle">stage 2</text>
    <path d="M504 280V326M654 266V326" fill="none" stroke="#b7c1c9" stroke-width="1" stroke-dasharray="6 5"/>
    <path d="M504 320L654 320M504 315L504 325M654 315L654 325" fill="none" stroke="#a83a30" stroke-width="1.25" />
    <text x="579" y="347" font-size="17" fill="#a83a30" text-anchor="middle">reach</text>
    <text x="579" y="373" font-size="16" fill="#697580" text-anchor="middle">2 × travel</text>
    <text x="24" y="416" font-size="15" fill="#697580" >grey dashed shows it retracted</text>
    <text x="392" y="416" font-size="17" fill="#a83a30" font-weight="600">Same base. Twice the reach.</text>
    <text x="360" y="461" font-size="15" fill="#697580" text-anchor="middle">Equal 75-unit travel per stage; each stage keeps 35 units of overlap for support.</text>
  </g>
</svg>
