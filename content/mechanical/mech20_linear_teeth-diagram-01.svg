<svg viewBox="0 0 620 300" role="img" aria-label="Two extension systems compared. A single stage slides one bar out of a base and reaches a certain distance. Two stages, one carried on the other, reach twice as far from a base of the same size." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="tkK" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M1,0 L1,10" stroke="#444" stroke-width="1.6"></path>
          </marker>
          <marker id="tkL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M9,0 L9,10" stroke="#444" stroke-width="1.6"></path>
          </marker>
        </defs>

        
        <rect x="8" y="8" width="296" height="284" rx="8" fill="#fff" stroke="#CCC"></rect>
        <text x="24" y="34" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1C1C1C">ONE STAGE</text>

        <rect x="34" y="118" width="96" height="66" rx="3" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>
        <text x="82" y="158" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="14" font-weight="700" fill="#444">BASE</text>

        <rect x="40" y="132" width="130" height="38" rx="2" fill="none" stroke="#BBB" stroke-width="2" stroke-dasharray="8 6"></rect>
        <rect x="120" y="132" width="130" height="38" rx="2" fill="#dbe3f0" stroke="#1F2D5A" stroke-width="2.5"></rect>
        <line x1="126" y1="151" x2="244" y2="151" stroke="#1F2D5A" stroke-width="9" stroke-dasharray="8 10"></line>

        <line x1="130" y1="214" x2="250" y2="214" stroke="#444" stroke-width="1.6" marker-start="url(#tkK)" marker-end="url(#tkL)"></line>
        <text x="190" y="234" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#444">reach</text>
        <text x="24" y="266" font-family="'Barlow',sans-serif" font-size="12.5" fill="#666">grey dashed shows it retracted</text>

        
        <rect x="316" y="8" width="296" height="284" rx="8" fill="#fff" stroke="#CCC"></rect>
        <text x="332" y="34" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1C1C1C">TWO STAGES</text>

        <rect x="336" y="118" width="86" height="66" rx="3" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>
        <text x="379" y="158" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="14" font-weight="700" fill="#444">BASE</text>

        <rect x="412" y="128" width="112" height="46" rx="2" fill="#dbe3f0" stroke="#1F2D5A" stroke-width="2.5"></rect>
        <text x="468" y="120" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="11.5" font-weight="600" fill="#1F2D5A">stage 1</text>

        <rect x="500" y="138" width="104" height="28" rx="2" fill="#f7d9d4" stroke="#C0392B" stroke-width="2.5"></rect>
        <text x="552" y="188" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="11.5" font-weight="600" fill="#C0392B">stage 2</text>

        <line x1="422" y1="214" x2="604" y2="214" stroke="#444" stroke-width="1.6" marker-start="url(#tkK)" marker-end="url(#tkL)"></line>
        <text x="513" y="234" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#444">reach</text>
        <text x="332" y="266" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#C0392B">Same base. Twice the reach.</text>
      </svg>
