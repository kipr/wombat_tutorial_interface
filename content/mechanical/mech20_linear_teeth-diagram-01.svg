<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="telescoping-stages-title telescoping-stages-description" role="img" viewBox="0 0 720 485"><title id="telescoping-stages-title">Equal stage travel doubles the reach beyond an identical base</title><desc id="telescoping-stages-description">Both bases and all stage bars are 110 units long. Each stage slides 75 units relative to its support, retaining 35 units of overlap. One stage reaches 75 units beyond the base; a second stage carried by the first reaches 150. The grey dashed outline marks the retracted envelope. The comparison is of travel, not the full length of a bar.</desc><path fill="#fff" d="M0 0h720v485H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="360" y="31" font-size="23" font-weight="600" text-anchor="middle">Stage travel adds to the travel carrying it</text><path fill="none" stroke="#b7c1c9" d="M360 74v326"/><text x="35" y="92" fill="#36434f" font-size="20" font-weight="600">ONE STAGE</text><rect width="110" height="98" x="35" y="179" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="6"/><rect width="92" height="80" x="44" y="188" fill="none" stroke="#e0e5e8" rx="3"/><circle cx="51" cy="195" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="129" cy="195" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="51" cy="261" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="129" cy="261" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><text x="90" y="166" fill="#697580" font-weight="600" text-anchor="middle">BASE</text><rect width="110" height="52" x="35" y="211" fill="none" stroke="#b7c1c9" stroke-dasharray="6 5" stroke-width="1.5" rx="3"/><rect width="110" height="52" x="110" y="211" fill="#eaf0f5" stroke="#3d617e" stroke-width="1.5" rx="3"/><path fill="none" stroke="#b7c1c9" stroke-dasharray="6 5" d="M145 280v46m75-60v60"/><path fill="none" stroke="#3d617e" stroke-width="1.25" d="M145 320h75m-75-5v10m75-10v10"/><text x="182.5" y="347" fill="#3d617e" font-size="17" text-anchor="middle">reach</text><text x="182.5" y="373" fill="#697580" text-anchor="middle">1 × travel</text><text x="394" y="92" fill="#36434f" font-size="20" font-weight="600">TWO STAGES</text><rect width="110" height="98" x="394" y="179" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="6"/><rect width="92" height="80" x="403" y="188" fill="none" stroke="#e0e5e8" rx="3"/><circle cx="410" cy="195" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="488" cy="195" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="410" cy="261" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="488" cy="261" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><text x="449" y="166" fill="#697580" font-weight="600" text-anchor="middle">BASE</text><rect width="110" height="52" x="394" y="211" fill="none" stroke="#b7c1c9" stroke-dasharray="6 5" stroke-width="1.5" rx="3"/><rect width="110" height="52" x="469" y="211" fill="#eaf0f5" stroke="#3d617e" stroke-width="1.5" rx="3"/><rect width="110" height="30" x="544" y="222" fill="#fae8e3" stroke="#a83a30" stroke-width="1.5" rx="3"/><text x="523" y="198" fill="#3d617e" font-size="15" text-anchor="middle">stage 1</text><text x="614" y="279" fill="#a83a30" font-size="15" text-anchor="middle">stage 2</text><path fill="none" stroke="#b7c1c9" stroke-dasharray="6 5" d="M504 280v46m150-60v60"/><path fill="none" stroke="#a83a30" stroke-width="1.25" d="M504 320h150m-150-5v10m150-10v10"/><text x="579" y="347" fill="#a83a30" font-size="17" text-anchor="middle">reach</text><text x="579" y="373" fill="#697580" text-anchor="middle">2 × travel</text><text x="24" y="416" fill="#697580" font-size="15">grey dashed shows it retracted</text><text x="392" y="416" fill="#a83a30" font-size="17" font-weight="600">Same base. Twice the reach.</text><text x="360" y="461" fill="#697580" font-size="15" text-anchor="middle">Equal 75-unit travel per stage; each stage keeps 35 units of overlap for support.</text></g></svg>
