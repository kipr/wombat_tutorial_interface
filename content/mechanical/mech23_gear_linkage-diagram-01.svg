<svg viewBox="0 0 620 330" role="img" aria-label="Side view of the mechanism. A gear on the structure drives a linkage arm carrying a claw. In the down position the claw is at ground level holding a one inch cube; in the up position, shown dashed, the claw is raised. An arrow shows the whole structure being moved so that the parked claw drags the cube along." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="rotM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"></path>
          </marker>
          <marker id="dragA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#1E8449"></path>
          </marker>
        </defs>

        
        <line x1="40" y1="266" x2="584" y2="266" stroke="#1C1C1C" stroke-width="3"></line>

        
        <rect x="58" y="118" width="140" height="148" rx="3" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>
        <text x="128" y="180" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="15" font-weight="700" fill="#444">STRUCTURE</text>
        <text x="128" y="200" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="15" font-weight="700" fill="#444">+ MOTOR</text>

        
        <circle cx="240" cy="170" r="36" fill="#fff" stroke="#1C1C1C" stroke-width="6" stroke-dasharray="12 12"></circle>
        <circle cx="240" cy="170" r="5" fill="#444"></circle>
        <path d="M288,132 A60,60 0 0 1 296,178" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#rotM)"></path>
        <text x="308" y="126" font-family="'Barlow',sans-serif" font-size="12" font-weight="600" fill="#C0392B">one direction only</text>

        
        <circle cx="240" cy="134" r="8" fill="none" stroke="#BBB" stroke-width="3"></circle>
        <line x1="240" y1="134" x2="424" y2="158" stroke="#BBB" stroke-width="7" stroke-linecap="round" stroke-dasharray="10 7"></line>
        <path d="M424,146 L446,158 L424,170" fill="none" stroke="#BBB" stroke-width="3" stroke-dasharray="7 5"></path>
        <text x="466" y="150" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#888">up</text>

        
        <circle cx="240" cy="206" r="8" fill="#C0392B"></circle>
        <line x1="240" y1="206" x2="424" y2="240" stroke="#888" stroke-width="8" stroke-linecap="round"></line>
        <path d="M424,224 L450,240 L424,256" fill="none" stroke="#C0392B" stroke-width="3.5"></path>
        <text x="392" y="212" font-family="'Barlow Condensed',sans-serif" font-size="15" font-weight="700" fill="#C0392B">DOWN — PARKED</text>

        
        <rect x="452" y="234" width="32" height="32" fill="#F8F8F8" stroke="#444" stroke-width="2"></rect>
        <text x="468" y="292" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12" fill="#666">1″ cube</text>

        
        <line x1="300" y1="312" x2="512" y2="312" stroke="#1E8449" stroke-width="3" marker-end="url(#dragA)"></line>
        <text x="406" y="330" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#1E8449">move the whole machine — the cube comes too</text>
      </svg>
