<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 478" role="img" aria-labelledby="parked-claw-title parked-claw-description">
  <title id="parked-claw-title">Cycle the claw, then test it with the power off</title>
  <desc id="parked-claw-description">Side view of a constrained gear-driven parallelogram claw. A 12-tooth motor pinion meshes with a 24-tooth crank gear at matching pitch and tooth-to-gap phase. Two equal cranks lift a level coupler and claw; grey shows the raised position. In the solid parked position the claw grips a one-inch cube on the ground. Moving the entire structure right creates a leftward drag load on the claw. The motor is off during this test.</desc>
  <defs>
    <!-- 12/24 teeth at common module 4.5: pitch radii 27/54, centres 81 apart.
         The 12-tooth pinion is phased 15° so its gap faces a crank-gear tooth.
         Both linkage cranks are 40 long; ground and coupler spans are 170. -->
