<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="striker-clearance-title striker-clearance-description" role="img" viewBox="0 0 720 550"><title id="striker-clearance-title">Set the sweep to catch only the top pom</title><desc id="striker-clearance-description">Scaled side view of a car creeping right while its front striker rotates clockwise. A one-inch-tall striker face sweeps over two one-inch poms supporting a third. The lowest point of the circular sweep is one and a quarter inches above the ground, so it intersects the top pom and clears the lower two. The face is two inches wide across the car, out of the plane of this side view. Dashed grey shows the outer sweep.</desc><defs><marker id="pom-turn" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#3d617e" d="m0 0 10 5-10 5Z"/></marker><marker id="car-travel" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#357458" d="m0 0 10 5-10 5Z"/></marker></defs><path fill="#fff" d="M0 0h720v550H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="360" y="31" font-size="23" font-weight="600" text-anchor="middle">Set the sweep to catch only the top pom</text><text x="24" y="61" fill="#697580" font-size="15">SIDE VIEW · the 2″ face width runs across the car.</text><path fill="none" stroke="#36434f" stroke-width="2" d="M30 400h655"/><rect width="230" height="70" x="60" y="293" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="3"/><text x="175" y="333" fill="#36434f" font-size="17" font-weight="600" text-anchor="middle">MOTOR &amp; CHASSIS</text><circle cx="110" cy="375" r="25" fill="#36434f" stroke="#36434f" stroke-width="1.5"/><circle cx="110" cy="375" r="15" fill="#e9edf0" stroke="#697580" stroke-width="1.5"/><circle cx="110" cy="375" r="5" fill="#36434f" stroke="#36434f" stroke-width="1.5"/><circle cx="240" cy="375" r="25" fill="#36434f" stroke="#36434f" stroke-width="1.5"/><circle cx="240" cy="375" r="15" fill="#e9edf0" stroke="#697580" stroke-width="1.5"/><circle cx="240" cy="375" r="5" fill="#36434f" stroke="#36434f" stroke-width="1.5"/><path fill="none" stroke="#697580" stroke-linecap="round" stroke-width="18" d="m290 310 140-95"/><path fill="none" stroke="#e9edf0" stroke-linecap="round" stroke-width="14" d="m290 310 140-95"/><circle cx="318" cy="291" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="346" cy="272" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="374" cy="253" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="402" cy="234" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="430" cy="215" r="145" fill="none" stroke="#b7c1c9" stroke-dasharray="6 5" stroke-width="1.5"/><path fill="none" stroke="#3d617e" stroke-linecap="round" stroke-width="18" d="M430 215v112.655"/><path fill="none" stroke="#eaf0f5" stroke-linecap="round" stroke-width="14" d="M430 215v112.655"/><rect width="20" height="32" x="420" y="327.655" fill="#eaf0f5" stroke="#3d617e" stroke-width="1.5" rx="3"/><circle cx="430" cy="215" r="6" fill="#fff" stroke="#36434f" stroke-width="1.5"/><circle cx="430" cy="215" r="2" fill="#36434f" stroke="#36434f"/><circle cx="414" cy="384" r="16" fill="#fff" stroke="#697580" stroke-width="1.5"/><circle cx="446" cy="384" r="16" fill="#fff" stroke="#697580" stroke-width="1.5"/><circle cx="430" cy="356.287" r="16" fill="#fae8e3" stroke="#a83a30" stroke-width="1.5"/><path fill="none" stroke="#3d617e" stroke-width="2.5" marker-end="url(#pom-turn)" d="M535 149a125 125 0 0 1 19 66"/><text x="530" y="98" fill="#3d617e" font-size="19" font-weight="600">STRIKER</text><text x="478" y="124" fill="#3d617e">face 1″ tall, 2″ wide</text><path fill="none" stroke="#697580" d="M585 132v151l-140 50.655"/><text x="560" y="296" fill="#a83a30" text-anchor="middle">top pom only</text><path fill="none" stroke="#a83a30" d="m545 305-100 41"/><path fill="none" stroke="#b7c1c9" d="M445 360h162m-162 40h162"/><path fill="none" stroke="#36434f" stroke-width="1.25" d="M600 360v40m5-40h-10m10 40h-10"/><text x="613" y="386" fill="#36434f" font-size="19" font-weight="600">1¼″</text><text x="544" y="452" fill="#697580" text-anchor="middle">these stay put</text><path fill="none" stroke="#697580" d="m534 435-75-39m61 39-103-35"/><path fill="none" stroke="#357458" stroke-width="2.5" marker-end="url(#car-travel)" d="M95 457h168"/><text x="179" y="484" fill="#357458" font-size="17" font-weight="600" text-anchor="middle">car creeps forward</text><text x="360" y="527" fill="#697580" font-size="15" text-anchor="middle">At the bottom of the sweep the face clears the lower poms and overlaps the top one.</text></g></svg>
