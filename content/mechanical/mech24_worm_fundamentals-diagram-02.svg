    <circle cx="446" cy="384" r="16" fill="#fff" stroke="#697580" stroke-width="1.5"/>
    <circle cx="430" cy="356.287" r="16" fill="#fae8e3" stroke="#a83a30" stroke-width="1.5"/>
    <path d="M535 149A125 125 0 0 1 554 215" fill="none" stroke="#3d617e" stroke-width="2.5" marker-end="url(#pom-turn)"/>
    <text x="530" y="98" font-size="19" fill="#3d617e" font-weight="600">STRIKER</text>
    <text x="478" y="124" font-size="16" fill="#3d617e" >face 1″ tall, 2″ wide</text>
    <path d="M585 132V283L445 333.655" fill="none" stroke="#697580" stroke-width="1" />
    <text x="560" y="296" font-size="16" fill="#a83a30" text-anchor="middle">top pom only</text>
