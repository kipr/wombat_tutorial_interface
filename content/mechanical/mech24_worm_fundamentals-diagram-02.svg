<svg viewBox="0 0 620 310" role="img" aria-label="Side view of the car. The striker arm rotates on the front, its face sweeping down to about one and a quarter inches above the surface, where it strikes the top pom of a three pom stack while the car creeps forward." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="rotN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#1F2D5A"></path>
          </marker>
          <marker id="travC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#1E8449"></path>
          </marker>
          <marker id="tkQ" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M0,1 L10,1" stroke="#444" stroke-width="1.6"></path>
          </marker>
        </defs>

        
        <line x1="30" y1="250" x2="592" y2="250" stroke="#1C1C1C" stroke-width="3"></line>

        
        <rect x="70" y="152" width="220" height="66" rx="4" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>
        <text x="180" y="192" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="15" font-weight="700" fill="#444">MOTOR &amp; CHASSIS</text>
        <circle cx="122" cy="228" r="22" fill="#1C1C1C"></circle>
        <circle cx="122" cy="228" r="7" fill="#888"></circle>
        <circle cx="242" cy="228" r="22" fill="#1C1C1C"></circle>
        <circle cx="242" cy="228" r="7" fill="#888"></circle>

        
        <circle cx="340" cy="120" r="100" fill="none" stroke="#BBB" stroke-width="1.6" stroke-dasharray="8 6"></circle>
        <circle cx="340" cy="120" r="6" fill="#444"></circle>
        <line x1="290" y1="152" x2="340" y2="120" stroke="#888" stroke-width="5"></line>

        
        <line x1="340" y1="120" x2="340" y2="196" stroke="#1F2D5A" stroke-width="9" stroke-linecap="round"></line>
        <rect x="316" y="196" width="48" height="24" rx="2" fill="#1F2D5A"></rect>
        <text x="256" y="106" font-family="'Barlow Condensed',sans-serif" font-size="15" font-weight="700" fill="#1F2D5A">STRIKER</text>
        <text x="256" y="124" font-family="'Barlow',sans-serif" font-size="12" fill="#1F2D5A">face 1″ tall, 2″ wide</text>
        <path d="M418,76 A104,104 0 0 1 434,140" fill="none" stroke="#1F2D5A" stroke-width="2.5" marker-end="url(#rotN)"></path>

        
        <line x1="392" y1="220" x2="392" y2="250" stroke="#444" stroke-width="1.6" marker-start="url(#tkQ)" marker-end="url(#tkQ)"></line>
        <text x="404" y="242" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#444">1¼″</text>

        
        <circle cx="470" cy="235" r="15" fill="#fff" stroke="#888" stroke-width="2"></circle>
        <circle cx="502" cy="235" r="15" fill="#fff" stroke="#888" stroke-width="2"></circle>
        <circle cx="486" cy="209" r="15" fill="#FADBD8" stroke="#C0392B" stroke-width="2.5"></circle>
        <text x="486" y="184" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12" font-weight="600" fill="#C0392B">top pom only</text>
        <text x="486" y="280" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12" fill="#888">these stay put</text>

        
        <line x1="120" y1="292" x2="256" y2="292" stroke="#1E8449" stroke-width="2.5" marker-end="url(#travC)"></line>
        <text x="188" y="284" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#1E8449">car creeps forward</text>
      </svg>
