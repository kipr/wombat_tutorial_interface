    <text x="613" y="386" font-size="19" fill="#36434f" font-weight="600">1¼″</text>
    <text x="544" y="452" font-size="16" fill="#697580" text-anchor="middle">these stay put</text>
    <path d="M534 435L459 396M520 435L417 400" fill="none" stroke="#697580" stroke-width="1" />
    <path d="M95 457H263" fill="none" stroke="#357458" stroke-width="2.5" marker-end="url(#car-travel)"/>
    <text x="179" y="484" font-size="17" fill="#357458" text-anchor="middle" font-weight="600">car creeps forward</text>
    <text x="360" y="527" font-size="15" fill="#697580" text-anchor="middle">At the bottom of the sweep the face clears the lower poms and overlaps the top one.</text>
  </g>
</svg>
