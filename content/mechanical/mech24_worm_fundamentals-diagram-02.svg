<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 550" role="img" aria-labelledby="striker-clearance-title striker-clearance-description">
  <title id="striker-clearance-title">Set the sweep to catch only the top pom</title>
  <desc id="striker-clearance-description">Scaled side view of a car creeping right while its front striker rotates clockwise. A one-inch-tall striker face sweeps over two one-inch poms supporting a third. The lowest point of the circular sweep is one and a quarter inches above the ground, so it intersects the top pom and clears the lower two. The face is two inches wide across the car, out of the plane of this side view. Dashed grey shows the outer sweep.</desc>
  <defs>
    <marker id="pom-turn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3d617e"/></marker><marker id="car-travel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#357458"/></marker>
  </defs>
  <rect width="720" height="550" fill="#fff"/>
  <g font-family="Barlow, Arial, sans-serif" fill="#263340" font-size="16">
    <text x="360" y="31" font-size="23" fill="#263340" text-anchor="middle" font-weight="600">Set the sweep to catch only the top pom</text>
    <text x="24" y="61" font-size="15" fill="#697580" >SIDE VIEW · the 2″ face width runs across the car.</text>
    <path d="M30 400H685" fill="none" stroke="#36434f" stroke-width="2" />
    <rect x="60" y="293" width="230" height="70" rx="3" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" />
    <text x="175" y="333" font-size="17" fill="#36434f" text-anchor="middle" font-weight="600">MOTOR &amp; CHASSIS</text>
    <circle cx="110" cy="375" r="25" fill="#36434f" stroke="#36434f" stroke-width="1.5"/>
    <circle cx="110" cy="375" r="15" fill="#e9edf0" stroke="#697580" stroke-width="1.5"/>
    <circle cx="110" cy="375" r="5" fill="#36434f" stroke="#36434f" stroke-width="1.5"/>
    <circle cx="240" cy="375" r="25" fill="#36434f" stroke="#36434f" stroke-width="1.5"/>
    <circle cx="240" cy="375" r="15" fill="#e9edf0" stroke="#697580" stroke-width="1.5"/>
    <circle cx="240" cy="375" r="5" fill="#36434f" stroke="#36434f" stroke-width="1.5"/>
    <path d="M290 310 430 215" fill="none" stroke="#697580" stroke-width="18" stroke-linecap="round"/>
    <path d="M290 310 430 215" fill="none" stroke="#e9edf0" stroke-width="14" stroke-linecap="round"/>
    <circle cx="318" cy="291" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="346" cy="272" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="374" cy="253" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="402" cy="234" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/>
    <circle cx="430" cy="215" r="145" fill="none" stroke="#b7c1c9" stroke-width="1.5" stroke-dasharray="6 5"/>
    <path d="M430 215 430 327.655" fill="none" stroke="#3d617e" stroke-width="18" stroke-linecap="round"/>
    <path d="M430 215 430 327.655" fill="none" stroke="#eaf0f5" stroke-width="14" stroke-linecap="round"/>
    <rect x="420" y="327.655" width="20" height="32" rx="3" fill="#eaf0f5" stroke="#3d617e" stroke-width="1.5" />
    <circle cx="430" cy="215" r="6" fill="#fff" stroke="#36434f" stroke-width="1.5"/>
    <circle cx="430" cy="215" r="2" fill="#36434f" stroke="#36434f" stroke-width="1"/>
