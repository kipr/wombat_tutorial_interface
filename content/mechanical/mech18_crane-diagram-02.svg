  <title id="crane-load-moments-title">The same four-bar crane at four, eight and ten inches of reach</title>
  <desc id="crane-load-moments-description">Three positions preserve exactly the same four link lengths and the same boom length. At a scale of 13 drawing units per inch, the load lines are 52, 104 and 130 units horizontally from the left base pivot. The same eight-ounce load creates moments of 32, 64 and 80 ounce-inches about that pivot. These load moments are not a direct calculation of the motor torque.</desc>
