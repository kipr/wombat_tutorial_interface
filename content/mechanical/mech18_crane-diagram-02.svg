<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="crane-load-moments-title crane-load-moments-description" role="img" viewBox="0 0 720 500"><title id="crane-load-moments-title">The same four-bar crane at four, eight and ten inches of reach</title><desc id="crane-load-moments-description">Three positions preserve exactly the same four link lengths and the same boom length. At a scale of 13 drawing units per inch, the load lines are 52, 104 and 130 units horizontally from the left base pivot. The same eight-ounce load creates moments of 32, 64 and 80 ounce-inches about that pivot. These load moments are not a direct calculation of the motor torque.</desc><defs><marker id="crane-weight" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a83a30" d="m0 0 10 5-10 5Z"/></marker></defs><path fill="#fff" d="M0 0h720v500H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="360" y="31" font-size="23" font-weight="600" text-anchor="middle">SAME 8 oz LOAD — THREE POSITIONS</text><text x="360" y="59" fill="#697580" text-anchor="middle">Measure horizontally to the load’s vertical line of action.</text><rect width="100" height="25" x="22" y="299" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="6"/><rect width="82" height="7" x="31" y="308" fill="none" stroke="#e0e5e8" rx="3"/><circle cx="38" cy="315" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="106" cy="315" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="38" cy="308" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="106" cy="308" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><path fill="none" stroke="#697580" stroke-dasharray="6 5" stroke-width="2" d="M40 299h65"/><path fill="none" stroke="#697580" stroke-linecap="round" stroke-width="18" d="m105 299-23.108-76.59"/><path fill="none" stroke="#e9edf0" stroke-linecap="round" stroke-width="14" d="m105 299-23.108-76.59"/><