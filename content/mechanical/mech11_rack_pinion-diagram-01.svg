  <title id="rack-concept-title">Every pinion tooth advances the rack by one tooth</title>
  <desc id="rack-concept-description">A pinion with exactly 24 teeth meshes with a rack of the same tooth spacing. Its counterclockwise turn moves the rack right. One full turn advances the rack by 24 tooth spaces.</desc>
