<svg viewBox="0 0 620 260" role="img" aria-label="A round pinion gear meshing with a straight toothed rack below it. As the pinion turns, its teeth walk along the rack teeth and push the rack sideways." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="travA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1E8449"></path>
          </marker>
          <marker id="rotE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"></path>
          </marker>
        </defs>

        
        <rect x="110" y="170" width="410" height="34" rx="3" fill="#F2F2F2" stroke="#444" stroke-width="2"></rect>
        
        <line x1="116" y1="163" x2="514" y2="163" stroke="#444" stroke-width="14" stroke-dasharray="11 13"></line>
        <text x="130" y="228" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700" fill="#444">RACK — a gear unrolled flat</text>

        
        <circle cx="300" cy="112" r="44" fill="#fff" stroke="#1C1C1C" stroke-width="7" stroke-dasharray="12 12"></circle>
        <circle cx="300" cy="112" r="34" fill="#fff" stroke="#CCC" stroke-width="1.5"></circle>
        <circle cx="300" cy="112" r="6" fill="#444"></circle>
        <text x="300" y="46" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="17" font-weight="700" fill="#1C1C1C">PINION</text>

        
        <path d="M244,86 A62,62 0 0 1 306,50" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#rotE)"></path>

        
        <line x1="380" y1="240" x2="520" y2="240" stroke="#1E8449" stroke-width="2.5" marker-end="url(#travA)"></line>
        <text x="450" y="232" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#1E8449">rack slides this way</text>

        
        <text x="556" y="100" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1C1C1C">1 TURN</text>
        <text x="556" y="120" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" fill="#666">moves the rack</text>
        <text x="556" y="136" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" fill="#666">by the pinion's</text>
        <text x="556" y="152" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="12.5" fill="#666">own tooth count</text>
      </svg>
