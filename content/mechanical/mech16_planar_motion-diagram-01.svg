<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="planar-freedoms-title planar-freedoms-description" role="img" viewBox="0 0 720 450"><title id="planar-freedoms-title">A platform can translate in two directions and rotate</title><desc id="planar-freedoms-description">Top view of a flat platform. A horizontal arrow marks side-to-side translation; a vertical arrow marks forward-and-back translation. A curved arrow centered on the platform marks rotation within the same plane.</desc><defs><marker id="planar-slide" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#36434f" d="m0 0 10 5-10 5Z"/></marker><marker id="planar-rotate" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a83a30" d="m0 0 10 5-10 5Z"/></marker></defs><path fill="#fff" d="M0 0h720v450H0z"/><g fill="#263340" font-family="Barlow, Arial, sans-serif" font-size="16"><text x="360" y="32" font-size="23" font-weight="600" text-anchor="middle">Three independent motions in one plane</text><text x="360" y="59" fill="#697580" text-anchor="middle">TOP VIEW — the platform stays on the surface.</text><rect width="180" height="100" x="270" y="195" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="6"/><rect width="162" height="82" x="279" y="204" fill="none" stroke="#e0e5e8" rx="3"/><circle cx="286" cy="211" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="434" cy="211" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="286" cy="279" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="434" cy="279" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><path fill="none" stroke="#b7c1c9" d="M351 245h18m-9-9v18"/><text x="360" y="252" fill="#36434f" font-size="19" font-weight="600" text-anchor="middle">PLATFORM</text><path fill="none" stroke="#36434f" stroke-width="2.2" marker-end="url(#planar-slide)" d="M362 128H234"/><path fill="none" stroke="#36434f" stroke-width="2.2" marker-end="url(#planar-slide)" d="M362 128h128"/><text x="360" y="107" fill="#36434f" font-size="17" font-weight="600" text-anchor="middle">1 · SIDE TO SIDE</text><path fill="none" stroke="#36434f" stroke-width="2.2" marker-end="url(#planar-slide)" d="M185 246v-70"/><path fill="none" stroke="#36434f" stroke-width="2.2" marker-end="url(#planar-slide)" d="M185 246v70"/><text x="92" y="238" fill="#36434f" font-weight="600" text-anchor="middle">2 · FORWARD</text><text x="92" y="262" fill="#36434f" font-weight="600" text-anchor="middle">AND BACK</text><path fill="none" stroke="#a83a30" stroke-width="2.2" marker-end="url(#planar-rotate)" d="M485.332 157.241a153 153 0 0 1-60.672 226.424"/><text x="593" y="240" fill="#a83a30" font-size="17" font-weight="600" text-anchor="middle">3 · ROTATION</text><text x="593" y="265" fill="#697580" font-size="15" text-anchor="middle">about the center</text><text x="360" y="422" fill="#36434f" font-size="17" text-anchor="middle">Three independent motions. There is no fourth.</text></g></svg>
