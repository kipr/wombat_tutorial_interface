<svg viewBox="0 0 620 340" role="img" aria-label="Diagram of a car turning right. The inner wheel follows a tighter arc than the outer wheel, so the outer wheel travels a longer path in the same amount of time." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"></path>
          </marker>
        </defs>

        
        <circle cx="80" cy="300" r="5" fill="#888888"></circle>
        <text x="92" y="322" font-family="'Barlow',sans-serif" font-size="13" fill="#888888">center of the turn</text>

        
        <path d="M240,300 A160,160 0 0 0 80,140" fill="none" stroke="#888888" stroke-width="2.5" stroke-dasharray="8 6"></path>
        
        <path d="M330,300 A250,250 0 0 0 80,50" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#ar2)"></path>

        
        <line x1="240" y1="300" x2="330" y2="300" stroke="#1C1C1C" stroke-width="4"></line>
        <rect x="232" y="291" width="17" height="18" rx="2" fill="#1C1C1C"></rect>
        <rect x="322" y="291" width="17" height="18" rx="2" fill="#1C1C1C"></rect>
        <text x="285" y="330" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="13" font-weight="600" fill="#1C1C1C">rear axle</text>

        
        <text x="196" y="176" font-family="'Barlow',sans-serif" font-size="14" font-weight="600" fill="#888888">inner wheel</text>
        <text x="196" y="195" font-family="'Barlow',sans-serif" font-size="13" fill="#888888">shorter path</text>
        <text x="330" y="112" font-family="'Barlow',sans-serif" font-size="14" font-weight="600" fill="#C0392B">outer wheel</text>
        <text x="330" y="131" font-family="'Barlow',sans-serif" font-size="13" fill="#C0392B">longer path — same amount of time</text>
      </svg>
