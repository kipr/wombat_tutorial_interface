<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="worm-pincer-build-title worm-pincer-build-description">
  <title id="worm-pincer-build-title">One worm closes two arms around an object</title>
  <desc id="worm-pincer-build-description">Top view of a stationary base carrying a motor, braced horizontal worm and two matching wheels on fixed axles. The grey solid arms are open. The red dashed arms are the same rigid arms rotated closed, with their grip pads touching opposite sides of a two-to-three-inch object. Both arms move; reversing the worm opens them again. Test the hold after switching off the motor.</desc>
