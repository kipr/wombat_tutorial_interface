<svg viewBox="0 0 620 380" role="img" aria-label="Top view. A stationary base at the left carries a worm running to the right. One gear sits above the worm and one below, each carrying a long arm that extends to the right. The two arms splay apart when open and swing together to grip an object between their tips." xmlns="http://www.w3.org/2000/svg">
