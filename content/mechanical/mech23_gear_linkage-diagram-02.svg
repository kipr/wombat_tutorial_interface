<svg viewBox="0 0 620 300" role="img" aria-label="Two explanations compared. On the left, a self-locking drive train such as a worm gear physically prevents the output from turning the input, so the effector cannot move at all. On the right, a stiff braced structure resists the load by not bending, though it may flex slightly and spring back." xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="pushB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"></path>
          </marker>
        </defs>

        
        <rect x="8" y="8" width="296" height="284" rx="8" fill="#fff" stroke="#CCC"></rect>
        <text x="24" y="34" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1F2D5A">THE DRIVE LOCKS</text>

        <rect x="46" y="120" width="120" height="30" rx="3" fill="#FDF2F2" stroke="#C0392B" stroke-width="2.5"></rect>
        <g stroke="#C0392B" stroke-width="1.8">
          <line x1="58" y1="150" x2="74" y2="120"></line><line x1="86" y1="150" x2="102" y2="120"></line>
          <line x1="114" y1="150" x2="130" y2="120"></line><line x1="142" y1="150" x2="158" y2="120"></line>
        </g>
        <circle cx="196" cy="180" r="34" fill="#fff" stroke="#1C1C1C" stroke-width="6" stroke-dasharray="12 12"></circle>
        <circle cx="196" cy="180" r="5" fill="#444"></circle>
        <line x1="230" y1="212" x2="266" y2="240" stroke="#888" stroke-width="7" stroke-linecap="round"></line>
        <line x1="266" y1="240" x2="230" y2="240" stroke="#C0392B" stroke-width="3" marker-end="url(#pushB)"></line>

        <text x="24" y="228" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#1F2D5A">Nothing moves at all.</text>
        <text x="24" y="248" font-family="'Barlow',sans-serif" font-size="12.5" fill="#666">The output cannot turn the input,</text>
        <text x="24" y="266" font-family="'Barlow',sans-serif" font-size="12.5" fill="#666">so the effector is stuck where it is.</text>
        <text x="24" y="284" font-family="'Barlow',sans-serif" font-size="12" font-weight="600" fill="#666">Challenges 9 and 10.</text>

        
        <rect x="316" y="8" width="296" height="284" rx="8" fill="#fff" stroke="#CCC"></rect>
        <text x="332" y="34" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#1E8449">THE STRUCTURE IS STIFF</text>

        <line x1="356" y1="240" x2="356" y2="120" stroke="#888" stroke-width="8" stroke-linecap="round"></line>
        <line x1="356" y1="120" x2="480" y2="200" stroke="#888" stroke-width="8" stroke-linecap="round"></line>
        <line x1="356" y1="200" x2="440" y2="200" stroke="#888" stroke-width="6" stroke-linecap="round"></line>
        <line x1="356" y1="240" x2="480" y2="200" stroke="#888" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6"></line>
        <line x1="522" y1="212" x2="486" y2="212" stroke="#C0392B" stroke-width="3" marker-end="url(#pushB)"></line>

        <text x="332" y="228" font-family="'Barlow',sans-serif" font-size="12.5" font-weight="600" fill="#1E8449">It bends a little and springs back.</text>
        <text x="332" y="248" font-family="'Barlow',sans-serif" font-size="12.5" fill="#666">Nothing is locked \u2014 the bracing</text>
        <text x="332" y="266" font-family="'Barlow',sans-serif" font-size="12.5" fill="#666">is just strong enough to resist.</text>
        <text x="332" y="284" font-family="'Barlow',sans-serif" font-size="12" font-weight="600" fill="#666">Push harder and it will give.</text>
      </svg>
