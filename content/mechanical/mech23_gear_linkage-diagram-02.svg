"><use fill="#f3f5f6" stroke="#36434f" stroke-linejoin="round" stroke-width="1.5" href="#holding-worm-wheel" transform="rotate(-90)"/><circle r="62.64" fill="none" stroke="#b7c1c9"/><circle cx="41.76" r="8.7" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cy="41.76" r="8.7" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="-41.76" r="8.7" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cy="-41.76" r="8.7" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle r="13" fill="#e9edf0" stroke="#697580" stroke-width="1.5"/><path fill="#36434f" d="M-3-8h6v5h5v6H3v5h-6V3h-5v-6h5Z"/></g><use href="#holding-worm"/></g><path fill="none" stroke="#a83a30" stroke-linecap="round" stroke-width="18" d="m205 249 81 39"/><path fill="none" stroke="#fae8e3" stroke-linecap="round" stroke-width="14" d="m205 249 81 39"/><circle cx="205" cy="249" r="6" fill="#fff" stroke="#36434f" stroke-width="1.5"/><circle cx="205" cy="249" r="2" fill="#36434f" stroke="#36434f"/><path fill="none" stroke="#a83a30" stroke-width="2.5" marker-end="url(#holding-load)" d="M332 288h-34"/><text x="25" y="337" fill="#36434f" font-size="18" font-weight="600">Nothing moves at all.</text><text x="25" y="363" fill="#697580">The output cannot turn the input,</text><text x="25" y="388" fill="#697580">so the effector is stuck where it is.</text><text x="25" y="416" fill="#697580">Challenges 9 and 10.</text><text x="25" y="461" fill="#a83a30" font-size="15">Test your drive with the power off.</text><text x="385" y="95" fill="#357458" font-size="20" font-weight="600">THE STRUCTURE IS STIFF</text><text x="385" y="122" fill="#697580" font-size="15">Bracing limits elastic deformation.</text><rect width="35" height="144" x="393" y="172" fill="#f3f5f6" stroke="#697580" stroke-width="1.5" rx="6"/><rect width="17" height="126" x="402" y="181" fill="none" stroke="#e0e5e8" rx="3"/><circle cx="409" cy="188" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="412" cy="188" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="409" cy="300" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><circle cx="412" cy="300" r="3" fill="#fff" stroke="#b7c1c9" stroke-width="1.25"/><path fill="none" stroke="#b7c1c9" stroke-dasharray="6 5" stroke-linecap="round" stroke-width="3" d="m412 186 177 81-177 35"/><path fill="none" stroke="#697580" stroke-linecap="round" stroke-width="18" d="m412 186 188 65"/><path fill="none" stroke="#e9edf0" stroke-linecap="round" stroke-width="14" d="m412 186 188 65"/><circle cx="449.6" cy="199" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="487.2" cy="212" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="524.8" cy="225" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="562.4" cy="238" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><path fill="none" stroke="#697580" stroke-linecap="round" stroke-width="18" d="m412 302 188-51"/><path fill="none" stroke="#e9edf0" stroke-linecap="round" stroke-width="14" d="m412 302 188-51"/><circle cx="449.6" cy="291.8" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="487.2" cy="281.6" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="524.8" cy="271.4" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="562.4" cy="261.2" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><path fill="none" stroke="#697580" stroke-linecap="round" stroke-width="18" d="M412 186v116"/><path fill="none" stroke="#e9edf0" stroke-linecap="round" stroke-width="14" d="M412 186v116"/><circle cx="412" cy="209.2" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="412" cy="232.4" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="412" cy="255.6" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><circle cx="412" cy="278.8" r="3.25" fill="#fff" stroke="#697580" stroke-width="1.25"/><rect width="34" height="30" x="395" y="171" fill="#e9edf0" stroke="#697580" stroke-width="1.5" rx="3"/><circle cx="412" cy="186" r="6" fill="#fff" stroke="#36434f" stroke-width="1.5"/><circle cx="412" cy="186" r="2" fill="#36434f" stroke="#36434f"/><rect width="34" height="30" x="395" y="287" fill="#e9edf0" stroke="#697580" stroke-width="1.5" rx="3"/><circle cx="412" cy="302" r="6" fill="#fff" stroke="#36434f" stroke-width="1.5"/><circle cx="412" cy="302" r="2" fill="#36434f" stroke="#36434f"/><circle cx="600" cy="251" r="6" fill="#fff" stroke="#36434f" stroke-width="1.5"/><circle cx="600" cy="251" r="2" fill="#36434f" stroke="#36434f"/><path fill="none" stroke="#a83a30" stroke-width="2.5" marker-end="url(#holding-load)" d="M675 251h-57"/><text x="385" y="337" fill="#357458" font-size="17" font-weight="600">It bends a little and springs back.</text><text x="385" y="363" fill="#697580">Nothing is locked — the bracing</text><text x="385" y="388" fill="#697580">is just strong enough to resist.</text><text x="385" y="416" fill="#697580">Push harder and it will give.</text><text x="385" y="461" fill="#697580" font-size="15">Dashed grey: exaggerated deflection.</text><text x="360" y="510" fill="#697580" font-size="15" text-anchor="middle">The same hand test separates a locked drive from flex, friction and back-driving.</text></g></svg>
