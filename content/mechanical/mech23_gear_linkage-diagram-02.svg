    <text x="25" y="337" font-size="18" fill="#36434f" font-weight="600">Nothing moves at all.</text>
    <text x="25" y="363" font-size="16" fill="#697580" >The output cannot turn the input,</text>
    <text x="25" y="388" font-size="16" fill="#697580" >so the effector is stuck where it is.</text>
    <text x="25" y="416" font-size="16" fill="#697580" >Challenges 9 and 10.</text>
    <text x="25" y="461" font-size="15" fill="#a83a30" >Test your drive with the power off.</text>
    <text x="385" y="95" font-size="20" fill="#357458" font-weight="600">THE STRUCTURE IS STIFF</text>
    <text x="385" y="122" font-size="15" fill="#697580" >Bracing limits elastic deformation.</text>
