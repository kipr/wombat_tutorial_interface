<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="holding-strategies-title holding-strategies-description" role="img" viewBox="0 0 720 533"><title id="holding-strategies-title">Find out what is resisting the load</title><desc id="holding-strategies-description">Two ways a parked effector can resist force. At left a self-locking worm drive prevents the output wheel from driving the worm backwards; test whether your own drive holds. Its single-start worm meshes with a 24-tooth wheel. At right a triangulated structure limits bending; the dashed outline exaggerates elastic deflection under a leftward force. Stiffness and self-locking are different properties.</desc><defs><clipPath id="holding-worm-clip"><rect width="235" height="46" x="248" y="168" rx="23"/></clipPath><marker id="holding-load" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a83a30" d="m0 0 10 5-10 5Z"/></marker><path id="holding-worm-wheel" d="M77.538-7.886q.172 1.941 3.977 1.65l3.158.348 3.185.867 3.189 1.24 3.177 1.564a94.25 94.25 0 0 1 0 4.434l-3.177 1.564-3.189 1.24-3.185.867-3.158.348q-3.805-.291-3.977 1.65a77.938 77.938 0 0 1-.602 4.565h0q-.335 1.919 3.416 2.623l2.96 1.153 2.852 1.663 2.76 2.022 2.663 2.334a94.25 94.25 0 0 1-1.147 4.282l-3.474.689-3.401.372-3.301.014-3.141-.482q-3.599-1.266-4.268.564a77.938 77.938 0 0 1-1.763 4.254h0q-.82 1.768 2.62 3.418l2.561 1.88 2.325 2.344 2.142 2.668 1.969 2.943a94.25 94.25 0 0 1-2.217 3.84l-3.533-.234-3.382-.521-3.192-.841-2.909-1.278q-3.149-2.154-4.269-.56a77.938 77.938 0 0 1-2.804 3.653h0q-1.25 1.495 1.646 3.979l1.987 2.479 1.639 2.866 1.379 3.131 1.14 3.353a94.25 94.25 0 0 1-3.135 3.135l-3.353-1.14-3.131-1.379-2.866-1.639-2.479-1.987q-2.484-2.896-3.979-1.646a77.938 77.938 0 0 1-3.653 2.804h0q-1.594 1.12.56 4.269l1.278 2.909.841 3.192.521 3.382.234 3.533a94.25 94.25 0 0 1-3.84 2.217l-2.943-1.969-2.668-2.142-2.344-2.325-1.88-2.561q-1.65-3.44-3.418-2.62a77.938 77.938 0 0 1-4.254 1.763h0q-1.83.669-.564