    <text x="385" y="337" font-size="17" fill="#357458" font-weight="600">It bends a little and springs back.</text>
    <text x="385" y="363" font-size="16" fill="#697580" >Nothing is locked — the bracing</text>
    <text x="385" y="388" font-size="16" fill="#697580" >is just strong enough to resist.</text>
    <text x="385" y="416" font-size="16" fill="#697580" >Push harder and it will give.</text>
    <text x="385" y="461" font-size="15" fill="#697580" >Dashed grey: exaggerated deflection.</text>
    <text x="360" y="510" font-size="15" fill="#697580" text-anchor="middle">The same hand test separates a locked drive from flex, friction and back-driving.</text>
