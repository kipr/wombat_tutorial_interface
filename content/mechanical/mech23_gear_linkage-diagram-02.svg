<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 533" role="img" aria-labelledby="holding-strategies-title holding-strategies-description">
  <title id="holding-strategies-title">Find out what is resisting the load</title>
  <desc id="holding-strategies-description">Two ways a parked effector can resist force. At left a self-locking worm drive prevents the output wheel from driving the worm backwards; test whether your own drive holds. Its single-start worm meshes with a 24-tooth wheel. At right a triangulated structure limits bending; the dashed outline exaggerates elastic deflection under a leftward force. Stiffness and self-locking are different properties.</desc>
