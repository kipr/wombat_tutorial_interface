<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 595" role="img" aria-labelledby="extension-grabber-title extension-grabber-description">
  <title id="extension-grabber-title">A supported rack-and-pinion grabber reaches beyond its base</title>
  <desc id="extension-grabber-description">Top view of a stationary base ending at the green line. A supported 24-tooth pinion lies inside the footprint, between two guided racks with matching tooth pitch and tooth-to-gap phase. Turning counterclockwise moves the left rack down and the right rack up. Both jaws close by 72 drawing units onto a four-inch cube lying entirely beyond the base. Solid grey jaws are open; dashed red jaws are closed.</desc>
