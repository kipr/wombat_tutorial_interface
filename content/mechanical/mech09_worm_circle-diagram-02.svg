<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" role="img" aria-labelledby="circle-drawer-title circle-drawer-description">
  <title id="circle-drawer-title">A horizontal motor turns a vertical shaft to draw a circle</title>
  <desc id="circle-drawer-description">Side view, with the paper and wheel shown in perspective. A motor rests flat on the table. Its worm meshes with the front rim of a wheel on a vertical shaft. An arm on that shaft holds a marker with rubber bands. The marker tip touches the paper at the end of a circular path centered on the shaft. The fixed arm length sets the radius; the goal is more than 60 seconds per turn.</desc>
