  <title
     id="title1">Three bulldozer blade shapes seen from above: straight S-blade, universal U-blade with large side wings, and the S-U combination</title>
  <g
     font-family="Barlow, sans-serif"
     font-size="13px"
     text-anchor="middle"
     id="g14">
    <text
       x="122.20045"
       y="22"
       fill="#1c1c1c"
       font-size="15px"
       font-weight="600"
       id="text1">S-Blade</text>
    <path
       d="M 52.200472,60 H 192.20048 V 76 H 52.200472 Z"
       fill="#666666"
       id="path1" />
    <path
       d="M 72.200472,100 H 172.20048"
       stroke="#c0392b"
       stroke-width="2"
       stroke-dasharray="4, 4"
       id="path2" />
    <text
       x="122.20045"
       y="120"
       fill="#666666"
       id="text2">material spreads sideways</text>
    <text
       x="122.20045"
       y="150"
       fill="#1c1c1c"
       font-size="12.5px"
       id="text3">Straight, no wings.</text>
    <text
       x="122.20045"
       y="168"
       fill="#666666"
       font-size="12.5px"
       id="text4">Good for levelling. Loses loose things.</text>
    <text
       x="365.99957"
       y="22"
       fill="#1c1c1c"
       font-size="15px"
       font-weight="600"
       id="text5">U-Blade</text>
    <path
       d="m 297.99935,60 h 136 v 16 h -136 z"
       fill="#666666"
       id="path5" />
    <path
       d="m 297.99935,60 v 50 h 16 V 76 Z"
       fill="#666666"
       id="path6" />
    <path
       d="m 433.99935,60 v 50 h -16 V 76 Z"
       fill="#666666"
       id="path7" />
    <text
       x="365.99957"
       y="132"
       fill="#666666"
       id="text7">wings hold it in</text>
    <text
       x="365.99957"
       y="150"
       fill="#1c1c1c"
       font-size="12.5px"
       id="text8">Tall, curved, big side wings.</text>
    <text
       x="365.99957"
       y="168"
       fill="#666666"
       font-size="12.5px"
       id="text9">Carries the most. Wide and heavy.</text>
    <text
       x="594.19891"
       y="22"
       fill="#1c1c1c"
       font-size="15px"
       font-weight="600"
       id="text10">S-U Blade</text>
    <path
       d="m 530.20002,60 h 128 v 16 h -128 z"
       fill="#666666"
       id="path10" />
    <path
       d="m 530.20002,60 v 32 h 14 V 76 Z"
       fill="#666666"
       id="path11" />
    <path
       d="m 658.20002,60 v 32 h -14 V 76 Z"
       fill="#666666"
       id="path12" />
    <text
       x="594.19891"
       y="132"
       fill="#666666"
       id="text12">short wings</text>
    <text
       x="594.19891"
       y="150"
       fill="#1c1c1c"
       font-size="12.5px"
       id="text13">A bit of both.</text>
    <text
       x="594.19891"
       y="168"
       fill="#666666"
       font-size="12.5px"
       id="text14">Pushes piles without being huge.</text>
  </g>
