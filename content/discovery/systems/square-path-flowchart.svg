<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 400" role="img" aria-label="A flowchart: start, then a loop of drive forward two feet and turn right, repeated four times, then stop">
  <title>A flowchart: start, then a loop of drive forward two feet and turn right, repeated four times, then stop</title>
        <defs>
          <marker id="square-path-flowchart-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
          </marker>
        </defs>
        <g font-family="Barlow, sans-serif" font-size="14" text-anchor="middle">
          <rect x="70" y="10" width="120" height="42" rx="21" fill="#1E8449"/>
          <text x="130" y="36" fill="#fff" font-weight="600">START</text>
          <line x1="130" y1="52" x2="130" y2="86" stroke="#666666" stroke-width="2" marker-end="url(#square-path-flowchart-ar)"/>
          <rect x="45" y="88" width="170" height="46" rx="4" fill="#2a6099"/>
          <text x="130" y="117" fill="#fff">Drive forward 2 feet</text>
          <line x1="130" y1="134" x2="130" y2="168" stroke="#666666" stroke-width="2" marker-end="url(#square-path-flowchart-ar)"/>
          <rect x="45" y="170" width="170" height="46" rx="4" fill="#2a6099"/>
          <text x="130" y="199" fill="#fff">Turn right 90°</text>
          <line x1="130" y1="216" x2="130" y2="248" stroke="#666666" stroke-width="2" marker-end="url(#square-path-flowchart-ar)"/>
          <path d="M130,250 L205,290 L130,330 L55,290 z" fill="#C0392B"/>
          <text x="130" y="285" fill="#ffffff" font-size="13">Done this</text>
          <text x="130" y="300" fill="#ffffff" font-size="13">4 times?</text>
          <text x="222" y="286" fill="#666666" font-size="12">no</text>
          <path d="M205,290 L238,290 L238,111 L215,111" fill="none" stroke="#666666" stroke-width="2" marker-end="url(#square-path-flowchart-ar)"/>
          <text x="112" y="348" fill="#666666" font-size="12">yes</text>
          <line x1="130" y1="330" x2="130" y2="352" stroke="#666666" stroke-width="2" marker-end="url(#square-path-flowchart-ar)"/>
          <rect x="70" y="354" width="120" height="42" rx="21" fill="#922B21"/>
          <text x="130" y="380" fill="#fff" font-weight="600">STOP</text>
        </g>
      </svg>
