  name: Deploy Hugo site to Pages

  on:
    push:
      branches: [main]
    workflow_dispatch:

  permissions:
    contents: read
    pages: write
    id-token: write

  concurrency:
    group: pages
    cancel-in-progress: false

  jobs:
    build:
      runs-on: ubuntu-slim
      env:
        HUGO_VERSION: 0.164.0

      steps:
        - name: Checkout
          uses: actions/checkout@v6

        - name: Install Hugo Extended
          run: |
            wget -O "${RUNNER_TEMP}/hugo.deb" \
              "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
            sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"

        - name: Configure Pages
          id: pages
          uses: actions/configure-pages@v5

        - name: Verify
          run: |
            hugo --buildDrafts \
              --destination "${RUNNER_TEMP}/verify" \
              --printPathWarnings \
              --logLevel error
            node tools/check_syntax_highlighting.js "${RUNNER_TEMP}/verify"
            node tests/test_lab_persistence.js
            node tests/test_glossary_dialog.js

        - name: Build production site
          env:
            HUGO_ENVIRONMENT: production
            HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          run: |
            hugo --minify \
              --destination "${RUNNER_TEMP}/site" \
              --baseURL "${{ steps.pages.outputs.base_url }}/" \
              --printPathWarnings \
              --logLevel error

        - name: Upload Pages artifact
          uses: actions/upload-pages-artifact@v4
          with:
            path: ${{ runner.temp }}/site

    deploy:
      needs: build
      runs-on: ubuntu-slim
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}

      steps:
        - name: Deploy
          id: deployment
          uses: actions/deploy-pages@v5
