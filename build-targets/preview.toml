title = 'KIPR · Botball Explorer Preview'

[params]
  buildTarget = 'preview'
  brandSuffix = 'Preview'
  titleSuffix = 'Preview'
  noIndex = true
  allowIncompleteProjectOrder = true

# The preview is a content allow-list. Keep the section _index.md files needed
# by each hub and every page/resource referenced by an included page.
[[module.mounts]]
  source = 'content'
  target = 'content'
  files = [
    '_index.md',
    'botball_explorer_2027/**',
    'introductory/_index.md',
    'introductory/coding/_index.md',
    'introductory/coding/project-01.md',
    'introductory/coding/project-02.md',
    'introductory/coding/project-15.md',
    'introductory/systems/_index.md',
    'introductory/systems/project-01.md',
    'introductory/systems/project-02.md',
    'introductory/systems/project-06.md',
    'introductory/systems/bulldozer-blade-shapes.svg',
    'full-demobot-build/**',
    'game-board-build/**',
    'glossary.md',
    'labs/_index.md',
    'labs/prelab0.md',
    'labs/prelab1.md',
    'labs/unit1_bigidea1.md',
    'labs/unit1_bigidea2.md',
    'labs/unit5_bigidea1.md',
    'python_labs/_index.md',
    'python_labs/prelab0.md',
    'python_labs/prelab1.md',
    'python_labs/unit1_bigidea1.md',
    'python_labs/unit1_bigidea2.md',
    'python_labs/unit5_bigidea1.md',
    'resources/_index.md',
    'standards-correlations/_index.md',
  ]
